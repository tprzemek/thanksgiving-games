<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Thanksgiving AI Game Night — 6 Interactive Family Games</title>
  <meta name="description" content="Six interactive AI Thanksgiving games for kids and adults: Prompt Clone, Turkey Court, Prompt Panic, Pass the Gobble Bomb, Spot the Bot, and Feast Showdown — with QR phone joining." />
  <style>
/* Thanksgiving AI Game Night — Warm Harvest Table Design System */
:root {
  --bg: #FAF4EA;
  --surface: #FFFDF8;
  --surface-alt: #F3E9D8;
  --ink: #2B1E16;
  --ink-muted: #6C5849;
  --border: #E2D4BF;
  --border-strong: #CEBAA0;

  --pumpkin: #C85A17;
  --pumpkin-dark: #A4440E;
  --cranberry: #A62629;
  --cranberry-dark: #841C1F;
  --sage: #2E6B4F;
  --sage-soft: #E5F1EA;
  --gold: #C98614;
  --gold-soft: #FBF1DA;

  --shadow-sm: 0 2px 6px rgba(43, 30, 22, 0.06);
  --shadow-md: 0 8px 24px rgba(43, 30, 22, 0.09);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;

  --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.45;
  min-height: 100%;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea, select {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

/* App Shell */
.app-shell {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 14px 48px;
}

/* Sticky Top Navigation Bar */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(250, 244, 234, 0.94);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  margin: 0 -14px 18px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}

.brand-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: none;
  border: none;
  padding: 6px 8px;
  margin-left: -6px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  text-align: left;
  transition: background 0.15s;
}
.brand-btn:hover { background: var(--surface-alt); }
.brand-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.05rem;
  letter-spacing: -0.015em;
  color: var(--ink);
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.icon-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 7px 11px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  font-size: 0.84rem;
  font-weight: 600;
  cursor: pointer;
  min-height: 38px;
  transition: transform 0.12s, background 0.15s, border-color 0.15s;
}
.icon-pill:hover { background: var(--surface-alt); }
.icon-pill:active { transform: scale(0.97); }
.icon-pill.active {
  background: var(--ink);
  color: var(--surface);
  border-color: var(--ink);
}
.icon-pill.qr-pill {
  background: var(--gold-soft);
  border-color: #DFC086;
  color: #6B4408;
}

/* Typography */
h1 {
  font-family: var(--font-display);
  font-size: clamp(1.75rem, 4.5vw, 2.5rem);
  line-height: 1.15;
  letter-spacing: -0.02em;
  margin: 0 0 8px;
  color: var(--ink);
}
h2 {
  font-family: var(--font-display);
  font-size: clamp(1.3rem, 3.2vw, 1.75rem);
  line-height: 1.2;
  letter-spacing: -0.015em;
  margin: 0 0 8px;
}
h3 {
  font-size: 1.05rem;
  font-weight: 700;
  margin: 0 0 6px;
}
.muted { color: var(--ink-muted); }
.small { font-size: 0.87rem; }
.xs { font-size: 0.78rem; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.center { text-align: center; }

/* Cards & Panels */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 18px;
  box-shadow: var(--shadow-sm);
}
.card-warm {
  background: var(--surface-alt);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  padding: 16px;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 18px;
  min-height: 48px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--ink);
  font-weight: 700;
  font-size: 0.96rem;
  cursor: pointer;
  transition: transform 0.1s, background 0.15s, box-shadow 0.15s;
  text-decoration: none;
}
.btn:hover { background: var(--surface-alt); }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

.btn-primary {
  background: var(--pumpkin);
  border-color: var(--pumpkin);
  color: #FFFDF8;
  box-shadow: 0 3px 10px rgba(200, 90, 23, 0.24);
}
.btn-primary:hover { background: var(--pumpkin-dark); border-color: var(--pumpkin-dark); }

.btn-danger {
  background: var(--cranberry);
  border-color: var(--cranberry);
  color: #FFFDF8;
  box-shadow: 0 3px 10px rgba(166, 38, 41, 0.24);
}
.btn-danger:hover { background: var(--cranberry-dark); border-color: var(--cranberry-dark); }

.btn-success {
  background: var(--sage);
  border-color: var(--sage);
  color: #FFFDF8;
}
.btn-success:hover { background: #23553E; }

.btn-lg {
  min-height: 58px;
  font-size: 1.08rem;
  padding: 14px 24px;
  border-radius: 14px;
}
.btn-xl {
  min-height: 82px;
  font-size: 1.3rem;
  padding: 18px 28px;
  border-radius: 18px;
  width: 100%;
}
.btn-sm {
  min-height: 36px;
  padding: 6px 12px;
  font-size: 0.85rem;
}
.btn-block { width: 100%; }

/* Inputs */
.input, .textarea, .select {
  width: 100%;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border-strong);
  background: #FFFFFF;
  color: var(--ink);
  font-size: 1rem;
  transition: border-color 0.15s;
}
.input:focus, .textarea:focus, .select:focus {
  outline: none;
  border-color: var(--pumpkin);
}
.textarea { min-height: 92px; resize: vertical; line-height: 1.45; }

/* Layout helpers */
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 660px) {
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
}

/* Hero & Game Hub */
.hub-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.hub-sub { max-width: 580px; margin: 0; color: var(--ink-muted); font-size: 1rem; }

.game-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
@media (max-width: 680px) {
  .game-grid { grid-template-columns: 1fr; }
}

.game-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
  cursor: pointer;
  text-align: left;
  box-shadow: var(--shadow-sm);
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
}
.game-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
  border-color: var(--border-strong);
}
.game-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}
.game-icon {
  width: 48px;
  height: 48px;
  border-radius: 13px;
  background: var(--surface-alt);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.65rem;
  flex-shrink: 0;
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 700;
  background: var(--surface-alt);
  color: var(--ink-muted);
}
.tag-new { background: var(--cranberry); color: #FFF; }
.tag-kid { background: var(--sage-soft); color: var(--sage); }
.tag-gold { background: var(--gold-soft); color: #7C5006; }

/* Player Chips */
.roster-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.player-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 11px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  font-size: 0.88rem;
  font-weight: 600;
}
.player-chip .pts {
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--pumpkin);
}
.player-chip .rm {
  background: none;
  border: none;
  color: var(--ink-muted);
  cursor: pointer;
  padding: 0 2px;
  font-size: 1rem;
  line-height: 1;
}

/* Timers & Banners */
.timer-box {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: 999px;
  background: var(--surface-alt);
  border: 1px solid var(--border-strong);
  font-family: var(--font-mono);
  font-size: 1.35rem;
  font-weight: 800;
}
.timer-box.urgent {
  background: var(--cranberry);
  border-color: var(--cranberry);
  color: #FFF;
  animation: pulseFast 0.6s infinite alternate;
}

.countdown-banner {
  position: sticky;
  top: 6px;
  z-index: 30;
  background: var(--surface);
  border: 2px solid var(--pumpkin);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  box-shadow: 0 6px 20px rgba(43, 30, 22, 0.14);
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: background 0.25s, border-color 0.25s, color 0.25s;
}
.countdown-banner .cd-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.countdown-banner .cd-time {
  font-family: var(--font-mono);
  font-size: clamp(1.6rem, 4.8vw, 2.2rem);
  font-weight: 900;
  line-height: 1;
  color: var(--pumpkin-dark);
}
.countdown-banner .cd-msg {
  font-size: 0.9rem;
  font-weight: 800;
  color: var(--ink);
}
.countdown-banner .cd-track {
  width: 100%;
  height: 8px;
  border-radius: 999px;
  background: rgba(43, 30, 22, 0.12);
  overflow: hidden;
}
.countdown-banner .cd-fill {
  height: 100%;
  border-radius: 999px;
  background: var(--pumpkin);
  transition: width 0.25s linear, background 0.25s;
}
.countdown-banner.warn {
  background: #FFF3D1;
  border-color: #D48806;
}
.countdown-banner.warn .cd-time { color: #9A5B00; }
.countdown-banner.warn .cd-msg { color: #7C4700; }
.countdown-banner.warn .cd-fill { background: #E09100; }
.countdown-banner.urgent {
  background: var(--cranberry);
  border-color: var(--cranberry-dark);
  color: #FFF;
  animation: pulseFast 0.55s infinite alternate;
}
.countdown-banner.urgent .cd-time,
.countdown-banner.urgent .cd-msg { color: #FFF; }
.countdown-banner.urgent .cd-track { background: rgba(255, 255, 255, 0.28); }
.countdown-banner.urgent .cd-fill { background: #FFE066; }

.twist-banner {
  background: var(--cranberry);
  color: #FFFDF8;
  border-radius: var(--radius-md);
  padding: 16px 18px;
  font-weight: 700;
  font-size: 1.08rem;
  animation: shakePop 0.45s ease;
}

/* Canvas & Image Frames */
.art-frame {
  position: relative;
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  border-radius: var(--radius-md);
  overflow: hidden;
  border: 2px solid var(--border-strong);
  background: #EFE4D2;
  aspect-ratio: 440 / 300;
}
.art-frame canvas, .art-frame img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  transition: filter 0.35s linear;
}

/* Split-Screen Multi-Player Buzzers */
.buzzer-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
  gap: 10px;
}
.buzzer-pad {
  min-height: 76px;
  border-radius: 14px;
  border: 2px solid var(--border-strong);
  background: var(--surface);
  font-weight: 800;
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 10px;
  transition: transform 0.08s, background 0.12s;
  box-shadow: 0 4px 0 var(--border-strong);
}
.buzzer-pad:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--border-strong);
}
.buzzer-pad.buzzed {
  background: var(--pumpkin);
  border-color: var(--pumpkin-dark);
  color: #FFF;
  box-shadow: 0 4px 0 var(--pumpkin-dark);
}
.buzzer-pad.bot-slam {
  background: var(--cranberry);
  border-color: var(--cranberry-dark);
  color: #FFF;
  box-shadow: 0 4px 0 var(--cranberry-dark);
}

/* Quick-tap prompt chips */
.chip-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip {
  padding: 6px 11px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  font-size: 0.83rem;
  font-weight: 600;
  cursor: pointer;
}
.chip:hover { background: var(--surface-alt); }

/* Gobble Bomb Stage */
.bomb-stage {
  text-align: center;
  padding: 24px 18px;
  border-radius: var(--radius-lg);
  background: var(--surface);
  border: 2px solid var(--border-strong);
  transition: background 0.3s, border-color 0.3s;
}
.bomb-stage.hot {
  background: #FFF1EE;
  border-color: var(--cranberry);
}
.bomb-emoji {
  font-size: 4.5rem;
  line-height: 1;
  display: inline-block;
  animation: bombBeat 0.75s infinite alternate;
}
.twist-word-big {
  font-family: var(--font-display);
  font-size: clamp(1.9rem, 6vw, 3rem);
  font-weight: 700;
  color: var(--pumpkin);
  margin: 8px 0;
  letter-spacing: -0.02em;
}

/* Prompt Clone Gallery & Match Meter */
.clone-gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 14px;
}
.clone-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.clone-card.winner {
  border: 2px solid var(--gold);
  box-shadow: var(--shadow-md);
}
.clone-card-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.meter-track {
  width: 100%;
  height: 10px;
  border-radius: 999px;
  background: var(--surface-alt);
  overflow: hidden;
}
.meter-fill {
  height: 100%;
  border-radius: 999px;
  background: var(--sage);
  transition: width 0.6s ease;
}

/* Transparent Scoring Guide & Per-Card Standing/Math Boxes */
.score-guide {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  padding: 12px 14px;
}
.score-guide summary {
  cursor: pointer;
  font-weight: 800;
  font-size: 0.92rem;
  color: var(--ink);
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.score-guide summary::-webkit-details-marker { display: none; }
.score-guide .guide-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
  gap: 8px;
  margin-top: 10px;
}
.score-guide .guide-item {
  background: var(--surface-alt);
  border-radius: 10px;
  padding: 8px 10px;
  font-size: 0.8rem;
  line-height: 1.4;
}
.standing-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--ink-muted);
  background: #FAF3E8;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 9px;
}
.standing-bar.first {
  background: #FFF6DC;
  border-color: var(--gold);
  color: #7C5006;
}
.judge-box {
  background: var(--surface-alt);
  border-left: 3px solid var(--pumpkin);
  border-radius: 0 8px 8px 0;
  padding: 7px 10px;
  font-size: 0.8rem;
  line-height: 1.4;
  color: var(--ink);
}
.score-math-box {
  background: #F6F8F4;
  border: 1px solid rgba(74, 117, 72, 0.28);
  border-radius: 8px;
  padding: 7px 10px;
  font-size: 0.76rem;
  line-height: 1.45;
  color: var(--ink);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.score-math-box .math-total {
  font-weight: 800;
  color: var(--pumpkin-dark);
}
.winner-why-box {
  background: linear-gradient(135deg, #FFF9E6 0%, #FFF2D1 100%);
  border: 1.5px solid var(--gold);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.winner-why-box .why-title {
  font-weight: 800;
  font-size: 0.92rem;
  color: #6B4200;
}
.winner-why-box ul {
  margin: 0;
  padding-left: 18px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 0.81rem;
  line-height: 1.4;
  color: var(--ink);
}
.axis-grid {
  display: flex;
  flex-direction: column;
  gap: 5px;
  background: #FAF7F2;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
}
.axis-row {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.axis-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 0.74rem;
  font-weight: 700;
}
.axis-note {
  font-size: 0.7rem;
  color: var(--ink-muted);
  line-height: 1.25;
}
.axis-track {
  width: 100%;
  height: 6px;
  border-radius: 999px;
  background: rgba(43, 30, 22, 0.1);
  overflow: hidden;
}
.axis-fill {
  height: 100%;
  border-radius: 999px;
}

/* Spot the Bot Answer Card */
.bot-reveal-card {
  background: var(--surface);
  border: 2px solid var(--border-strong);
  border-radius: var(--radius-lg);
  padding: 26px 20px;
  text-align: center;
  font-family: var(--font-display);
  font-size: clamp(1.25rem, 3.6vw, 1.75rem);
  line-height: 1.35;
  box-shadow: var(--shadow-md);
}

/* Modal Overlay */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: rgba(28, 20, 16, 0.56);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 20px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
}

.qr-box {
  width: 220px;
  height: 220px;
  margin: 0 auto;
  padding: 12px;
  background: #FFFFFF;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
}
.qr-box svg { width: 100%; height: 100%; display: block; }

/* Phone Controller Mode */
.controller-shell {
  max-width: 460px;
  margin: 0 auto;
  padding: 16px 14px 40px;
}
.controller-buzzer {
  width: 100%;
  min-height: 170px;
  border-radius: 26px;
  border: none;
  background: var(--cranberry);
  color: #FFF;
  font-size: 1.7rem;

    let x = 1;

      LOG[x] = i;
      x <<= 1;
      if (x & 0x100) x ^= 0x11d;

    for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];

    return EXP[LOG[a] + LOG[b]];

    let poly = [1];

    [26, 10, [[1, 16]], []],
    [44, 16, [[1, 28]], [6, 18]],
    [70, 26, [[1, 44]], [6, 22]],
    [100, 18, [[2, 32]], [6, 26]],
    [134, 24, [[2, 43]], [6, 30]],
    [172, 16, [[4, 27]], [6, 34]],
    [196, 18, [[4, 31]], [6, 22, 38]],
    [242, 22, [[2, 38], [2, 39]], [6, 24, 42]],
    [292, 22, [[3, 36], [2, 37]], [6, 26, 46]],

        if (run >= 5) score += run - 2;

const SoundFX = (() => {
  let ctx = null;
  let muted = false;
  let voiceEnabled = true;

  function ensureCtx() {
    if (muted) return null;
    if (!ctx && typeof window !== 'undefined') {

      if (AC) ctx = new AC();

      try { ensureCtx(); } catch (_) {}

    window.addEventListener('touchstart', unlock, { passive: true });
    window.addEventListener('keydown', unlock, { passive: true });
  }

    const c = ensureCtx();
    if (!c) return;
    const now = c.currentTime + delay;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(0.001, now);
    g.gain.exponentialRampToValueAtTime(gainVal, now + 0.015);
    g.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(g);
    g.connect(c.destination);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  }

    const c = ensureCtx();
    if (!c) return;
    const now = c.currentTime + delay;
    const len = Math.floor(c.sampleRate * duration);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.35));

    src.buffer = buf;
    const filt = c.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(filterFreq, now);
    const g = c.createGain();
    g.gain.setValueAtTime(gainVal, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + duration);

    filt.connect(g);
    g.connect(c.destination);
    src.start(now);

    isVoiceOn: () => voiceEnabled,
    toggleMute() { muted = !muted; if (muted) this.stopSpeech(); return muted; },
    toggleVoice() { voiceEnabled = !voiceEnabled; if (!voiceEnabled) this.stopSpeech(); return voiceEnabled; },

    },
    warn15() {

      try { rec.start(); } catch (err) { onError && onError(err.message); }
      return rec;
    }
  };
})();

  function parsePrompt(rawPrompt) {
    const text = (rawPrompt || '').toLowerCase();
    const matchRule = (rules) => rules.filter(r => r.words.some(w => text.includes(w)));

    const scenes = matchRule(SCENE_RULES);
    const styles = matchRule(STYLE_RULES);
    const weathers = matchRule(WEATHER_RULES);
    const subjects = matchRule(SUBJECT_RULES);
    const props = matchRule(PROP_RULES);

    const colors = [];
    for (const [name, hex] of Object.entries(COLOR_MAP)) {
      const rx = new RegExp(`\\b${name}\\b`, 'i');
      if (rx.test(text)) colors.push({ name, hex });
    }

    let count = 1;
    if (/\b(three|3)\b/.test(text)) count = 3;
    else if (/\b(two|2|pair|twin|couple|double)\b/.test(text)) count = 2;
    else if (/\b(giant|huge|massive|mega|enormous)\b/.test(text)) count = 1.35;
    else if (/\b(tiny|mini|little|small|baby)\b/.test(text)) count = 0.72;

    return {
      raw: rawPrompt || '',
      scene: scenes[0]?.key || 'forest',
      sceneLabel: scenes[0]?.label || 'Autumn Scene',
      style: styles[0]?.key || 'storybook',
      styleLabel: styles[0]?.label || 'Storybook',
      weathers: weathers.map(w => w.key),
      weatherLabels: weathers.map(w => w.label),
      subjects: subjects.length ? subjects.slice(0, 3).map(s => s.key) : ['turkey'],
      subjectLabels: subjects.length ? subjects.slice(0, 3).map(s => s.label) : ['Turkey'],
      props: props.map(p => p.key),
      propLabels: props.map(p => p.label),
      colors,
      count,
    };
  }

  // ---- Drawing helpers ----
  function drawBackground(ctx, w, h, parsed, rng) {
    const tint = parsed.colors[0]?.hex;
    const grad = ctx.createLinearGradient(0, 0, 0, h);

    switch (parsed.scene) {
      case 'space':
        grad.addColorStop(0, '#0B1026');
        grad.addColorStop(0.65, '#1B234A');
        grad.addColorStop(1, '#3D2748');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        // Stars
        for (let i = 0; i < 65; i++) {
          ctx.fillStyle = `rgba(255,250,230,${0.35 + rng() * 0.65})`;
          ctx.beginPath();
          ctx.arc(rng() * w, rng() * h * 0.78, 0.8 + rng() * 2, 0, Math.PI * 2);
          ctx.fill();
        }
        // Ringed planet
        ctx.save();
        ctx.translate(w * 0.8, h * 0.22);
        ctx.fillStyle = tint && tint !== 'rainbow' ? tint : '#E58A4E';
        ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#F7D794'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.ellipse(0, 2, 44, 11, -0.22, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
        // Crater surface
        ctx.fillStyle = '#B85A3A';
        ctx.beginPath();
        ctx.moveTo(0, h * 0.74);
        ctx.quadraticCurveTo(w * 0.5, h * 0.66, w, h * 0.76);
        ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#8F3F26';
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.ellipse(w * (0.15 + i * 0.24), h * (0.83 + (i % 2) * 0.06), 24, 8, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        break;

      case 'beach':
        grad.addColorStop(0, '#58B4E8');
        grad.addColorStop(0.55, '#A9E4F7');
        grad.addColorStop(1, '#FFE6A7');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        // Sun
        ctx.fillStyle = '#FFD15C';
        ctx.beginPath(); ctx.arc(w * 0.82, h * 0.2, 28, 0, Math.PI * 2); ctx.fill();
        // Ocean
        ctx.fillStyle = '#2B8CBE';
        ctx.fillRect(0, h * 0.58, w, h * 0.22);
        ctx.fillStyle = '#7FD1E8';
        for (let i = 0; i < 6; i++) {
          ctx.fillRect(20 + i * 75, h * 0.64 + (i % 2) * 10, 40, 4);
        }
        // Sand
        ctx.fillStyle = '#F2CF8D';
        ctx.beginPath();
        ctx.moveTo(0, h * 0.74);
        ctx.quadraticCurveTo(w * 0.45, h * 0.68, w, h * 0.78);
        ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fill();
        // Palm tree silhouette
        ctx.strokeStyle = '#7D512D'; ctx.lineWidth = 10;
        ctx.beginPath(); ctx.moveTo(w * 0.12, h * 0.84); ctx.quadraticCurveTo(w * 0.17, h * 0.52, w * 0.2, h * 0.34); ctx.stroke();
        ctx.fillStyle = '#3A874D';
        for (let a = 0; a < 5; a++) {
          ctx.save(); ctx.translate(w * 0.2, h * 0.34); ctx.rotate(-2.4 + a * 1.15);
          ctx.beginPath(); ctx.ellipse(26, 0, 30, 8, 0.2, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }
        break;

      case 'snow':
        grad.addColorStop(0, '#4E7AA8');
        grad.addColorStop(0.6, '#A9CBE8');
        grad.addColorStop(1, '#EFF6FC');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        // Mountains
        const peaks = [[0.18, 0.32], [0.52, 0.26], [0.85, 0.36]];
        peaks.forEach(([px, py]) => {
          ctx.fillStyle = '#7395B8';
          ctx.beginPath(); ctx.moveTo(w * (px - 0.28), h * 0.78); ctx.lineTo(w * px, h * py); ctx.lineTo(w * (px + 0.28), h * 0.78); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath(); ctx.moveTo(w * (px - 0.09), h * (py + 0.16)); ctx.lineTo(w * px, h * py); ctx.lineTo(w * (px + 0.09), h * (py + 0.16)); ctx.closePath(); ctx.fill();
        });
        ctx.fillStyle = '#F7FBFF';
        ctx.fillRect(0, h * 0.72, w, h * 0.28);
        break;

      case 'volcano':
        grad.addColorStop(0, '#3D1518');
        grad.addColorStop(0.6, '#962E22');
        grad.addColorStop(1, '#E87424');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#4A2C2A';
        ctx.beginPath(); ctx.moveTo(w * 0.12, h * 0.8); ctx.lineTo(w * 0.44, h * 0.28); ctx.lineTo(w * 0.56, h * 0.28); ctx.lineTo(w * 0.88, h * 0.8); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#FF9F1C';
        ctx.beginPath(); ctx.moveTo(w * 0.45, h * 0.28); ctx.quadraticCurveTo(w * 0.5, h * 0.52, w * 0.43, h * 0.78); ctx.lineTo(w * 0.55, h * 0.78); ctx.quadraticCurveTo(w * 0.53, h * 0.48, w * 0.55, h * 0.28); ctx.fill();
        ctx.fillStyle = '#3B2320'; ctx.fillRect(0, h * 0.75, w, h * 0.25);
        break;

      case 'city':
        grad.addColorStop(0, '#1D2944');
        grad.addColorStop(0.6, '#485A82');
        grad.addColorStop(1, '#E08E6D');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        // Buildings
        for (let i = 0; i < 9; i++) {
          const bw = 42 + (i % 3) * 14;
          const bh = 80 + ((i * 37) % 110);
          const bx = i * 52;
          ctx.fillStyle = i % 2 ? '#23304A' : '#2E3D5C';
          ctx.fillRect(bx, h * 0.76 - bh, bw, bh);
          ctx.fillStyle = '#FCD36B';
          for (let wy = h * 0.76 - bh + 12; wy < h * 0.72; wy += 16) {
            for (let wx = bx + 8; wx < bx + bw - 10; wx += 12) {
              if ((wx + wy) % 3 !== 0) ctx.fillRect(wx, wy, 6, 8);
            }
          }
        }
        ctx.fillStyle = '#3C4048'; ctx.fillRect(0, h * 0.75, w, h * 0.25);
        ctx.fillStyle = '#F2C14E';
        for (let x = 15; x < w; x += 55) ctx.fillRect(x, h * 0.87, 30, 5);
        break;

      case 'kitchen':
        grad.addColorStop(0, '#F7E7CE');
        grad.addColorStop(1, '#E8CCA5');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        // Window
        ctx.fillStyle = '#9ED0E8'; ctx.fillRect(w * 0.68, h * 0.12, 95, 75);
        ctx.strokeStyle = '#8C5A32'; ctx.lineWidth = 5;
        ctx.strokeRect(w * 0.68, h * 0.12, 95, 75);
        ctx.beginPath(); ctx.moveTo(w * 0.68 + 47.5, h * 0.12); ctx.lineTo(w * 0.68 + 47.5, h * 0.12 + 75); ctx.stroke();
        // Tablecloth & wooden table
        ctx.fillStyle = '#9E2A2B';
        ctx.fillRect(0, h * 0.68, w, h * 0.32);
        ctx.fillStyle = '#FAF2E4';
        for (let x = 0; x < w; x += 40) ctx.fillRect(x, h * 0.68, 20, h * 0.32);
        ctx.fillStyle = 'rgba(158,42,43,0.45)';
        ctx.fillRect(0, h * 0.68, w, 14);
        break;

      case 'underwater':
        grad.addColorStop(0, '#167D9A');
        grad.addColorStop(0.7, '#0D4B68');
        grad.addColorStop(1, '#0A2D42');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        // Bubbles
        ctx.strokeStyle = 'rgba(200,245,255,0.55)'; ctx.lineWidth = 2;
        for (let i = 0; i < 18; i++) {
          ctx.beginPath(); ctx.arc(rng() * w, rng() * h * 0.8, 3 + rng() * 9, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.fillStyle = '#D9B982'; ctx.fillRect(0, h * 0.78, w, h * 0.22);
        break;

      case 'night':
        grad.addColorStop(0, '#0F172A');
        grad.addColorStop(0.7, '#1E294B');
        grad.addColorStop(1, '#312E59');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        // Crescent Moon
        ctx.fillStyle = '#FDE68A';
        ctx.beginPath(); ctx.arc(w * 0.8, h * 0.2, 26, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#141D35';
        ctx.beginPath(); ctx.arc(w * 0.83, h * 0.18, 22, 0, Math.PI * 2); ctx.fill();
        for (let i = 0; i < 45; i++) {
          ctx.fillStyle = '#FEF9C3';
          ctx.beginPath(); ctx.arc(rng() * w, rng() * h * 0.68, 1 + rng() * 1.8, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = '#1D332B'; ctx.fillRect(0, h * 0.74, w, h * 0.26);
        break;

      case 'sunset':
        grad.addColorStop(0, '#4E3168');
        grad.addColorStop(0.45, '#D95D39');
        grad.addColorStop(0.85, '#F4B942');
        grad.addColorStop(1, '#FFE19C');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#FFF3B0';
        ctx.beginPath(); ctx.arc(w * 0.5, h * 0.62, 44, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#5E3828';
        ctx.beginPath(); ctx.moveTo(0, h * 0.72); ctx.quadraticCurveTo(w * 0.35, h * 0.64, w, h * 0.74); ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fill();
        break;

      default: // Autumn woods
        grad.addColorStop(0, '#8EC5E8');
        grad.addColorStop(0.55, '#F5DFC0');
        grad.addColorStop(1, '#EBB678');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        // Warm sun
        ctx.fillStyle = 'rgba(255,232,163,0.9)';
        ctx.beginPath(); ctx.arc(w * 0.82, h * 0.2, 26, 0, Math.PI * 2); ctx.fill();
        // Rolling autumn hills
        ctx.fillStyle = '#C97B36';
        ctx.beginPath(); ctx.moveTo(0, h * 0.66); ctx.quadraticCurveTo(w * 0.3, h * 0.54, w * 0.65, h * 0.68); ctx.quadraticCurveTo(w * 0.88, h * 0.74, w, h * 0.62); ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fill();
        // Autumn trees
        const treeCols = ['#B83B28', '#D97224', '#DF9F28', '#8F3524'];
        for (let i = 0; i < 4; i++) {
          const tx = w * (0.12 + i * 0.25);
          const ty = h * 0.64;
          ctx.fillStyle = '#5C3A21'; ctx.fillRect(tx - 5, ty - 25, 10, 34);
          ctx.fillStyle = treeCols[i % treeCols.length];
          ctx.beginPath(); ctx.arc(tx, ty - 38, 24, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = '#6E8542';
        ctx.beginPath(); ctx.moveTo(0, h * 0.74); ctx.quadraticCurveTo(w * 0.5, h * 0.68, w, h * 0.76); ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fill();
        break;
    }

    // Subtle color tint wash if user explicitly mentioned a standout color
    if (tint && tint !== 'rainbow') {
      ctx.fillStyle = tint + '1C';
      ctx.fillRect(0, 0, w, h);
    }
  }

  function drawWeather(ctx, w, h, parsed, rng) {
    if (parsed.weathers.includes('rainbow') || parsed.colors.some(c => c.name === 'rainbow')) {
      const cols = ['#E63946', '#F48C06', '#F9C74F', '#43AA8B', '#3A86FF', '#8338EC'];
      cols.forEach((col, i) => {
        ctx.strokeStyle = col; ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.arc(w * 0.5, h * 0.72, 175 - i * 7, Math.PI, 0);
        ctx.stroke();
      });
    }
    if (parsed.weathers.includes('snowflakes') || parsed.scene === 'snow') {
      ctx.fillStyle = 'rgba(255,255,255,0.88)';
      for (let i = 0; i < 36; i++) {
        ctx.beginPath(); ctx.arc(rng() * w, rng() * h, 1.8 + rng() * 3, 0, Math.PI * 2); ctx.fill();
      }
    }
    if (parsed.weathers.includes('leaves')) {
      const leafCols = ['#D64528', '#E08E24', '#C4382B', '#EBB134'];
      for (let i = 0; i < 22; i++) {
        ctx.save();
        ctx.translate(rng() * w, rng() * h * 0.85);
        ctx.rotate(rng() * Math.PI * 2);
        ctx.fillStyle = leafCols[i % leafCols.length];
        ctx.beginPath(); ctx.ellipse(0, 0, 8, 4, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    }
    if (parsed.weathers.includes('fireworks')) {
      const bursts = [[w * 0.25, h * 0.24, '#FF595E'], [w * 0.75, h * 0.22, '#FFCA3A'], [w * 0.5, h * 0.16, '#8AC926']];
      bursts.forEach(([bx, by, col]) => {
        ctx.strokeStyle = col; ctx.lineWidth = 2.5;
        for (let a = 0; a < 12; a++) {
          const ang = (a / 12) * Math.PI * 2;
          ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + Math.cos(ang) * 26, by + Math.sin(ang) * 26); ctx.stroke();
        }
      });
    }
    if (parsed.weathers.includes('rain')) {
      ctx.strokeStyle = 'rgba(180,220,255,0.6)'; ctx.lineWidth = 1.6;
      for (let i = 0; i < 45; i++) {
        const rx = rng() * w, ry = rng() * h;
        ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx - 5, ry + 16); ctx.stroke();
      }
    }
  }

  function drawHat(ctx, propKey, x, y, scale = 1) {
    ctx.save();
    ctx.translate(x, y);

      g.addColorStop(0, 'rgba(255,0,160,0.28)');
      g.addColorStop(1, 'rgba(0,245,255,0.28)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'source-over';
    } else if (style === 'sketch') {
      const img = ctx.getImageData(0, 0, w, h);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        const v = lum > 155 ? 248 : lum > 95 ? 165 : 42;
        d[i] = v; d[i + 1] = v - 3; d[i + 2] = v - 8;
      }
      ctx.putImageData(img, 0, 0);
    } else if (style === 'watercolor') {
      ctx.fillStyle = 'rgba(255,248,238,0.18)';
      ctx.fillRect(0, 0, w, h);
    }

  function renderToCanvas(canvas, prompt) {
    const w = canvas.width || 440;
    const h = canvas.height || 300;
    const ctx = canvas.getContext('2d');
    const parsed = parsePrompt(prompt);
    const rng = makeRng(prompt);

    ctx.clearRect(0, 0, w, h);
    drawBackground(ctx, w, h, parsed, rng);
    drawWeather(ctx, w, h, parsed, rng);

    const accent = parsed.colors[0]?.hex || null;
    const subs = parsed.subjects;
    const baseScale = typeof parsed.count === 'number' && parsed.count < 2 ? parsed.count : 1;

    if (subs.length === 1 && (parsed.count === 2 || parsed.count === 3)) {
      const n = parsed.count;
      for (let i = 0; i < n; i++) {
        const px = w * ((i + 1) / (n + 1));
        const py = h * 0.62 + (i % 2 === 0 ? 0 : -10);
        drawSubject(ctx, subs[0], px, py, n === 3 ? 0.78 : 0.9, accent, parsed.props);
      }
    } else {
      subs.forEach((sub, idx) => {
        const total = subs.length;
        const px = total === 1 ? w * 0.5 : w * (0.24 + (idx / (total - 1)) * 0.52);
        const py = h * (idx === 0 ? 0.62 : 0.65);
        const sc = (total === 1 ? 1.05 : total === 2 ? 0.88 : 0.74) * baseScale;
        drawSubject(ctx, sub, px, py, sc, idx === 0 ? accent : null, idx === 0 ? parsed.props : []);
      });
    }

    applyStyleFilter(canvas, ctx, parsed.style);
    return parsed;
  }

  function renderDataURL(prompt, w = 440, h = 300) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const parsed = renderToCanvas(c, prompt);
    return { dataUrl: c.toDataURL('image/png'), parsed, canvas: c };
  }

  // Compute perceptual visual similarity between two canvases (0..100)
  function compareCanvases(c1, c2) {
    const gw = 24, gh = 16;
    const sample = (src) => {
      const t = document.createElement('canvas');
      t.width = gw; t.height = gh;
      const g = t.getContext('2d');
      g.drawImage(src, 0, 0, gw, gh);
      return g.getImageData(0, 0, gw, gh).data;
    };
    const d1 = sample(c1);
    const d2 = sample(c2);
    let diffSum = 0;
    const n = gw * gh;
    for (let i = 0; i < d1.length; i += 4) {
      const dr = d1[i] - d2[i];
      const dg = d1[i + 1] - d2[i + 1];
      const db = d1[i + 2] - d2[i + 2];
      diffSum += Math.sqrt(dr * dr + dg * dg + db * db) / 441.67;
    }
    const sim = Math.max(0, 1 - (diffSum / n) * 1.45);
    return Math.round(sim * 100);
  }

  const STOP_WORDS = new Set([
    'the','and','with','from','that','this','into','onto','over','under','near','next','beside','inside',
    'wearing','holding','riding','sitting','standing','looking','very','cute','nice','good','cool','style',
    'image','picture','photo','illustration','drawing','painting','scene','background','foreground','front',
    'back','side','left','right','center','middle','there','their','they','them','some','many','more','most',
    'like','looks','made','have','has','are','was','were','for','its','his','her','you','your','who','what',
  ]);

  function extractTokens(text) {
    return String(text || '')
      .toLowerCase()
      .replace(/[^a-z0-9\s-]/g, ' ')
      .split(/[\s-]+/)
      .map(w => w.replace(/(ing|ed|es|s)$/, w.length > 5 ? '' : '$1'))
      .filter(w => w.length >= 3 && !STOP_WORDS.has(w));
  }

  function lexicalMatch(targetPrompt, userPrompt) {
    const tToks = [...new Set(extractTokens(targetPrompt))];
    const uToks = [...new Set(extractTokens(userPrompt))];
    if (!tToks.length || !uToks.length) return { pct: 10, matched: [], missed: tToks };
    const matched = [];
    const missed = [];
    for (const tw of tToks) {
      const hit = uToks.some(uw =>
        uw === tw ||
        (tw.length >= 4 && uw.startsWith(tw.slice(0, 4))) ||
        (uw.length >= 4 && tw.startsWith(uw.slice(0, 4)))
      );
      if (hit) matched.push(tw);
      else missed.push(tw);
    }
    const recall = matched.length / tToks.length;
    const precision = matched.length / Math.max(1, uToks.length);
    // Weighted toward recall (catching target concepts) with precision & detail richness bonus
    const raw = recall * 0.78 + precision * 0.22;
    const pct = Math.max(8, Math.min(98, Math.round(raw * 100)));
    return { pct, matched, missed };
  }

  // Grade a Prompt Clone submission against the exact quantified 5-axis rubric + weighted checklist + lexical detail match.
  // NEVER uses the built-in cartoon turkey/prop catalog so tags & scores are 100% faithful to the real artwork!
  function gradeCloneSubmission(targetPrompt, userPrompt, targetCanvas, userCanvas, checklist, rubric = null) {
    const uLower = String(userPrompt || '').toLowerCase();
    const lex = lexicalMatch(targetPrompt, userPrompt);
    const breakdown = [];
    const checklistHits = [];
    const checklistMisses = [];
    let checkPct = lex.pct;
    let earnedPts = 0;
    let maxPts = 0;

    if (Array.isArray(checklist) && checklist.length > 0) {
      for (const item of checklist) {
        const w = item.weight || 15;
        maxPts += w;
        const words = item.words || [];
        const matchedWords = words.filter(kw => uLower.includes(kw.toLowerCase()));
        const hit = matchedWords.length > 0;
        if (hit) {
          earnedPts += w;
          checklistHits.push({ label: item.label, weight: w, axis: item.axis || 'props' });
        } else {
          checklistMisses.push({ label: item.label, weight: w, axis: item.axis || 'props' });
        }
        breakdown.push({ label: `${item.label} (+${w})`, shortLabel: item.label, weight: w, axis: item.axis || 'props', hit, partial: false });
      }
      checkPct = Math.round((earnedPts / Math.max(1, maxPts)) * 100);
    } else {
      lex.matched.slice(0, 4).forEach(w => breakdown.push({ label: w, hit: true, partial: false }));
      lex.missed.slice(0, 2).forEach(w => breakdown.push({ label: w, hit: false, partial: false }));
    }

    // Build quantified 5-axis scores (Subject /30, Setting /20, Props /20, Style /15, Palette /15)
    const AXIS_DEFS = [
      { id: 'subject', k: 'Subject', m: 30 },
      { id: 'setting', k: 'Setting', m: 20 },
      { id: 'props', k: 'Props', m: 20 },
      { id: 'style', k: 'Style', m: 15 },
      { id: 'palette', k: 'Palette', m: 15 },
    ];
    const axes = AXIS_DEFS.map(def => {
      const items = Array.isArray(checklist) ? checklist.filter(it => it.axis === def.id) : [];
      const rubText = rubric && rubric[def.id] ? rubric[def.id] : '';
      const axisLex = rubText ? lexicalMatch(rubText, userPrompt) : null;
      let ratio = lex.pct / 100;
      let note = '';
      if (items.length > 0) {
        const axMax = items.reduce((a, b) => a + (b.weight || 15), 0);
        let axGot = 0;
        const hitNames = [];
        const missNames = [];
        for (const it of items) {
          const hit = (it.words || []).some(kw => uLower.includes(kw.toLowerCase()));
          if (hit) { axGot += (it.weight || 15); hitNames.push(it.label); }
          else missNames.push(it.label);
        }
        const checkRatio = axGot / Math.max(1, axMax);
        const lexRatio = axisLex ? (axisLex.pct / 100) : (lex.pct / 100);
        ratio = checkRatio * 0.75 + lexRatio * 0.25;
        if (hitNames.length && !missNames.length) note = `Hit: ${hitNames.join(', ')}`;
        else if (hitNames.length && missNames.length) note = `Hit ${hitNames.join(', ')}; missed ${missNames.join(', ')}`;
        else note = `Missed: ${missNames.join(', ')}`;
      } else if (axisLex) {
        const axTokens = Math.max(1, axisLex.matched.length + axisLex.missed.length);
        const axRecall = axisLex.matched.length / axTokens;
        ratio = Math.min(1, Math.max(axisLex.pct / 100, axRecall * 1.65));
        note = axisLex.matched.length
          ? `Matched: ${axisLex.matched.slice(0, 4).join(', ')}`
          : `Missed ${def.k.toLowerCase()} cues`;
      }
      const s = Math.max(0, Math.min(def.m, Math.round(ratio * def.m)));
      return { k: def.k, s, m: def.m, n: note.slice(0, 72) };
    });

    const wordCount = (userPrompt || '').trim().split(/\s+/).filter(Boolean).length;
    let total = Array.isArray(checklist) && checklist.length > 0
      ? Math.round(checkPct * 0.65 + lex.pct * 0.35)
      : lex.pct;

    if (wordCount < 2) total = Math.min(total, 14);
    else if (wordCount < 4) total = Math.min(total, 36);
    total = Math.max(8, Math.min(98, total));

    let comment = '';
    if (wordCount < 4) {
      comment = `Very short prompt (${wordCount} word${wordCount === 1 ? '' : 's'}) capped your Match % at ${total}%. Describe the subject, setting, props, colors, and art style for full points!`;
    } else if (checklistHits.length && checklistMisses.length) {
      const topHits = checklistHits.map(h => `${h.label} (+${h.weight})`).join(', ');
      const topMisses = checklistMisses.map(m => `${m.label} (-${m.weight})`).join(', ');
      comment = `Earned ${earnedPts}/${maxPts} key-detail pts — Hit: ${topHits}. Left on the table: ${topMisses}.`;
    } else if (checklistHits.length && !checklistMisses.length) {
      comment = `Clean sweep! Hit all ${checklistHits.length}/${checklistHits.length} key visual details (${earnedPts}/${maxPts} pts), with ${lex.pct}% prompt-detail wording precision.`;
    } else if (checklistMisses.length) {
      const topMisses = checklistMisses.map(m => `${m.label} (-${m.weight})`).join(', ');
      comment = `Earned 0/${maxPts} key-detail pts — Missed: ${topMisses}. Naming the main subject, props, setting, and art style will jump your score!`;
    } else {
      comment = `Prompt detail coverage reached ${lex.pct}% compared to the original scene description.`;
    }

    return {
      score: total,
      semanticPct: checkPct,
      visualPct: lex.pct,
      lexicalPct: lex.pct,
      primaryScore: checkPct,
      scoringMode: 'checklist',
      axes,
      checklistHits,
      checklistMisses,
      breakdown,
      comment,
    };
  }

  return { parsePrompt, renderToCanvas, renderDataURL, compareCanvases, lexicalMatch, gradeCloneSubmission };
})();

    } while (len > 0);

    out[0] = (b.length >> 8) & 0xff;
    out[1] = b.length & 0xff;
    out.set(b, 2);

    let total = 0;
    for (const p of parts) total += p.length;

      buf = merged;

      while (buf.length >= 2) {
        let pos = 1, mult = 1, len = 0, b = 0, complete = false;
        while (pos < buf.length) {
          b = buf[pos++];
          len += (b & 127) * mult;
          mult *= 128;
          if (!(b & 128)) { complete = true; break; }
          if (pos > 5) { buf = new Uint8Array(0); return; }
        }
        if (!complete || buf.length < pos + len) break;
        const headerByte = buf[0];
        const type = headerByte >> 4;
        const body = buf.subarray(pos, pos + len);
        buf = buf.subarray(pos + len);

        if (type === 2) { // CONNACK
          clearTimeout(connectGuard);
          consecutiveFails = 0;
          mqttReady = true;
          lastRxTs = Date.now();
          notifyStatus();
          try {
            sock.send(mqttSubPkt(++pktCounter, roomPrefix() + '/#'));
          } catch (_) {}
          clearHeartbeatTimers();
          // Real MQTT Keep-Alive watchdog: detects silent zombie mobile TCP sockets within 5–12s!
          pingTimer = setInterval(() => {
            if (ws === sock && sock.readyState === 1) {
              try {
                sock.send(new Uint8Array([0xC0, 0x00])); // PINGREQ
                if (pongTimer) clearTimeout(pongTimer);
                pongTimer = setTimeout(() => {
                  pongTimer = null;
                  if (ws === sock) {
                    try { sock.close(); } catch (_) {}
                  }
                }, 5000);
              } catch (_) {
                try { sock.close(); } catch (_) {}
              }
            }
          }, 12000);
          flushOutbox();
        } else if (type === 13) { // PINGRESP
          if (pongTimer) { clearTimeout(pongTimer); pongTimer = null; }
        } else if (type === 3) { // PUBLISH
          if (body.length < 2) continue;
          const tlen = (body[0] << 8) | body[1];
          const qos = (headerByte >> 1) & 3;
          const payloadStart = 2 + tlen + (qos > 0 ? 2 : 0);
          if (payloadStart > body.length) continue;
          const payloadStr = dec.decode(body.subarray(payloadStart));
          if (!payloadStr) continue;
          try {
            const parsed = JSON.parse(payloadStr);
            if (parsed && parsed.type === 'HOST_STATE' && lockedBrokerIdx < 0) {
              lockedBrokerIdx = activeIdx;
            }
            emit(parsed);
          } catch (_) {}
        }
      }
    };

    sock.onclose = () => {
      clearTimeout(connectGuard);
      clearHeartbeatTimers();
      if (ws !== sock) return;
      ws = null;
      mqttReady = false;
      notifyStatus();
      if (shouldRun) scheduleReconnect(900);
    };

    sock.onerror = () => {};
  }

  function scheduleReconnect(delayMs = 900) {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(() => {
      reconnectTimer = null;
      if (shouldRun && mode === 'cloud' && (!ws || ws.readyState > 1)) {
        openMqttSocket();
      }
    }, delayMs);
  }

  function reconnectNow() {
    if (mode !== 'cloud' || !roomCode || !shouldRun) return;
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    openMqttSocket();
  }

  // Re-pull all retained state, submissions, drafts, results & AI images with ZERO unsubscribe blackout!
  async function pollNow(forceReconnect = false) {
    if (mode !== 'cloud' || !roomCode) return;
    const stale = !lastRxTs || (Date.now() - lastRxTs > 15000);
    if (!forceReconnect && !stale && ws && ws.readyState === 1 && mqttReady) {
      try {
        // MQTT 3.1.1 §3.8.4: re-sending SUBSCRIBE atomically re-delivers all retained messages without dropping live traffic!
        ws.send(mqttSubPkt(++pktCounter, roomPrefix() + '/#'));
      } catch (_) {
        openMqttSocket();
      }
    } else {
      openMqttSocket();
    }
  }

  function connect(code) {
    disconnect();
    roomCode = (code || genCode(4)).toUpperCase();
    shouldRun = true;
    brokerIdx = 0;
    lockedBrokerIdx = -1;
    consecutiveFails = 0;
    lastRxTs = 0;

    if (typeof BroadcastChannel !== 'undefined') {
      try {
        bc = new BroadcastChannel('tg_room_' + roomCode);
        bc.onmessage = (ev) => emit(ev.data);
      } catch (_) {}
    }

    if (mode === 'lan') {
      try {
        es = new EventSource(`/api/room/${encodeURIComponent(roomCode)}/events`);
        es.onmessage = (ev) => {
          try { emit(JSON.parse(ev.data)); } catch (_) {}
        };
      } catch (_) {}
      notifyStatus();
    } else if (mode === 'cloud') {
      openMqttSocket();
      if (typeof document !== 'undefined') {
        wakeHandler = () => {
          if (!document.hidden && shouldRun) {
            if (!ws || ws.readyState !== 1 || !mqttReady || (Date.now() - lastRxTs > 12000)) openMqttSocket();
            else pollNow(false);
          }
        };
        document.addEventListener('visibilitychange', wakeHandler);
        window.addEventListener('focus', wakeHandler);
        window.addEventListener('online', wakeHandler);
      }
    }

    return roomCode;
  }

  function disconnect() {
    shouldRun = false;
    mqttReady = false;
    outbox = [];
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    clearHeartbeatTimers();
    if (ws) { try { ws.close(); } catch (_) {} ws = null; }
    if (es) { try { es.close(); } catch (_) {} es = null; }
    if (bc) { try { bc.close(); } catch (_) {} bc = null; }
    if (wakeHandler && typeof document !== 'undefined') {
      document.removeEventListener('visibilitychange', wakeHandler);
      window.removeEventListener('focus', wakeHandler);
      window.removeEventListener('online', wakeHandler);
      wakeHandler = null;
    }
  }

  function mqttSubTopicFor(msg) {
    if (msg.type === 'HOST_STATE') return { subTopic: 'state', retain: true, priority: true };
    if (msg.type === 'CLONE_RESULTS_FULL') return { subTopic: 'results', retain: true, priority: true };
    if (msg.type === 'IMG_READY' && msg.imgKey) return { subTopic: 'img/' + String(msg.imgKey).replace(/[^a-zA-Z0-9_-]/g, ''), retain: true, priority: false };
    // Retain every participant's prompt submission & draft on their own topic so Host NEVER misses anyone!
    if (msg.type === 'ACTION' && msg.action === 'SUBMIT_CLONE_PROMPT' && msg.playerId) {
      const pid = String(msg.playerId).replace(/[^a-zA-Z0-9_-]/g, '');
      const rid = msg.roundId ? String(msg.roundId).replace(/[^a-zA-Z0-9_-]/g, '') : 'latest';
      return { subTopic: `sub/${rid}/${pid}`, retain: true, priority: true };
    }
    if (msg.type === 'ACTION' && msg.action === 'CLONE_DRAFT' && msg.playerId) {
      const pid = String(msg.playerId).replace(/[^a-zA-Z0-9_-]/g, '');
      const rid = msg.roundId ? String(msg.roundId).replace(/[^a-zA-Z0-9_-]/g, '') : 'latest';
      return { subTopic: `draft/${rid}/${pid}`, retain: true, priority: false };
    }
    return { subTopic: 'events', retain: false, priority: true };
  }

  function clearRetained(subTopic) {
    if (mode !== 'cloud' || !roomCode) return;
    outbox.push({ subTopic, bodyStr: '', retain: true });
    flushOutbox();
  }

  async function send(payload) {
    const msg = {
      ...payload,
      id: clientId + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      sender: clientId,
      ts: Date.now(),
    };
    seenIds.add(msg.id);

    if (bc) {
      try { bc.postMessage(msg); } catch (_) {}
    }

    let ok = true;
    if (mode === 'lan' && roomCode) {
      try {
        const res = await fetch(`/api/room/${encodeURIComponent(roomCode)}/send`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(msg),
        });
        ok = res.ok;
      } catch (_) { ok = false; }
    } else if (mode === 'cloud' && roomCode) {
      const { subTopic, retain, priority } = mqttSubTopicFor(msg);
      const bodyStr = JSON.stringify(msg);
      // Replace any older queued packet for the same retained state/sub/draft topic so only the newest flushes!
      if (subTopic === 'state' || subTopic === 'results' || subTopic.startsWith('sub/') || subTopic.startsWith('draft/')) {
        outbox = outbox.filter(x => x.subTopic !== subTopic);
      }
      const entry = { subTopic, bodyStr, retain };
      if (priority) outbox.unshift(entry);
      else outbox.push(entry);
      flushOutbox();
      ok = mqttReady;
    }
    return { ...msg, ok };
  }

  function dataUrlToBlob(dataUrl) {
    const parts = String(dataUrl).split(',');
    const mimeMatch = parts[0].match(/:(.*?);/);
    const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
    const bstr = atob(parts[1] || '');
    const u8 = new Uint8Array(bstr.length);
    for (let i = 0; i < bstr.length; i++) u8[i] = bstr.charCodeAt(i);
    return new Blob([u8], { type: mime });
  }

  // LAN mode: upload to local Node server; Cloud mode: return null so sendImage() streams over unlimited WSS MQTT!
  async function uploadImage(dataUrl) {
    if (!dataUrl || !roomCode) return null;
    if (mode === 'lan') {
      try {
        const blob = dataUrlToBlob(dataUrl);
        const res = await fetch('/api/upload', {
          method: 'POST',
          headers: { 'Content-Type': blob.type },
          body: blob,
        });
        if (res.ok) {
          const j = await res.json();
          if (j && j.url) return j.url;
        }
      } catch (_) {}
    }
    return null;
  }

  async function uploadJSON(obj) {
    if (!obj || !roomCode) return null;
    if (mode === 'lan') {
      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(obj),
        });
        if (res.ok) {
          const j = await res.json();
          if (j && j.url) return j.url;
        }
      } catch (_) {}
    }
    return null;
  }

  // Send a full crisp image directly over WSS MQTT (retained!) or chunked fallback on local BroadcastChannel
  async function sendImage(imgKey, dataUrl) {
    if (!imgKey || !dataUrl) return;
    if (mode === 'cloud' || mode === 'lan') {
      await send({ type: 'IMG_READY', imgKey, dataUrl });
      return;
    }
    const CHUNK_SIZE = 2200;
    const total = Math.ceil(dataUrl.length / CHUNK_SIZE);
    for (let i = 0; i < total; i++) {
      await send({
        type: 'IMG_CHUNK',
        imgKey,
        idx: i,
        total,
        data: dataUrl.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE),
      });
    }
  }

  function onMessage(fn) {
    listeners.push(fn);
    return () => { listeners = listeners.filter(x => x !== fn); };
  }

  function onStatus(fn) {
    statusListeners.push(fn);
    return () => { statusListeners = statusListeners.filter(x => x !== fn); };
  }

  function getJoinUrl(customBase) {
    if (customBase && customBase.trim()) {
      const clean = customBase.trim().replace(/\/+$/, '');
      return `${clean}/?room=${roomCode}&join=1`;
    }
    if (lanBaseUrl) {
      return `${lanBaseUrl}/?room=${roomCode}&join=1`;
    }
    if (typeof window !== 'undefined' && /^https?:/.test(window.location.protocol)) {
      const u = new URL(window.location.href);
      u.search = `?room=${roomCode}&join=1`;
      u.hash = '';
      return u.toString();
    }
    return `https://thanksgiving-game-night.local/?room=${roomCode}&join=1`;
  }

  return {
    genCode,
    detectTransport,
    connect,
    disconnect,
    pollNow,
    reconnectNow,
    send,
    clearRetained,
    uploadImage,
    uploadJSON,
    sendImage,
    onMessage,
    onStatus,
    isConnected: () => mode === 'lan' || mode === 'local' || mqttReady,
    getJoinUrl,
    getMode: () => mode,
    getRoomCode: () => roomCode,
    getClientId: () => clientId,
    setLanBaseUrl: (u) => { lanBaseUrl = u; },
  };
})();

          if (llm && (Number.isFinite(llm.subject) || Number.isFinite(llm.score))) {
            const rawScore = Number.isFinite(llm.subject)
              ? Math.max(5, Math.min(99, Math.round((llm.subject || 0) + (llm.setting || 0) + (llm.props || 0) + (llm.style || 0) + (llm.palette || 0))))
              : Math.max(5, Math.min(99, Math.round(llm.score)));
            grade.scoringMode = 'llm';
            grade.primaryScore = rawScore;
            grade.score = Math.max(5, Math.min(99, Math.round(rawScore * 0.85 + lexPct * 0.15)));
            if (typeof llm.subject === 'number') {
              const subS = Math.max(0, Math.min(30, Math.round(llm.subject || 0)));
              const setS = Math.max(0, Math.min(20, Math.round(llm.setting || 0)));
              const prpS = Math.max(0, Math.min(20, Math.round(llm.props || 0)));
              const styS = Math.max(0, Math.min(15, Math.round(llm.style || 0)));
              const palS = Math.max(0, Math.min(15, Math.round(llm.palette || 0)));
              const notes = llm.notes && typeof llm.notes === 'object' ? llm.notes : {};
              grade.axes = [
                { k: 'Subject', s: subS, m: 30, n: String(notes.subject || '').slice(0, 68) },
                { k: 'Setting', s: setS, m: 20, n: String(notes.setting || '').slice(0, 68) },
                { k: 'Props', s: prpS, m: 20, n: String(notes.props || '').slice(0, 68) },
                { k: 'Style', s: styS, m: 15, n: String(notes.style || '').slice(0, 68) },
                { k: 'Palette', s: palS, m: 15, n: String(notes.palette || '').slice(0, 68) },
              ];
              grade.breakdown = [
                { label: `Subject ${subS}/30`, hit: subS >= 23, partial: subS >= 14 && subS < 23 },
                { label: `Setting ${setS}/20`, hit: setS >= 15, partial: setS >= 9 && setS < 15 },
                { label: `Props ${prpS}/20`, hit: prpS >= 15, partial: prpS >= 9 && prpS < 15 },
                { label: `Style ${styS}/15`, hit: styS >= 11, partial: styS >= 6 && styS < 11 },
                { label: `Palette ${palS}/15`, hit: palS >= 11, partial: palS >= 6 && palS < 11 },
              ];
            }
            if (llm.comment) grade.comment = llm.comment;
          }
        }
      } catch (err) {
        if (warnCb && err?.message) warnCb(err.message);
      }

      return {
        player: p,
        prompt: sub.text,
        dataUrl: gen.dataUrl,
        aiUrl: aiImg.url,
        aiDataUrl: aiImg.dataUrl,
        hiResDataUrl,
        sharedUrl,
        imgSource: aiImg.source,
        autoCollected: !!sub.autoCollected,
        ...grade,
      };
    }

    async function finalizeAndPublishResults(finalResults, aiWarning, announce = false) {
      finalResults.sort((a, b) => (b.score - a.score) || ((b.lexicalPct || 0) - (a.lexicalPct || 0)) || (b.prompt.length - a.prompt.length));
      gradedResults = finalResults;
      gradedResults._warning = aiWarning || '';

      finalResults.forEach((r, rank) => {
        const bonus = rank === 0 ? 100 : rank === 1 ? 50 : rank === 2 ? 25 : 0;
        const basePts = Math.round(r.score * 2);
        const pts = basePts + bonus;
        r.rank = rank;
        r.totalPlayers = finalResults.length;
        r.basePts = basePts;
        r.bonusPts = bonus;
        r.pointsAwarded = pts;
        r.gapToFirst = rank === 0 ? 0 : Math.max(0, finalResults[0].score - r.score);
        r.marginOrGap = rank === 0
          ? (finalResults[1] ? Math.max(0, r.score - finalResults[1].score) : 0)
          : Math.max(0, finalResults[rank - 1].score - r.score);
        r.aboveName = rank === 0
          ? (finalResults[1]?.player?.name || '')
          : (finalResults[rank - 1]?.player?.name || '');
        const tiedPrev = rank > 0 && finalResults[rank - 1].score === r.score;
        const tiedNext = rank < finalResults.length - 1 && finalResults[rank + 1].score === r.score;
        r.tieBreakNote = (tiedPrev || tiedNext)
          ? `Tie-breaker: Prompt Detail ${r.lexicalPct || 0}%`
          : '';
        // Apply exact score delta so re-ranking after a late arrival never double-awards points!
        const prevPts = awardedByRound[r.player.id] || 0;
        const delta = pts - prevPts;
        if (delta !== 0) {
          awardedByRound[r.player.id] = pts;
          App.addScore(r.player.id, delta);
        }
      });

      // Build quantified "Why the Winner Got the Highest Score" analysis for Host & every Guest Phone!
      winnerAnalysis = null;
      if (finalResults.length > 0) {
        const w = finalResults[0];
        const r2 = finalResults[1] || null;
        const n = finalResults.length;
        const avgScore = Math.round(finalResults.reduce((s, r) => s + r.score, 0) / n);
        const avgLex = Math.round(finalResults.reduce((s, r) => s + (r.lexicalPct || 0), 0) / n);
        let headline = '';
        if (n === 1) {
          headline = `👑 ${w.player.name} finished with a ${w.score}% Match!`;
        } else if (w.score === r2.score) {
          headline = `👑 ${w.player.name} tied ${r2.player.name} at ${w.score}% Match and won #1 on the Prompt Detail tie-breaker (${w.lexicalPct || 0}% vs ${r2.lexicalPct || 0}%)!`;
        } else {
          headline = `👑 ${w.player.name} took #1 at ${w.score}% Match — +${w.score - r2.score}% ahead of #2 (${r2.player.name}) and +${Math.max(0, w.score - avgScore)}% above the ${avgScore}% round average!`;
        }
        const reasons = [];
        if (r2 && Array.isArray(w.axes) && w.axes.length && Array.isArray(r2.axes) && r2.axes.length === w.axes.length) {
          const diffs = w.axes.map((a, idx) => ({
            k: a.k,
            ws: a.s,
            r2s: r2.axes[idx].s,
            m: a.m,
            diff: a.s - r2.axes[idx].s,
          }));
          const advantages = diffs.filter(d => d.diff > 0).sort((a, b) => b.diff - a.diff);
          if (advantages.length) {
            reasons.push(
              `Biggest edge over #2 (${r2.player.name}): ${advantages.slice(0, 3).map(d => `${d.k} ${d.ws}/${d.m} vs ${d.r2s}/${d.m} (+${d.diff})`).join(' · ')}`
            );
          } else {
            reasons.push(
              `Matched #2 (${r2.player.name}) on category totals and pulled ahead via higher Prompt Detail precision (${w.lexicalPct || 0}% vs ${r2.lexicalPct || 0}%).`
            );
          }
        }
        if (Array.isArray(w.axes) && w.axes.length) {
          const avgByAxis = w.axes.map((a, idx) => {
            const avg = Math.round(finalResults.reduce((s, r) => s + (r.axes?.[idx]?.s || 0), 0) / n);
            return { k: a.k, ws: a.s, m: a.m, avg, pct: a.s / Math.max(1, a.m) };
          });
          const strongest = [...avgByAxis].sort((a, b) => b.pct - a.pct).slice(0, 3);
          reasons.push(
            n >= 2
              ? `Strongest rubric scores: ${strongest.map(a => `${a.k} ${a.ws}/${a.m} (table avg ${a.avg}/${a.m})`).join(' · ')}`
              : `Rubric breakdown: ${strongest.map(a => `${a.k} ${a.ws}/${a.m}`).join(' · ')}`
          );
        }
        if (Array.isArray(w.checklistHits) && w.checklistHits.length) {
          const r2HitLabels = new Set((r2?.checklistHits || []).map(h => h.label));
          const uniqueToWinner = r2 ? w.checklistHits.filter(h => !r2HitLabels.has(h.label)) : [];
          if (uniqueToWinner.length) {
            reasons.push(
              `Spotted key visual details #2 (${r2.player.name}) missed: ${uniqueToWinner.slice(0, 4).map(h => `${h.label} (+${h.weight})`).join(', ')}`
            );
          } else {
            const totalChecks = w.checklistHits.length + (w.checklistMisses?.length || 0);
            reasons.push(
              `Captured ${w.checklistHits.length}/${totalChecks} key visual elements: ${w.checklistHits.slice(0, 4).map(h => h.label).join(', ')}`
            );
          }
        }
        if (n >= 2) {
          reasons.push(
            `Prompt detail coverage: ${w.lexicalPct || 0}% vs #2's ${r2.lexicalPct || 0}% (table avg: ${avgLex}%).`
          );
        }
        winnerAnalysis = { headline, reasons };
      }

      const fullPayload = {
        roundId,
        wa: winnerAnalysis,
        items: finalResults.map((r, i) => ({
          ...toCompactResult(r, i),
          p: r.prompt || '',
          c: r.comment || '',
          bd: (r.breakdown || []).slice(0, 7),
        })),
      };
      resultsUrl = await RoomSync.uploadJSON(fullPayload, `results_${roundId}_${finalResults.length}.json`);

      phase = 'results';
      gradingStatus = '';
      if (announce) {
        SoundFX.fanfare();
        if (finalResults.length > 0) {
          SoundFX.speak(`Grading complete! ${finalResults[0].player.name} wins with a ${finalResults[0].score} percent match!`);
        }
      }
      broadcastPhoneState();
      render();
      broadcastResultsToPhones();
    }

    async function gradeLateSubmission(pid, sub) {
      const capturedRound = roundId;
      try {
        const liveCfg = LiveAI.loadSettings();
        const refPrompt = customTargetImg ? (customTargetDesc || target.secretPrompt) : target.secretPrompt;
        const targetRubric = customTargetImg ? null : (target.rubric || null);
        const targetChecklist = customTargetImg ? null : (target.checklist || null);
        let aiWarn = gradedResults._warning || '';
        const item = await gradeSingleSubmission(
          pid, sub, gradedResults.length + 1, liveCfg, refPrompt, targetChecklist, targetRubric, activeTargetVisionDataUrl,
          (msg) => { if (!aiWarn) aiWarn = msg; }
        );
        if (phase !== 'results' || roundId !== capturedRound) return;
        if (gradedResults.some(r => r.player?.id === pid)) return;
        await finalizeAndPublishResults([...gradedResults, item], aiWarn, false);
      } finally {
        lateGradingIds.delete(pid);
      }
    }

    async function gradeAll() {
      if (timer) { clearInterval(timer); timer = null; }
      clearCollectTimers();
      phase = 'grading';
      gradingStatus = 'Preparing Google Nano Banana AI generation & visual grading...';
      broadcastPhoneState();
      render();

      const liveCfg = LiveAI.loadSettings();
      const refPrompt = customTargetImg ? (customTargetDesc || target.secretPrompt) : target.secretPrompt;
      const initialEntries = Object.entries(submissions).filter(([, sub]) => sub && sub.text);
      gradingQueue = [...initialEntries];
      gradingSeen = new Set(initialEntries.map(([pid]) => pid));

      // Prepare target thumbnail for Gemini Vision side-by-side grading when Gemini key is set
      let targetVisionDataUrl = null;
      if (liveCfg.provider === 'gemini' && liveCfg.apiKey) {
        targetVisionDataUrl = customTargetImg
          ? await makeThumb(customTargetImg, 420, 0.72)
          : await assetToThumbDataUrl(target.asset);
      }
      activeTargetVisionDataUrl = targetVisionDataUrl;

      const results = [];
      let completedCount = 0;
      let aiWarning = '';

      const targetRubric = customTargetImg ? null : (target.rubric || null);
      const targetChecklist = customTargetImg ? null : (target.checklist || null);

      async function processEntry(i, pid, sub) {
        const item = await gradeSingleSubmission(
          pid, sub, i, liveCfg, refPrompt, targetChecklist, targetRubric, targetVisionDataUrl,
          (msg) => { if (!aiWarning) aiWarning = msg; }
        );
        results[i] = item;
        completedCount++;
        gradingStatus = `🍌 Generated ${completedCount}/${gradingQueue.length} AI images (${item.player.name} done!)...`;
        const stEl = document.getElementById('clone-grading-status');
        if (stEl) stEl.textContent = gradingStatus;
        scheduleBroadcastPhoneState(300);
      }

      // Dynamic 3-worker pool: processes 10+ players ~3x faster AND seamlessly picks up any late-arriving submission!
      const CONCURRENCY = 3;
      let cursor = 0;
      async function worker() {
        while (cursor < gradingQueue.length) {
          const i = cursor++;
          const [pid, sub] = gradingQueue[i];
          await processEntry(i, pid, sub);
        }
      }
      await Promise.all(Array.from({ length: Math.min(CONCURRENCY, Math.max(1, gradingQueue.length)) }, () => worker()));

      while (cursor < gradingQueue.length) {
        const i = cursor++;
        const [pid, sub] = gradingQueue[i];
        await processEntry(i, pid, sub);
      }

      const finalResults = results.filter(Boolean);
      gradingQueue = null;
      gradingSeen = null;

      await finalizeAndPublishResults(finalResults, aiWarning, true);
    }
