<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Thanksgiving AI Game Night — 6 Interactive Family Games</title>
  <meta name="description" content="Six interactive AI Thanksgiving games for kids and adults: Prompt Clone, Turkey Court, Prompt Panic, Pass the Gobble Bomb, Spot the Bot, and Feast Showdown — with QR phone joining." />
  <style>
/* Thanksgiving AI Game Night — Warm Harvest Table Design System */
:root {
  --bg: #FAF4EA;
  --surface: #FFFDF8;
  --surface-alt: #F3E9D8;
  --ink: #2B1E16;
  --ink-muted: #6C5849;
  --border: #E2D4BF;
  --border-strong: #CEBAA0;

  --pumpkin: #C85A17;
  --pumpkin-dark: #A4440E;
  --cranberry: #A62629;
  --cranberry-dark: #841C1F;
  --sage: #2E6B4F;
  --sage-soft: #E5F1EA;
  --gold: #C98614;
  --gold-soft: #FBF1DA;

  --shadow-sm: 0 2px 6px rgba(43, 30, 22, 0.06);
  --shadow-md: 0 8px 24px rgba(43, 30, 22, 0.09);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;

  --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.45;
  min-height: 100%;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea, select {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

/* App Shell */
.app-shell {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 14px 48px;
}

/* Sticky Top Navigation Bar */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(250, 244, 234, 0.94);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  margin: 0 -14px 18px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}

.brand-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: none;
  border: none;
  padding: 6px 8px;
  margin-left: -6px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  text-align: left;
  transition: background 0.15s;
}
.brand-btn:hover { background: var(--surface-alt); }
.brand-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.05rem;
  letter-spacing: -0.015em;
  color: var(--ink);
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.icon-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 7px 11px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  font-size: 0.84rem;
  font-weight: 600;
  cursor: pointer;
  min-height: 38px;
  transition: transform 0.12s, background 0.15s, border-color 0.15s;
}
.icon-pill:hover { background: var(--surface-alt); }
.icon-pill:active { transform: scale(0.97); }
.icon-pill.active {
  background: var(--ink);
  color: var(--surface);
  border-color: var(--ink);
}
.icon-pill.qr-pill {
  background: var(--gold-soft);
  border-color: #DFC086;
  color: #6B4408;
}

/* Typography */
h1 {
  font-family: var(--font-display);
  font-size: clamp(1.75rem, 4.5vw, 2.5rem);
  line-height: 1.15;
  letter-spacing: -0.02em;
  margin: 0 0 8px;
  color: var(--ink);
}
h2 {
  font-family: var(--font-display);
  font-size: clamp(1.3rem, 3.2vw, 1.75rem);
  line-height: 1.2;
  letter-spacing: -0.015em;
  margin: 0 0 8px;
}
h3 {
  font-size: 1.05rem;
  font-weight: 700;
  margin: 0 0 6px;
}
.muted { color: var(--ink-muted); }
.small { font-size: 0.87rem; }
.xs { font-size: 0.78rem; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.center { text-align: center; }

/* Cards & Panels */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 18px;
  box-shadow: var(--shadow-sm);
}
.card-warm {
  background: var(--surface-alt);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  padding: 16px;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 18px;
  min-height: 48px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--ink);
  font-weight: 700;
  font-size: 0.96rem;
  cursor: pointer;
  transition: transform 0.1s, background 0.15s, box-shadow 0.15s;
  text-decoration: none;
}
.btn:hover { background: var(--surface-alt); }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

.btn-primary {
  background: var(--pumpkin);
  border-color: var(--pumpkin);
  color: #FFFDF8;
  box-shadow: 0 3px 10px rgba(200, 90, 23, 0.24);
}
.btn-primary:hover { background: var(--pumpkin-dark); border-color: var(--pumpkin-dark); }

.btn-danger {
  background: var(--cranberry);
  border-color: var(--cranberry);
  color: #FFFDF8;
  box-shadow: 0 3px 10px rgba(166, 38, 41, 0.24);
}
.btn-danger:hover { background: var(--cranberry-dark); border-color: var(--cranberry-dark); }

.btn-success {
  background: var(--sage);
  border-color: var(--sage);
  color: #FFFDF8;
}
.btn-success:hover { background: #23553E; }

.btn-lg {
  min-height: 58px;
  font-size: 1.08rem;
  padding: 14px 24px;
  border-radius: 14px;
}
.btn-xl {
  min-height: 82px;
  font-size: 1.3rem;
  padding: 18px 28px;
  border-radius: 18px;
  width: 100%;
}
.btn-sm {
  min-height: 36px;
  padding: 6px 12px;
  font-size: 0.85rem;
}
.btn-block { width: 100%; }

/* Inputs */
.input, .textarea, .select {
  width: 100%;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border-strong);
  background: #FFFFFF;
  color: var(--ink);
  font-size: 1rem;
  transition: border-color 0.15s;
}
.input:focus, .textarea:focus, .select:focus {
  outline: none;
  border-color: var(--pumpkin);
}
.textarea { min-height: 92px; resize: vertical; line-height: 1.45; }

/* Layout helpers */
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 660px) {
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
}

/* Hero & Game Hub */
.hub-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.hub-sub { max-width: 580px; margin: 0; color: var(--ink-muted); font-size: 1rem; }

.game-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
@media (max-width: 680px) {
  .game-grid { grid-template-columns: 1fr; }
}

.game-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
  cursor: pointer;
  text-align: left;
  box-shadow: var(--shadow-sm);
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
}
.game-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
  border-color: var(--border-strong);
}
.game-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}
.game-icon {
  width: 48px;
  height: 48px;
  border-radius: 13px;
  background: var(--surface-alt);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.65rem;
  flex-shrink: 0;
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 700;
  background: var(--surface-alt);
  color: var(--ink-muted);
}
.tag-new { background: var(--cranberry); color: #FFF; }
.tag-kid { background: var(--sage-soft); color: var(--sage); }
.tag-gold { background: var(--gold-soft); color: #7C5006; }

/* Player Chips */
.roster-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.player-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 11px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  font-size: 0.88rem;
  font-weight: 600;
}
.player-chip .pts {
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--pumpkin);
}
.player-chip .rm {
  background: none;
  border: none;
  color: var(--ink-muted);
  cursor: pointer;
  padding: 0 2px;
  font-size: 1rem;
  line-height: 1;
}

/* Timers & Banners */
.timer-box {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: 999px;
  background: var(--surface-alt);
  border: 1px solid var(--border-strong);
  font-family: var(--font-mono);
  font-size: 1.35rem;
  font-weight: 800;
}
.timer-box.urgent {
  background: var(--cranberry);
  border-color: var(--cranberry);
  color: #FFF;
  animation: pulseFast 0.6s infinite alternate;
}

.countdown-banner {
  position: sticky;
  top: 6px;
  z-index: 30;
  background: var(--surface);
  border: 2px solid var(--pumpkin);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  box-shadow: 0 6px 20px rgba(43, 30, 22, 0.14);
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: background 0.25s, border-color 0.25s, color 0.25s;
}
.countdown-banner .cd-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.countdown-banner .cd-time {
  font-family: var(--font-mono);
  font-size: clamp(1.6rem, 4.8vw, 2.2rem);
  font-weight: 900;
  line-height: 1;
  color: var(--pumpkin-dark);
}
.countdown-banner .cd-msg {
  font-size: 0.9rem;
  font-weight: 800;
  color: var(--ink);
}
.countdown-banner .cd-track {
  width: 100%;
  height: 8px;
  border-radius: 999px;
  background: rgba(43, 30, 22, 0.12);
  overflow: hidden;
}
.countdown-banner .cd-fill {
  height: 100%;
  border-radius: 999px;
  background: var(--pumpkin);
  transition: width 0.25s linear, background 0.25s;
}
.countdown-banner.warn {
  background: #FFF3D1;
  border-color: #D48806;
}
.countdown-banner.warn .cd-time { color: #9A5B00; }
.countdown-banner.warn .cd-msg { color: #7C4700; }
.countdown-banner.warn .cd-fill { background: #E09100; }
.countdown-banner.urgent {
  background: var(--cranberry);
  border-color: var(--cranberry-dark);
  color: #FFF;
  animation: pulseFast 0.55s infinite alternate;
}
.countdown-banner.urgent .cd-time,
.countdown-banner.urgent .cd-msg { color: #FFF; }
.countdown-banner.urgent .cd-track { background: rgba(255, 255, 255, 0.28); }
.countdown-banner.urgent .cd-fill { background: #FFE066; }

.twist-banner {
  background: var(--cranberry);
  color: #FFFDF8;
  border-radius: var(--radius-md);
  padding: 16px 18px;
  font-weight: 700;
  font-size: 1.08rem;
  animation: shakePop 0.45s ease;
}

/* Canvas & Image Frames */
.art-frame {
  position: relative;
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  border-radius: var(--radius-md);
  overflow: hidden;
  border: 2px solid var(--border-strong);
  background: #EFE4D2;
  aspect-ratio: 440 / 300;
}
.art-frame canvas, .art-frame img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  transition: filter 0.35s linear;
}

/* Split-Screen Multi-Player Buzzers */
.buzzer-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
  gap: 10px;
}
.buzzer-pad {
  min-height: 76px;
  border-radius: 14px;
  border: 2px solid var(--border-strong);
  background: var(--surface);
  font-weight: 800;
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 10px;
  transition: transform 0.08s, background 0.12s;
  box-shadow: 0 4px 0 var(--border-strong);
}
.buzzer-pad:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--border-strong);
}
.buzzer-pad.buzzed {
  background: var(--pumpkin);
  border-color: var(--pumpkin-dark);
  color: #FFF;
  box-shadow: 0 4px 0 var(--pumpkin-dark);
}
.buzzer-pad.bot-slam {
  background: var(--cranberry);
  border-color: var(--cranberry-dark);
  color: #FFF;
  box-shadow: 0 4px 0 var(--cranberry-dark);
}

/* Quick-tap prompt chips */
.chip-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip {
  padding: 6px 11px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  font-size: 0.83rem;
  font-weight: 600;
  cursor: pointer;
}
.chip:hover { background: var(--surface-alt); }

/* Gobble Bomb Stage */
.bomb-stage {
  text-align: center;
  padding: 24px 18px;
  border-radius: var(--radius-lg);
  background: var(--surface);
  border: 2px solid var(--border-strong);
  transition: background 0.3s, border-color 0.3s;
}
.bomb-stage.hot {
  background: #FFF1EE;
  border-color: var(--cranberry);
}
.bomb-emoji {
  font-size: 4.5rem;
  line-height: 1;
  display: inline-block;
  animation: bombBeat 0.75s infinite alternate;
}
.twist-word-big {
  font-family: var(--font-display);
  font-size: clamp(1.9rem, 6vw, 3rem);
  font-weight: 700;
  color: var(--pumpkin);
  margin: 8px 0;
  letter-spacing: -0.02em;
}

/* Prompt Clone Gallery & Match Meter */
.clone-gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 14px;
}
.clone-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.clone-card.winner {
  border: 2px solid var(--gold);
  box-shadow: var(--shadow-md);
}
.clone-card-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.meter-track {
  width: 100%;
  height: 10px;
  border-radius: 999px;
  background: var(--surface-alt);
  overflow: hidden;
}
.meter-fill {
  height: 100%;
  border-radius: 999px;
  background: var(--sage);
  transition: width 0.6s ease;
}

/* Transparent Scoring Guide & Per-Card Standing/Math Boxes */
.score-guide {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  padding: 12px 14px;
}
.score-guide summary {
  cursor: pointer;
  font-weight: 800;
  font-size: 0.92rem;
  color: var(--ink);
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.score-guide summary::-webkit-details-marker { display: none; }
.score-guide .guide-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
  gap: 8px;
  margin-top: 10px;
}
.score-guide .guide-item {
  background: var(--surface-alt);
  border-radius: 10px;
  padding: 8px 10px;
  font-size: 0.8rem;
  line-height: 1.4;
}
.standing-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--ink-muted);
  background: #FAF3E8;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 9px;
}
.standing-bar.first {
  background: #FFF6DC;
  border-color: var(--gold);
  color: #7C5006;
}
.judge-box {
  background: var(--surface-alt);
  border-left: 3px solid var(--pumpkin);
  border-radius: 0 8px 8px 0;
  padding: 7px 10px;
  font-size: 0.8rem;
  line-height: 1.4;
  color: var(--ink);
}
.score-math-box {
  background: #F6F8F4;
  border: 1px solid rgba(74, 117, 72, 0.28);
  border-radius: 8px;
  padding: 7px 10px;
  font-size: 0.76rem;
  line-height: 1.45;
  color: var(--ink);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.score-math-box .math-total {
  font-weight: 800;
  color: var(--pumpkin-dark);
}

/* Spot the Bot Answer Card */
.bot-reveal-card {
  background: var(--surface);
  border: 2px solid var(--border-strong);
  border-radius: var(--radius-lg);
  padding: 26px 20px;
  text-align: center;
  font-family: var(--font-display);
  font-size: clamp(1.25rem, 3.6vw, 1.75rem);
  line-height: 1.35;
  box-shadow: var(--shadow-md);
}

/* Modal Overlay */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: rgba(28, 20, 16, 0.56);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 20px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
}

.qr-box {
  width: 220px;
  height: 220px;
  margin: 0 auto;
  padding: 12px;
  background: #FFFFFF;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
}
.qr-box svg { width: 100%; height: 100%; display: block; }

/* Phone Controller Mode */
.controller-shell {
  max-width: 460px;
  margin: 0 auto;
  padding: 16px 14px 40px;
}
.controller-buzzer {
  width: 100%;
  min-height: 170px;
  border-radius: 26px;
  border: none;
  background: var(--cranberry);
  color: #FFF;
  font-size: 1.7rem;
  font-weight: 900;
  letter-spacing: 0.02em;
  box-shadow: 0 10px 0 var(--cranberry-dark), 0 16px 30px rgba(166, 38, 41, 0.3);
  cursor: pointer;
  transition: transform 0.08s, box-shadow 0.08s;
}
.controller-buzzer:active {
  transform: translateY(7px);
  box-shadow: 0 3px 0 var(--cranberry-dark);
}

/* Animations */
@keyframes pulseFast {
  from { transform: scale(1); }
  to { transform: scale(1.04); }
}
@keyframes bombBeat {
  from { transform: scale(1) rotate(-3deg); }
  to { transform: scale(1.1) rotate(3deg); }
}
@keyframes shakePop {
  0% { transform: scale(0.94); }
  25% { transform: translateX(-6px) scale(1.02); }
  50% { transform: translateX(6px); }
  75% { transform: translateX(-3px); }
  100% { transform: translateX(0) scale(1); }
}
.fade-in { animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Divider */
.divider { height: 1px; background: var(--border); margin: 4px 0; }

  </style>
</head>
<body>
  <div id="app"></div>
  <script>
// Pure JS ISO/IEC 18004 QR Code Generator (Byte Mode, Versions 1-10, ECC Level M)
// Zero dependencies — renders crisp inline SVG scannable by any phone camera.

const QR = (() => {
  // GF(256) with primitive polynomial 0x11d
  const EXP = new Uint8Array(512);
  const LOG = new Uint8Array(256);
  {
    let x = 1;

// Sound Effects (Web Audio API) + AI Voice Host (Web Speech API) + Mic Helper
// 100% self-contained, zero external audio assets.

const SoundFX = (() => {
  let ctx = null;
  let muted = false;
  let voiceEnabled = true;

  function ensureCtx() {
    if (muted) return null;
    if (!ctx && typeof window !== 'undefined') {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ctx = new AC();
    }
    if (ctx && ctx.state === 'suspended') {
      ctx.resume().catch(() => {});
    }
    return ctx;
  }

  // Unlock Web Audio automatically on first tap/keypress so iOS Safari & mobile Chrome always play timeout warnings!
  if (typeof window !== 'undefined') {
    const unlock = () => {
      try { ensureCtx(); } catch (_) {}
    };
    window.addEventListener('pointerdown', unlock, { passive: true });
    window.addEventListener('touchstart', unlock, { passive: true });
    window.addEventListener('keydown', unlock, { passive: true });
  }

  function tone(freq, duration, type = 'sine', gainVal = 0.18, delay = 0) {
    const c = ensureCtx();
    if (!c) return;
    const now = c.currentTime + delay;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(0.001, now);
    g.gain.exponentialRampToValueAtTime(gainVal, now + 0.015);
    g.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(g);
    g.connect(c.destination);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  }

  function noiseBurst(duration, gainVal = 0.25, delay = 0, filterFreq = 900) {
    const c = ensureCtx();
    if (!c) return;
    const now = c.currentTime + delay;
    const len = Math.floor(c.sampleRate * duration);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.35));
    const src = c.createBufferSource();
    src.buffer = buf;
    const filt = c.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(filterFreq, now);
    const g = c.createGain();
    g.gain.setValueAtTime(gainVal, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + duration);
    src.connect(filt);
    filt.connect(g);
    g.connect(c.destination);
    src.start(now);
  }

  return {
    isMuted: () => muted,
    isVoiceOn: () => voiceEnabled,
    toggleMute() { muted = !muted; if (muted) this.stopSpeech(); return muted; },
    toggleVoice() { voiceEnabled = !voiceEnabled; if (!voiceEnabled) this.stopSpeech(); return voiceEnabled; },

    pop() { tone(540, 0.08, 'triangle', 0.14); tone(760, 0.07, 'sine', 0.1, 0.04); },
    ding() { tone(784, 0.14, 'sine', 0.16); tone(1046.5, 0.28, 'sine', 0.18, 0.09); },
    wrong() { tone(240, 0.2, 'sawtooth', 0.12); tone(175, 0.32, 'sawtooth', 0.14, 0.14); },
    buzzer() {
      tone(330, 0.18, 'square', 0.24);
      tone(220, 0.36, 'sawtooth', 0.26, 0.12);
    },
    warn30() {
      tone(660, 0.14, 'triangle', 0.24, 0);
      tone(880, 0.16, 'triangle', 0.26, 0.14);
      tone(660, 0.2, 'triangle', 0.24, 0.30);
    },
    warn15() {
      tone(920, 0.11, 'square', 0.20, 0);
      tone(920, 0.11, 'square', 0.22, 0.15);
      tone(1100, 0.18, 'square', 0.24, 0.30);
    },
    countdownBeep(secLeft) {
      const pitch = 680 + Math.max(0, 10 - secLeft) * 55;
      const dur = secLeft <= 3 ? 0.14 : 0.09;
      tone(pitch, dur, secLeft <= 3 ? 'square' : 'triangle', secLeft <= 3 ? 0.24 : 0.20);
    },
    gavel() {
      tone(130, 0.11, 'triangle', 0.3);
      noiseBurst(0.09, 0.3, 0, 500);
      tone(125, 0.12, 'triangle', 0.3, 0.18);
      noiseBurst(0.1, 0.32, 0.18, 480);
    },
    tick(urgency = 0.2) {
      const pitch = 420 + urgency * 500;
      tone(pitch, 0.065, 'triangle', 0.14 + urgency * 0.12);
    },
    boom() {
      noiseBurst(0.75, 0.45, 0, 380);
      tone(95, 0.55, 'sawtooth', 0.28);
      tone(58, 0.65, 'sine', 0.3, 0.1);
    },
    fanfare() {
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((n, i) => tone(n, 0.26, 'triangle', 0.17, i * 0.09));
    },

    speak(text) {
      if (muted || !voiceEnabled || typeof window === 'undefined' || !window.speechSynthesis) return;
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 1.06;
        u.pitch = 1.04;
        u.volume = 0.95;
        window.speechSynthesis.speak(u);
      } catch (_) {}
    },
    stopSpeech() {
      try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (_) {}
    },

    supportsMic() {
      return typeof window !== 'undefined' && !!(window.SpeechRecognition || window.webkitSpeechRecognition);
    },
    listenOnce({ onResult, onEnd, onError }) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { onError && onError('Speech recognition not supported on this browser.'); return null; }
      const rec = new SR();
      rec.lang = 'en-US';
      rec.interimResults = true;
      rec.continuous = true;
      let finalText = '';
      rec.onresult = (e) => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) finalText += e.results[i][0].transcript + ' ';
          else interim += e.results[i][0].transcript;
        }
        onResult && onResult((finalText + interim).trim());
      };
      rec.onerror = (e) => onError && onError(e.error);
      rec.onend = () => onEnd && onEnd(finalText.trim());
      try { rec.start(); } catch (err) { onError && onError(err.message); }
      return rec;
    }
  };
})();

  function parsePrompt(rawPrompt) {
    const text = (rawPrompt || '').toLowerCase();
    const matchRule = (rules) => rules.filter(r => r.words.some(w => text.includes(w)));

    const scenes = matchRule(SCENE_RULES);
    const styles = matchRule(STYLE_RULES);
    const weathers = matchRule(WEATHER_RULES);
    const subjects = matchRule(SUBJECT_RULES);
    const props = matchRule(PROP_RULES);

    const colors = [];
    for (const [name, hex] of Object.entries(COLOR_MAP)) {
      const rx = new RegExp(`\\b${name}\\b`, 'i');
      if (rx.test(text)) colors.push({ name, hex });
    }

    let count = 1;
    if (/\b(three|3)\b/.test(text)) count = 3;
    else if (/\b(two|2|pair|twin|couple|double)\b/.test(text)) count = 2;
    else if (/\b(giant|huge|massive|mega|enormous)\b/.test(text)) count = 1.35;
    else if (/\b(tiny|mini|little|small|baby)\b/.test(text)) count = 0.72;

    return {
      raw: rawPrompt || '',
      scene: scenes[0]?.key || 'forest',
      sceneLabel: scenes[0]?.label || 'Autumn Scene',
      style: styles[0]?.key || 'storybook',
      styleLabel: styles[0]?.label || 'Storybook',
      weathers: weathers.map(w => w.key),
      weatherLabels: weathers.map(w => w.label),
      subjects: subjects.length ? subjects.slice(0, 3).map(s => s.key) : ['turkey'],
      subjectLabels: subjects.length ? subjects.slice(0, 3).map(s => s.label) : ['Turkey'],
      props: props.map(p => p.key),
      propLabels: props.map(p => p.label),
      colors,
      count,
    };
  }

  // ---- Drawing helpers ----
  function drawBackground(ctx, w, h, parsed, rng) {
    const tint = parsed.colors[0]?.hex;
    const grad = ctx.createLinearGradient(0, 0, 0, h);

    switch (parsed.scene) {
      case 'space':
        grad.addColorStop(0, '#0B1026');
        grad.addColorStop(0.65, '#1B234A');
        grad.addColorStop(1, '#3D2748');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        // Stars
        for (let i = 0; i < 65; i++) {
          ctx.fillStyle = `rgba(255,250,230,${0.35 + rng() * 0.65})`;
          ctx.beginPath();
          ctx.arc(rng() * w, rng() * h * 0.78, 0.8 + rng() * 2, 0, Math.PI * 2);
          ctx.fill();
        }
        // Ringed planet
        ctx.save();
        ctx.translate(w * 0.8, h * 0.22);
        ctx.fillStyle = tint && tint !== 'rainbow' ? tint : '#E58A4E';
        ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#F7D794'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.ellipse(0, 2, 44, 11, -0.22, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
        // Crater surface
        ctx.fillStyle = '#B85A3A';
        ctx.beginPath();
        ctx.moveTo(0, h * 0.74);
        ctx.quadraticCurveTo(w * 0.5, h * 0.66, w, h * 0.76);
        ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#8F3F26';
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.ellipse(w * (0.15 + i * 0.24), h * (0.83 + (i % 2) * 0.06), 24, 8, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        break;

      case 'beach':
        grad.addColorStop(0, '#58B4E8');
        grad.addColorStop(0.55, '#A9E4F7');
        grad.addColorStop(1, '#FFE6A7');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        // Sun
        ctx.fillStyle = '#FFD15C';
        ctx.beginPath(); ctx.arc(w * 0.82, h * 0.2, 28, 0, Math.PI * 2); ctx.fill();
        // Ocean
        ctx.fillStyle = '#2B8CBE';
        ctx.fillRect(0, h * 0.58, w, h * 0.22);
        ctx.fillStyle = '#7FD1E8';
        for (let i = 0; i < 6; i++) {
          ctx.fillRect(20 + i * 75, h * 0.64 + (i % 2) * 10, 40, 4);
        }
        // Sand
        ctx.fillStyle = '#F2CF8D';
        ctx.beginPath();
        ctx.moveTo(0, h * 0.74);
        ctx.quadraticCurveTo(w * 0.45, h * 0.68, w, h * 0.78);
        ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fill();
        // Palm tree silhouette
        ctx.strokeStyle = '#7D512D'; ctx.lineWidth = 10;
        ctx.beginPath(); ctx.moveTo(w * 0.12, h * 0.84); ctx.quadraticCurveTo(w * 0.17, h * 0.52, w * 0.2, h * 0.34); ctx.stroke();
        ctx.fillStyle = '#3A874D';
        for (let a = 0; a < 5; a++) {
          ctx.save(); ctx.translate(w * 0.2, h * 0.34); ctx.rotate(-2.4 + a * 1.15);
          ctx.beginPath(); ctx.ellipse(26, 0, 30, 8, 0.2, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }
        break;

      case 'snow':
        grad.addColorStop(0, '#4E7AA8');
        grad.addColorStop(0.6, '#A9CBE8');
        grad.addColorStop(1, '#EFF6FC');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        // Mountains
        const peaks = [[0.18, 0.32], [0.52, 0.26], [0.85, 0.36]];
        peaks.forEach(([px, py]) => {
          ctx.fillStyle = '#7395B8';
          ctx.beginPath(); ctx.moveTo(w * (px - 0.28), h * 0.78); ctx.lineTo(w * px, h * py); ctx.lineTo(w * (px + 0.28), h * 0.78); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath(); ctx.moveTo(w * (px - 0.09), h * (py + 0.16)); ctx.lineTo(w * px, h * py); ctx.lineTo(w * (px + 0.09), h * (py + 0.16)); ctx.closePath(); ctx.fill();
        });
        ctx.fillStyle = '#F7FBFF';
        ctx.fillRect(0, h * 0.72, w, h * 0.28);
        break;

      case 'volcano':
        grad.addColorStop(0, '#3D1518');
        grad.addColorStop(0.6, '#962E22');
        grad.addColorStop(1, '#E87424');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#4A2C2A';
        ctx.beginPath(); ctx.moveTo(w * 0.12, h * 0.8); ctx.lineTo(w * 0.44, h * 0.28); ctx.lineTo(w * 0.56, h * 0.28); ctx.lineTo(w * 0.88, h * 0.8); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#FF9F1C';
        ctx.beginPath(); ctx.moveTo(w * 0.45, h * 0.28); ctx.quadraticCurveTo(w * 0.5, h * 0.52, w * 0.43, h * 0.78); ctx.lineTo(w * 0.55, h * 0.78); ctx.quadraticCurveTo(w * 0.53, h * 0.48, w * 0.55, h * 0.28); ctx.fill();
        ctx.fillStyle = '#3B2320'; ctx.fillRect(0, h * 0.75, w, h * 0.25);
        break;

      case 'city':
        grad.addColorStop(0, '#1D2944');
        grad.addColorStop(0.6, '#485A82');
        grad.addColorStop(1, '#E08E6D');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        // Buildings
        for (let i = 0; i < 9; i++) {
          const bw = 42 + (i % 3) * 14;
          const bh = 80 + ((i * 37) % 110);
          const bx = i * 52;
          ctx.fillStyle = i % 2 ? '#23304A' : '#2E3D5C';
          ctx.fillRect(bx, h * 0.76 - bh, bw, bh);
          ctx.fillStyle = '#FCD36B';
          for (let wy = h * 0.76 - bh + 12; wy < h * 0.72; wy += 16) {
            for (let wx = bx + 8; wx < bx + bw - 10; wx += 12) {
              if ((wx + wy) % 3 !== 0) ctx.fillRect(wx, wy, 6, 8);
            }
          }
        }
        ctx.fillStyle = '#3C4048'; ctx.fillRect(0, h * 0.75, w, h * 0.25);
        ctx.fillStyle = '#F2C14E';
        for (let x = 15; x < w; x += 55) ctx.fillRect(x, h * 0.87, 30, 5);
        break;

      case 'kitchen':
        grad.addColorStop(0, '#F7E7CE');
        grad.addColorStop(1, '#E8CCA5');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        // Window
        ctx.fillStyle = '#9ED0E8'; ctx.fillRect(w * 0.68, h * 0.12, 95, 75);
        ctx.strokeStyle = '#8C5A32'; ctx.lineWidth = 5;
        ctx.strokeRect(w * 0.68, h * 0.12, 95, 75);
        ctx.beginPath(); ctx.moveTo(w * 0.68 + 47.5, h * 0.12); ctx.lineTo(w * 0.68 + 47.5, h * 0.12 + 75); ctx.stroke();
        // Tablecloth & wooden table
        ctx.fillStyle = '#9E2A2B';
        ctx.fillRect(0, h * 0.68, w, h * 0.32);
        ctx.fillStyle = '#FAF2E4';
        for (let x = 0; x < w; x += 40) ctx.fillRect(x, h * 0.68, 20, h * 0.32);
        ctx.fillStyle = 'rgba(158,42,43,0.45)';
        ctx.fillRect(0, h * 0.68, w, 14);
        break;

      case 'underwater':
        grad.addColorStop(0, '#167D9A');
        grad.addColorStop(0.7, '#0D4B68');
        grad.addColorStop(1, '#0A2D42');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        // Bubbles
        ctx.strokeStyle = 'rgba(200,245,255,0.55)'; ctx.lineWidth = 2;
        for (let i = 0; i < 18; i++) {
          ctx.beginPath(); ctx.arc(rng() * w, rng() * h * 0.8, 3 + rng() * 9, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.fillStyle = '#D9B982'; ctx.fillRect(0, h * 0.78, w, h * 0.22);
        break;

      case 'night':
        grad.addColorStop(0, '#0F172A');
        grad.addColorStop(0.7, '#1E294B');
        grad.addColorStop(1, '#312E59');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        // Crescent Moon
        ctx.fillStyle = '#FDE68A';
        ctx.beginPath(); ctx.arc(w * 0.8, h * 0.2, 26, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#141D35';
        ctx.beginPath(); ctx.arc(w * 0.83, h * 0.18, 22, 0, Math.PI * 2); ctx.fill();
        for (let i = 0; i < 45; i++) {
          ctx.fillStyle = '#FEF9C3';
          ctx.beginPath(); ctx.arc(rng() * w, rng() * h * 0.68, 1 + rng() * 1.8, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = '#1D332B'; ctx.fillRect(0, h * 0.74, w, h * 0.26);
        break;

      case 'sunset':
        grad.addColorStop(0, '#4E3168');
        grad.addColorStop(0.45, '#D95D39');
        grad.addColorStop(0.85, '#F4B942');
        grad.addColorStop(1, '#FFE19C');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#FFF3B0';
        ctx.beginPath(); ctx.arc(w * 0.5, h * 0.62, 44, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#5E3828';
        ctx.beginPath(); ctx.moveTo(0, h * 0.72); ctx.quadraticCurveTo(w * 0.35, h * 0.64, w, h * 0.74); ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fill();
        break;

      default: // Autumn woods
        grad.addColorStop(0, '#8EC5E8');
        grad.addColorStop(0.55, '#F5DFC0');
        grad.addColorStop(1, '#EBB678');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        // Warm sun
        ctx.fillStyle = 'rgba(255,232,163,0.9)';
        ctx.beginPath(); ctx.arc(w * 0.82, h * 0.2, 26, 0, Math.PI * 2); ctx.fill();
        // Rolling autumn hills
        ctx.fillStyle = '#C97B36';
        ctx.beginPath(); ctx.moveTo(0, h * 0.66); ctx.quadraticCurveTo(w * 0.3, h * 0.54, w * 0.65, h * 0.68); ctx.quadraticCurveTo(w * 0.88, h * 0.74, w, h * 0.62); ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fill();
        // Autumn trees
        const treeCols = ['#B83B28', '#D97224', '#DF9F28', '#8F3524'];
        for (let i = 0; i < 4; i++) {
          const tx = w * (0.12 + i * 0.25);
          const ty = h * 0.64;
          ctx.fillStyle = '#5C3A21'; ctx.fillRect(tx - 5, ty - 25, 10, 34);
          ctx.fillStyle = treeCols[i % treeCols.length];
          ctx.beginPath(); ctx.arc(tx, ty - 38, 24, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = '#6E8542';
        ctx.beginPath(); ctx.moveTo(0, h * 0.74); ctx.quadraticCurveTo(w * 0.5, h * 0.68, w, h * 0.76); ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fill();
        break;
    }

    // Subtle color tint wash if user explicitly mentioned a standout color
    if (tint && tint !== 'rainbow') {
      ctx.fillStyle = tint + '1C';
      ctx.fillRect(0, 0, w, h);
    }
  }

  function drawWeather(ctx, w, h, parsed, rng) {
    if (parsed.weathers.includes('rainbow') || parsed.colors.some(c => c.name === 'rainbow')) {
      const cols = ['#E63946', '#F48C06', '#F9C74F', '#43AA8B', '#3A86FF', '#8338EC'];
      cols.forEach((col, i) => {
        ctx.strokeStyle = col; ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.arc(w * 0.5, h * 0.72, 175 - i * 7, Math.PI, 0);
        ctx.stroke();
      });
    }
    if (parsed.weathers.includes('snowflakes') || parsed.scene === 'snow') {
      ctx.fillStyle = 'rgba(255,255,255,0.88)';
      for (let i = 0; i < 36; i++) {
        ctx.beginPath(); ctx.arc(rng() * w, rng() * h, 1.8 + rng() * 3, 0, Math.PI * 2); ctx.fill();
      }
    }
    if (parsed.weathers.includes('leaves')) {
      const leafCols = ['#D64528', '#E08E24', '#C4382B', '#EBB134'];
      for (let i = 0; i < 22; i++) {
        ctx.save();
        ctx.translate(rng() * w, rng() * h * 0.85);
        ctx.rotate(rng() * Math.PI * 2);
        ctx.fillStyle = leafCols[i % leafCols.length];
        ctx.beginPath(); ctx.ellipse(0, 0, 8, 4, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    }
    if (parsed.weathers.includes('fireworks')) {
      const bursts = [[w * 0.25, h * 0.24, '#FF595E'], [w * 0.75, h * 0.22, '#FFCA3A'], [w * 0.5, h * 0.16, '#8AC926']];
      bursts.forEach(([bx, by, col]) => {
        ctx.strokeStyle = col; ctx.lineWidth = 2.5;
        for (let a = 0; a < 12; a++) {
          const ang = (a / 12) * Math.PI * 2;
          ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + Math.cos(ang) * 26, by + Math.sin(ang) * 26); ctx.stroke();
        }
      });
    }
    if (parsed.weathers.includes('rain')) {
      ctx.strokeStyle = 'rgba(180,220,255,0.6)'; ctx.lineWidth = 1.6;
      for (let i = 0; i < 45; i++) {
        const rx = rng() * w, ry = rng() * h;
        ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx - 5, ry + 16); ctx.stroke();
      }
    }
  }

  function drawHat(ctx, propKey, x, y, scale = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    if (propKey === 'crown') {
      ctx.fillStyle = '#F2C14E'; ctx.strokeStyle = '#9E6D10'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-22, 6); ctx.lineTo(-26, -16); ctx.lineTo(-10, -4); ctx.lineTo(0, -22); ctx.lineTo(10, -4); ctx.lineTo(26, -16); ctx.lineTo(22, 6);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#D63838'; ctx.beginPath(); ctx.arc(0, -4, 3.5, 0, Math.PI * 2); ctx.fill();
    } else if (propKey === 'wizardhat') {
      ctx.fillStyle = '#3B358C';
      ctx.beginPath(); ctx.ellipse(0, 6, 30, 7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-19, 4); ctx.lineTo(4, -38); ctx.lineTo(20, 4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#F9D649'; ctx.beginPath(); ctx.arc(0, -14, 4, 0, Math.PI * 2); ctx.fill();
    } else if (propKey === 'chefhat') {
      ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = '#D6CFC7'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(-14, -12, 13, 0, Math.PI * 2); ctx.arc(0, -18, 15, 0, Math.PI * 2); ctx.arc(14, -12, 13, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(-18, -6, 36, 15); ctx.strokeRect(-18, -6, 36, 15);
    } else if (propKey === 'pilgrimhat') {
      ctx.fillStyle = '#241E1C';
      ctx.beginPath(); ctx.ellipse(0, 6, 32, 7, 0, 0, Math.PI * 2); ctx.fill();

  function applyStyleFilter(canvas, ctx, style) {
    const w = canvas.width, h = canvas.height;
    if (style === 'pixel') {
      const small = document.createElement('canvas');
      small.width = 56; small.height = 38;
      const sctx = small.getContext('2d');
      sctx.drawImage(canvas, 0, 0, 56, 38);
      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(small, 0, 0, 56, 38, 0, 0, w, h);
      ctx.imageSmoothingEnabled = true;
    } else if (style === 'vintage') {
      const img = ctx.getImageData(0, 0, w, h);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i + 1], b = d[i + 2];
        d[i] = Math.min(255, r * 0.393 + g * 0.769 + b * 0.189 + 14);
        d[i + 1] = Math.min(255, r * 0.349 + g * 0.686 + b * 0.168 + 6);
        d[i + 2] = Math.min(255, r * 0.272 + g * 0.534 + b * 0.131);
      }
      ctx.putImageData(img, 0, 0);
      const vig = ctx.createRadialGradient(w / 2, h / 2, w * 0.25, w / 2, h / 2, w * 0.65);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(43,26,12,0.45)');
      ctx.fillStyle = vig; ctx.fillRect(0, 0, w, h);
    } else if (style === 'neon') {
      ctx.globalCompositeOperation = 'multiply';
      ctx.fillStyle = '#3A1C71';
      ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'screen';
      const g = ctx.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, 'rgba(255,0,160,0.28)');
      g.addColorStop(1, 'rgba(0,245,255,0.28)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'source-over';
    } else if (style === 'sketch') {
      const img = ctx.getImageData(0, 0, w, h);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        const v = lum > 155 ? 248 : lum > 95 ? 165 : 42;
        d[i] = v; d[i + 1] = v - 3; d[i + 2] = v - 8;

      ctx.putImageData(img, 0, 0);
    } else if (style === 'watercolor') {
      ctx.fillStyle = 'rgba(255,248,238,0.18)';
      ctx.fillRect(0, 0, w, h);

  function renderToCanvas(canvas, prompt) {
    const w = canvas.width || 440;
    const h = canvas.height || 300;
    const ctx = canvas.getContext('2d');
    const parsed = parsePrompt(prompt);
    const rng = makeRng(prompt);

    ctx.clearRect(0, 0, w, h);
    drawBackground(ctx, w, h, parsed, rng);
    drawWeather(ctx, w, h, parsed, rng);

    const accent = parsed.colors[0]?.hex || null;

    } else if (missLabels.length) {

      comment = `Prompt detail coverage was ${lex.pct}% compared to the original scene description.`;

      score: total,
      semanticPct: checkPct,
      visualPct: lex.pct,
      lexicalPct: lex.pct,
      primaryScore: checkPct,

  let lanBaseUrl = '';
  let es = null;
  let bc = null;
  let ws = null;
  let mqttReady = false;
  let brokerIdx = 0;
  let consecutiveFails = 0;
  let pktCounter = 1;
  let pingTimer = null;
  let reconnectTimer = null;
  let wakeHandler = null;
  let shouldRun = false;
  let outbox = []; // { subTopic, bodyStr, retain }
  let flushRunning = false;
  let listeners = [];
  let statusListeners = [];
  let seenIds = new Set();
  const chunkBuffers = new Map();
  const clientId = 'tg_' + Math.random().toString(36).slice(2, 10);

  function notifyStatus() {
    const ok = mode === 'lan' || mode === 'local' || mqttReady;
    statusListeners.forEach(fn => { try { fn(ok, mode); } catch (_) {} });
  }

  function emit(msg) {
    if (!msg || !msg.id) return;
    if (seenIds.has(msg.id)) return;
    seenIds.add(msg.id);
    if (seenIds.size > 2000) {
      const first = seenIds.values().next().value;
      seenIds.delete(first);
    }

    if (msg.type === 'IMG_CHUNK' && msg.imgKey && typeof msg.idx === 'number' && msg.total) {
      let buf = chunkBuffers.get(msg.imgKey);
      if (!buf || buf.total !== msg.total) {
        buf = { total: msg.total, parts: new Array(msg.total).fill(null), got: 0 };
        chunkBuffers.set(msg.imgKey, buf);
      }
      if (buf.parts[msg.idx] === null) {
        buf.parts[msg.idx] = msg.data;
        buf.got++;
      }
      if (buf.got === buf.total) {
        const dataUrl = buf.parts.join('');
        chunkBuffers.delete(msg.imgKey);
        const readyMsg = { id: 'img_' + msg.imgKey + '_' + Date.now(), type: 'IMG_READY', imgKey: msg.imgKey, dataUrl };
        listeners.forEach(fn => { try { fn(readyMsg); } catch (e) { console.error(e); } });
      }
      return;
    }

    listeners.forEach(fn => {
      try { fn(msg); } catch (e) { console.error(e); }
    });
  }

  async function detectTransport() {
    if (typeof window === 'undefined') return 'local';
    const proto = window.location.protocol;
    if (proto === 'http:' || proto === 'https:') {
      try {
        const res = await fetch('/api/info', { cache: 'no-store' });
        if (res.ok) {
          const info = await res.json();
          if (info && info.lanUrl) {
            lanBaseUrl = info.lanUrl;
            mode = 'lan';
            return mode;
          }
        }
      } catch (_) {}

      if (proto === 'https:' || proto === 'http:') {
        mode = 'cloud';
        return mode;
      }
    }
    mode = 'local';
    return mode;
  }

  function roomPrefix() {
    return 'tgfeast26/' + (roomCode || 'DEMO').toUpperCase().replace(/[^A-Z0-9]/g, '');
  }

  async function flushOutbox() {
    if (flushRunning || !mqttReady || !ws || ws.readyState !== 1) return;
    flushRunning = true;
    try {
      while (outbox.length > 0 && mqttReady && ws && ws.readyState === 1) {
        const item = outbox.shift();
        try {
          ws.send(mqttPubPkt(roomPrefix() + '/' + item.subTopic, item.bodyStr, item.retain));
        } catch (_) {
          outbox.unshift(item);
          break;
        }
        // Gently pace large image packets (~35KB) so 10 concurrent images stream smoothly to all 10+ phones!
        if (item.bodyStr.length > 8000) {
          await new Promise(r => setTimeout(r, 120));
        }
      }
    } finally {
      flushRunning = false;
    }
  }

  function openMqttSocket() {
    if (!shouldRun || mode !== 'cloud' || !roomCode) return;
    if (ws) { try { ws.close(); } catch (_) {} ws = null; }
    if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
    mqttReady = false;
    notifyStatus();

    const url = MQTT_BROKERS[brokerIdx % MQTT_BROKERS.length];
    let sock;
    try {
      sock = new WebSocket(url, 'mqtt');
      sock.binaryType = 'arraybuffer';
    } catch (_) {
      scheduleReconnect();
      return;
    }
    ws = sock;
    let buf = new Uint8Array(0);

    const connectGuard = setTimeout(() => {
      if (!mqttReady && ws === sock) {
        consecutiveFails++;
        // Only rotate broker if primary fails 4+ times in a row (prevents 1 phone splitting onto a different broker!)
        if (consecutiveFails >= 4) {
          brokerIdx = (brokerIdx + 1) % MQTT_BROKERS.length;
          consecutiveFails = 0;
        }
        try { sock.close(); } catch (_) {}
      }
    }, 6000);

    sock.onopen = () => {
      if (ws !== sock) return;
      try {
        sock.send(mqttConnectPkt(clientId + '_' + Math.random().toString(36).slice(2, 6)));
      } catch (_) {}
    };

    sock.onmessage = (ev) => {
      if (ws !== sock) return;
      const chunk = new Uint8Array(ev.data);
      const merged = new Uint8Array(buf.length + chunk.length);
      merged.set(buf);
      merged.set(chunk, buf.length);
      buf = merged;

      while (buf.length >= 2) {
        let pos = 1, mult = 1, len = 0, b = 0, complete = false;
        while (pos < buf.length) {
          b = buf[pos++];
          len += (b & 127) * mult;
          mult *= 128;
          if (!(b & 128)) { complete = true; break; }
          if (pos > 5) { buf = new Uint8Array(0); return; }
        }
        if (!complete || buf.length < pos + len) break;
        const type = buf[0] >> 4;
        const body = buf.subarray(pos, pos + len);
        buf = buf.subarray(pos + len);

        if (type === 2) { // CONNACK
          clearTimeout(connectGuard);
          consecutiveFails = 0;
          mqttReady = true;
          notifyStatus();
          try {
            sock.send(mqttSubPkt(++pktCounter, roomPrefix() + '/#'));
          } catch (_) {}
          if (pingTimer) clearInterval(pingTimer);
          pingTimer = setInterval(() => {
            if (ws === sock && sock.readyState === 1) {
              try { sock.send(new Uint8Array([0xC0, 0x00])); } catch (_) {}
            }
          }, 24000);
          flushOutbox();
        } else if (type === 3) { // PUBLISH
          if (body.length < 2) continue;
          const tlen = (body[0] << 8) | body[1];
          if (2 + tlen > body.length) continue;
          const payloadStr = dec.decode(body.subarray(2 + tlen));
          if (!payloadStr) continue;
          try {
            const parsed = JSON.parse(payloadStr);
            emit(parsed);
          } catch (_) {}
        }
      }
    };

    sock.onclose = () => {
      clearTimeout(connectGuard);
      if (ws !== sock) return;
      ws = null;
      mqttReady = false;
      notifyStatus();
      if (shouldRun) scheduleReconnect(1200);
    };

    sock.onerror = () => {};
  }

  function scheduleReconnect(delayMs = 1200) {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(() => {
      reconnectTimer = null;
      if (shouldRun && mode === 'cloud' && (!ws || ws.readyState > 1)) {
        openMqttSocket();
      }
    }, delayMs);
  }

  // Re-subscribe (or reconnect) to immediately pull all retained state, submissions, drafts, results & AI images!
  async function pollNow() {
    if (mode !== 'cloud' || !roomCode) return;
    if (ws && ws.readyState === 1 && mqttReady) {
      try {
        const sub = roomPrefix() + '/#';
        ws.send(mqttUnsubPkt(++pktCounter, sub));
        setTimeout(() => {
          if (ws && ws.readyState === 1 && mqttReady) {
            try { ws.send(mqttSubPkt(++pktCounter, sub)); } catch (_) {}
          }
        }, 120);
      } catch (_) {}
    } else {
      openMqttSocket();
    }
  }

  function connect(code) {
    disconnect();
    roomCode = (code || genCode(4)).toUpperCase();
    shouldRun = true;
    brokerIdx = 0;
    consecutiveFails = 0;

    if (typeof BroadcastChannel !== 'undefined') {
      try {
        bc = new BroadcastChannel('tg_room_' + roomCode);
        bc.onmessage = (ev) => emit(ev.data);
      } catch (_) {}
    }

    if (mode === 'lan') {
      try {
        es = new EventSource(`/api/room/${encodeURIComponent(roomCode)}/events`);
        es.onmessage = (ev) => {
          try { emit(JSON.parse(ev.data)); } catch (_) {}
        };
      } catch (_) {}
      notifyStatus();
    } else if (mode === 'cloud') {
      openMqttSocket();
      if (typeof document !== 'undefined') {
        wakeHandler = () => {
          if (!document.hidden && shouldRun) {
            if (!ws || ws.readyState !== 1 || !mqttReady) openMqttSocket();
            else pollNow();
          }
        };
        document.addEventListener('visibilitychange', wakeHandler);
        window.addEventListener('focus', wakeHandler);
        window.addEventListener('online', wakeHandler);
      }
    }

    return roomCode;
  }

  function disconnect() {
    shouldRun = false;
    mqttReady = false;
    outbox = [];
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
    if (ws) { try { ws.close(); } catch (_) {} ws = null; }
    if (es) { try { es.close(); } catch (_) {} es = null; }
    if (bc) { try { bc.close(); } catch (_) {} bc = null; }
    if (wakeHandler && typeof document !== 'undefined') {
      document.removeEventListener('visibilitychange', wakeHandler);
      window.removeEventListener('focus', wakeHandler);
      window.removeEventListener('online', wakeHandler);
      wakeHandler = null;
    }
  }

  function mqttSubTopicFor(msg) {
    if (msg.type === 'HOST_STATE') return { subTopic: 'state', retain: true };
    if (msg.type === 'CLONE_RESULTS_FULL') return { subTopic: 'results', retain: true };
    if (msg.type === 'IMG_READY' && msg.imgKey) return { subTopic: 'img/' + String(msg.imgKey).replace(/[^a-zA-Z0-9_-]/g, ''), retain: true };
    // Retain every participant's prompt submission & draft on their own topic so Host NEVER misses anyone!
    if (msg.type === 'ACTION' && msg.action === 'SUBMIT_CLONE_PROMPT' && msg.playerId && msg.roundId) {
      const pid = String(msg.playerId).replace(/[^a-zA-Z0-9_-]/g, '');
      const rid = String(msg.roundId).replace(/[^a-zA-Z0-9_-]/g, '');
      return { subTopic: `sub/${rid}/${pid}`, retain: true };
    }
    if (msg.type === 'ACTION' && msg.action === 'CLONE_DRAFT' && msg.playerId && msg.roundId) {
      const pid = String(msg.playerId).replace(/[^a-zA-Z0-9_-]/g, '');
      const rid = String(msg.roundId).replace(/[^a-zA-Z0-9_-]/g, '');
      return { subTopic: `draft/${rid}/${pid}`, retain: true };
    }
    return { subTopic: 'events', retain: false };
  }

  function clearRetained(subTopic) {
    if (mode !== 'cloud' || !roomCode) return;
    outbox.push({ subTopic, bodyStr: '', retain: true });
    flushOutbox();
  }

  async function send(payload) {
    const msg = {
      ...payload,
      id: clientId + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      sender: clientId,
      ts: Date.now(),
    };
    seenIds.add(msg.id);

    if (bc) {
      try { bc.postMessage(msg); } catch (_) {}
    }

    let ok = true;
    if (mode === 'lan' && roomCode) {
      try {
        const res = await fetch(`/api/room/${encodeURIComponent(roomCode)}/send`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(msg),
        });
        ok = res.ok;
      } catch (_) { ok = false; }
    } else if (mode === 'cloud' && roomCode) {
      const { subTopic, retain } = mqttSubTopicFor(msg);
      const bodyStr = JSON.stringify(msg);
      // Replace any older queued HOST_STATE in outbox so only the newest state flushes!
      if (subTopic === 'state') {
        outbox = outbox.filter(x => x.subTopic !== 'state');
      }
      outbox.push({ subTopic, bodyStr, retain });
      flushOutbox();
      ok = mqttReady;
    }
    return { ...msg, ok };
  }

  function dataUrlToBlob(dataUrl) {
    const parts = String(dataUrl).split(',');
    const mimeMatch = parts[0].match(/:(.*?);/);
    const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
    const bstr = atob(parts[1] || '');
    const u8 = new Uint8Array(bstr.length);
    for (let i = 0; i < bstr.length; i++) u8[i] = bstr.charCodeAt(i);
    return new Blob([u8], { type: mime });
  }

  // LAN mode: upload to local Node server; Cloud mode: return null so sendImage() streams over unlimited WSS MQTT!
  async function uploadImage(dataUrl) {
    if (!dataUrl || !roomCode) return null;
    if (mode === 'lan') {
      try {
        const blob = dataUrlToBlob(dataUrl);
        const res = await fetch('/api/upload', {
          method: 'POST',
          headers: { 'Content-Type': blob.type },
          body: blob,
        });
        if (res.ok) {
          const j = await res.json();
          if (j && j.url) return j.url;
        }
      } catch (_) {}
    }
    return null;
  }

  async function uploadJSON(obj) {
    if (!obj || !roomCode) return null;
    if (mode === 'lan') {
      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(obj),
        });
        if (res.ok) {
          const j = await res.json();
          if (j && j.url) return j.url;
        }
      } catch (_) {}
    }
    return null;
  }

  // Send a full crisp image directly over WSS MQTT (retained!) or chunked fallback on local BroadcastChannel
  async function sendImage(imgKey, dataUrl) {
    if (!imgKey || !dataUrl) return;
    if (mode === 'cloud' || mode === 'lan') {
      await send({ type: 'IMG_READY', imgKey, dataUrl });
      return;
    }
    const CHUNK_SIZE = 2200;
    const total = Math.ceil(dataUrl.length / CHUNK_SIZE);
    for (let i = 0; i < total; i++) {
      await send({
        type: 'IMG_CHUNK',
        imgKey,
        idx: i,
        total,
        data: dataUrl.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE),
      });
    }
  }

  function onMessage(fn) {
    listeners.push(fn);
    return () => { listeners = listeners.filter(x => x !== fn); };
  }

  function onStatus(fn) {
    statusListeners.push(fn);
    return () => { statusListeners = statusListeners.filter(x => x !== fn); };
  }

  function getJoinUrl(customBase) {
    if (customBase && customBase.trim()) {
      const clean = customBase.trim().replace(/\/+$/, '');
      return `${clean}/?room=${roomCode}&join=1`;
    }
    if (lanBaseUrl) {
      return `${lanBaseUrl}/?room=${roomCode}&join=1`;
    }
    if (typeof window !== 'undefined' && /^https?:/.test(window.location.protocol)) {
      const u = new URL(window.location.href);
      u.search = `?room=${roomCode}&join=1`;
      u.hash = '';
      return u.toString();
    }
    return `https://thanksgiving-game-night.local/?room=${roomCode}&join=1`;
  }

  return {
    genCode,
    detectTransport,
    connect,
    disconnect,
    pollNow,
    send,
    clearRetained,
    uploadImage,
    uploadJSON,
    sendImage,
    onMessage,
    onStatus,
    isConnected: () => mode === 'lan' || mode === 'local' || mqttReady,
    getJoinUrl,
    getMode: () => mode,
    getRoomCode: () => roomCode,
    getClientId: () => clientId,
    setLanBaseUrl: (u) => { lanBaseUrl = u; },
  };
})();

              // Blend 88% strict 5-axis visual score + 12% prompt-detail precision for fair, discriminating spread
              grade.scoringMode = 'vision';
              grade.primaryScore = vis.visionScore ?? vis.score;
              grade.score = Math.max(5, Math.min(99, Math.round(vis.score * 0.88 + lexPct * 0.12)));
              if (Array.isArray(vis.breakdown) && vis.breakdown.length) grade.breakdown = vis.breakdown;
              if (vis.comment) grade.comment = vis.comment;
            }
          } else if (liveCfg.apiKey && liveCfg.provider !== 'builtin') {
            const llm = await LiveAI.askJSON(
              'You are a strict, fair visual art judge for Prompt Clone. Grade strictly across 5 axes: subject(0-30), setting(0-20), props(0-20), style(0-15), palette(0-15). Use exact discriminating integers across 10-98 — NEVER cluster scores at 70!',
              `Original target image prompt: "${refPrompt}"\nPlayer "${p.name}" wrote: "${sub.text}"\nReturn JSON: {"subject": int, "setting": int, "props": int, "style": int, "palette": int, "comment": "2 short, concrete sentences: first praise what matched closely, second explain what differed or was missing and cost points."}`
            );
            if (llm && (typeof llm.subject === 'number' || typeof llm.score === 'number')) {
              const rawScore = typeof llm.subject === 'number'
                ? Math.max(5, Math.min(99, Math.round((llm.subject || 0) + (llm.setting || 0) + (llm.props || 0) + (llm.style || 0) + (llm.palette || 0))))
                : Math.max(5, Math.min(99, Math.round(llm.score)));
              grade.scoringMode = 'llm';
              grade.primaryScore = rawScore;
              grade.score = Math.max(5, Math.min(99, Math.round(rawScore * 0.85 + lexPct * 0.15)));
              if (typeof llm.subject === 'number') {
                const subS = Math.max(0, Math.min(30, Math.round(llm.subject || 0)));
                const setS = Math.max(0, Math.min(20, Math.round(llm.setting || 0)));
                const prpS = Math.max(0, Math.min(20, Math.round(llm.props || 0)));
                const styS = Math.max(0, Math.min(15, Math.round(llm.style || 0)));
                const palS = Math.max(0, Math.min(15, Math.round(llm.palette || 0)));
                grade.breakdown = [
                  { label: `Subject ${subS}/30`, hit: subS >= 23, partial: subS >= 14 && subS < 23 },
                  { label: `Setting ${setS}/20`, hit: setS >= 15, partial: setS >= 9 && setS < 15 },
                  { label: `Props ${prpS}/20`, hit: prpS >= 15, partial: prpS >= 9 && prpS < 15 },
                  { label: `Style ${styS}/15`, hit: styS >= 11, partial: styS >= 6 && styS < 11 },
                  { label: `Palette ${palS}/15`, hit: palS >= 11, partial: palS >= 6 && palS < 11 },
                ];
              }
              if (llm.comment) grade.comment = llm.comment;
            }
          }
        } catch (err) {
          if (!aiWarning && err?.message) aiWarning = err.message;
        }

        results[i] = {
          player: p,
          prompt: sub.text,
          dataUrl: gen.dataUrl,
          aiUrl: aiImg.url,
          aiDataUrl: aiImg.dataUrl,
          hiResDataUrl,
          sharedUrl,
          imgSource: aiImg.source,
          autoCollected: !!sub.autoCollected,
          ...grade,
        };

        completedCount++;
        gradingStatus = `🍌 Generated ${completedCount}/${gradingQueue.length} AI images (${p.name} done!)...`;
        const stEl = document.getElementById('clone-grading-status');
        if (stEl) stEl.textContent = gradingStatus;
        scheduleBroadcastPhoneState(300);
      }

      // Dynamic 3-worker pool: processes 10+ players ~3x faster AND seamlessly picks up any late-arriving submission!
      const CONCURRENCY = 3;
      let cursor = 0;
      async function worker() {
        while (cursor < gradingQueue.length) {
          const i = cursor++;
          const [pid, sub] = gradingQueue[i];
          await processEntry(i, pid, sub);
        }
      }
      await Promise.all(Array.from({ length: Math.min(CONCURRENCY, Math.max(1, gradingQueue.length)) }, () => worker()));

      while (cursor < gradingQueue.length) {
        const i = cursor++;
        const [pid, sub] = gradingQueue[i];
        await processEntry(i, pid, sub);
      }

      const finalResults = results.filter(Boolean);
      gradingQueue = null;
      gradingSeen = null;

      finalResults.sort((a, b) => (b.score - a.score) || ((b.lexicalPct || 0) - (a.lexicalPct || 0)) || (b.prompt.length - a.prompt.length));
      gradedResults = finalResults;
      gradedResults._warning = aiWarning;

      finalResults.forEach((r, rank) => {
        const bonus = rank === 0 ? 100 : rank === 1 ? 50 : rank === 2 ? 25 : 0;
        const basePts = Math.round(r.score * 2);
        const pts = basePts + bonus;
        r.rank = rank;
        r.totalPlayers = finalResults.length;
        r.basePts = basePts;
        r.bonusPts = bonus;
        r.pointsAwarded = pts;
        r.gapToFirst = rank === 0 ? 0 : Math.max(0, finalResults[0].score - r.score);
        r.marginOrGap = rank === 0
          ? (finalResults[1] ? Math.max(0, r.score - finalResults[1].score) : 0)
          : Math.max(0, finalResults[rank - 1].score - r.score);
        r.aboveName = rank === 0
          ? (finalResults[1]?.player?.name || '')
          : (finalResults[rank - 1]?.player?.name || '');
        const tiedPrev = rank > 0 && finalResults[rank - 1].score === r.score;
        const tiedNext = rank < finalResults.length - 1 && finalResults[rank + 1].score === r.score;
        r.tieBreakNote = (tiedPrev || tiedNext)
          ? `Tie-breaker: Prompt Detail ${r.lexicalPct || 0}%`
          : '';
        App.addScore(r.player.id, pts);
      });

      // Upload ONE atomic JSON containing ALL ranked participants + full prompts + direct Nano Banana image URLs!
      const fullPayload = {
        roundId,
        items: finalResults.map((r, i) => ({
          ...toCompactResult(r, i),
          p: r.prompt || '',
          c: r.comment || '',
          bd: (r.breakdown || []).slice(0, 6),
        })),
      };
      resultsUrl = await RoomSync.uploadJSON(fullPayload, `results_${roundId}.json`);

      phase = 'results';
      gradingStatus = '';
      SoundFX.fanfare();
      if (finalResults.length > 0) {
        SoundFX.speak(`Grading complete! ${finalResults[0].player.name} wins with a ${finalResults[0].score} percent match!`);
      }
      broadcastPhoneState();
      render();
      broadcastResultsToPhones();
    }

    function render() {

              </div>

            </div>

                  <button class="btn btn-sm ${durationSec === 180 ? 'btn-primary' : ''}" data-dur="180">3 min</button>

            <div class="art-frame" style="max-width:420px;">${targetImgHtml}</div>
            <div class="card stack">
              <label class="small"><strong>Describe the image in your own words:</strong></label>
              <textarea class="textarea" id="clone-prompt-box" placeholder="Type your own description of what you see...">${esc(existing)}</textarea>
              <div class="row-between">
                <button class="btn" id="clone-back-writing">Cancel</button>

        document.getElementById('clone-lock-in').onclick = () => {

            ${gradedResults._warning ? `
              <div class="card small" style="border-color:var(--cranberry);color:var(--cranberry);">
                <strong>⚠️ AI Image Notice:</strong> ${esc(gradedResults._warning)} — fell back to Built-In Instant Artist for this round. Check your key &amp; billing in <strong>⚙️ Settings</strong>!
              </div>

            <div class="clone-gallery">
              ${gradedResults.map((r, i) => {

                let standingLine = '';

                  else standingLine = `🥇 1st of ${totalN}${r.aboveName ? ` · Ahead of #2 (${esc(r.aboveName)}) by +${r.marginOrGap}%` : ''}`;
                } else {
                  const medal = i === 1 ? '🥈 ' : i === 2 ? '🥉 ' : '';
                  const parts = [`${medal}#${i + 1} of ${totalN}`];
                  if (i === 1) {
                    parts.push(r.gapToFirst === 0 ? `Tied on Match % with #1` : `${r.gapToFirst}% behind #1 (${esc(leaderName)})`);
                  } else {

                    if (r.gapToFirst > r.marginOrGap) parts.push(`${r.gapToFirst}% behind #1`);

                }
                const basePts = r.basePts ?? Math.round(r.score * 2);
                const bonusPts = r.bonusPts ?? 0;
                const bonusTag = bonusPts === 100 ? '🥇 1st Bonus' : bonusPts === 50 ? '🥈 2nd Bonus' : bonusPts === 25 ? '🥉 3rd Bonus' : '';
                let matchLine = '';
                if (r.scoringMode === 'vision' && typeof r.primaryScore === 'number') {
                  matchLine = `📊 <strong>Match %:</strong> 88% Visual Rubric (${r.primaryScore}/100) + 12% Prompt Detail (${r.lexicalPct ?? 0}%) = <strong>${r.score}%</strong>`;
                } else if (r.scoringMode === 'llm' && typeof r.primaryScore === 'number') {

                  : `⭐ <strong>Points:</strong> ${r.score}% × 2 = <span class="math-total">+${r.pointsAwarded} pts</span> <span class="muted">(Top 3 earn +100/+50/+25 bonus)</span>`;
                return `
                <div class="clone-card ${i === 0 ? 'winner' : ''}">

                      <span class="mono" style="font-weight:800;font-size:1.15rem;color:${r.score >= 70 ? 'var(--sage)' : 'var(--pumpkin)'};">${r.score}% Match</span>

                    <div class="standing-bar ${i === 0 ? 'first' : ''}">
