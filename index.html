<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Thanksgiving AI Game Night — 6 Interactive Family Games</title>
  <meta name="description" content="Six interactive AI Thanksgiving games for kids and adults: Prompt Clone, Turkey Court, Prompt Panic, Pass the Gobble Bomb, Spot the Bot, and Feast Showdown — with QR phone joining." />
  <style>
/* Thanksgiving AI Game Night — Warm Harvest Table Design System */
:root {
  --bg: #FAF4EA;
  --surface: #FFFDF8;
  --surface-alt: #F3E9D8;
  --ink: #2B1E16;
  --ink-muted: #6C5849;
  --border: #E2D4BF;
  --border-strong: #CEBAA0;

  --pumpkin: #C85A17;
  --pumpkin-dark: #A4440E;
  --cranberry: #A62629;
  --cranberry-dark: #841C1F;
  --sage: #2E6B4F;
  --sage-soft: #E5F1EA;
  --gold: #C98614;
  --gold-soft: #FBF1DA;

  --shadow-sm: 0 2px 6px rgba(43, 30, 22, 0.06);
  --shadow-md: 0 8px 24px rgba(43, 30, 22, 0.09);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;

  --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.45;
  min-height: 100%;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea, select {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

/* App Shell */
.app-shell {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 14px 48px;
}

/* Sticky Top Navigation Bar */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(250, 244, 234, 0.94);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  margin: 0 -14px 18px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}

.brand-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: none;
  border: none;
  padding: 6px 8px;
  margin-left: -6px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  text-align: left;
  transition: background 0.15s;
}
.brand-btn:hover { background: var(--surface-alt); }
.brand-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.05rem;
  letter-spacing: -0.015em;
  color: var(--ink);
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.icon-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 7px 11px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  font-size: 0.84rem;
  font-weight: 600;
  cursor: pointer;
  min-height: 38px;
  transition: transform 0.12s, background 0.15s, border-color 0.15s;
}
.icon-pill:hover { background: var(--surface-alt); }
.icon-pill:active { transform: scale(0.97); }
.icon-pill.active {
  background: var(--ink);
  color: var(--surface);
  border-color: var(--ink);
}
.icon-pill.qr-pill {
  background: var(--gold-soft);
  border-color: #DFC086;
  color: #6B4408;
}

/* Typography */
h1 {
  font-family: var(--font-display);
  font-size: clamp(1.75rem, 4.5vw, 2.5rem);
  line-height: 1.15;
  letter-spacing: -0.02em;
  margin: 0 0 8px;
  color: var(--ink);
}
h2 {
  font-family: var(--font-display);
  font-size: clamp(1.3rem, 3.2vw, 1.75rem);
  line-height: 1.2;
  letter-spacing: -0.015em;
  margin: 0 0 8px;
}
h3 {
  font-size: 1.05rem;
  font-weight: 700;
  margin: 0 0 6px;
}
.muted { color: var(--ink-muted); }
.small { font-size: 0.87rem; }
.xs { font-size: 0.78rem; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.center { text-align: center; }

/* Cards & Panels */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 18px;
  box-shadow: var(--shadow-sm);
}
.card-warm {
  background: var(--surface-alt);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  padding: 16px;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 18px;
  min-height: 48px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--ink);
  font-weight: 700;
  font-size: 0.96rem;
  cursor: pointer;
  transition: transform 0.1s, background 0.15s, box-shadow 0.15s;
  text-decoration: none;
}
.btn:hover { background: var(--surface-alt); }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

.btn-primary {
  background: var(--pumpkin);
  border-color: var(--pumpkin);
  color: #FFFDF8;
  box-shadow: 0 3px 10px rgba(200, 90, 23, 0.24);
}
.btn-primary:hover { background: var(--pumpkin-dark); border-color: var(--pumpkin-dark); }

.btn-danger {
  background: var(--cranberry);
  border-color: var(--cranberry);
  color: #FFFDF8;
  box-shadow: 0 3px 10px rgba(166, 38, 41, 0.24);
}
.btn-danger:hover { background: var(--cranberry-dark); border-color: var(--cranberry-dark); }

.btn-success {
  background: var(--sage);
  border-color: var(--sage);
  color: #FFFDF8;
}
.btn-success:hover { background: #23553E; }

.btn-lg {
  min-height: 58px;
  font-size: 1.08rem;
  padding: 14px 24px;
  border-radius: 14px;
}
.btn-xl {
  min-height: 82px;
  font-size: 1.3rem;
  padding: 18px 28px;
  border-radius: 18px;
  width: 100%;
}
.btn-sm {
  min-height: 36px;
  padding: 6px 12px;
  font-size: 0.85rem;
}
.btn-block { width: 100%; }

/* Inputs */
.input, .textarea, .select {
  width: 100%;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border-strong);
  background: #FFFFFF;
  color: var(--ink);
  font-size: 1rem;
  transition: border-color 0.15s;
}
.input:focus, .textarea:focus, .select:focus {
  outline: none;
  border-color: var(--pumpkin);
}
.textarea { min-height: 92px; resize: vertical; line-height: 1.45; }

/* Layout helpers */
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 660px) {
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
}

/* Hero & Game Hub */
.hub-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.hub-sub { max-width: 580px; margin: 0; color: var(--ink-muted); font-size: 1rem; }

.game-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
@media (max-width: 680px) {
  .game-grid { grid-template-columns: 1fr; }
}

.game-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
  cursor: pointer;
  text-align: left;
  box-shadow: var(--shadow-sm);
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
}
.game-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
  border-color: var(--border-strong);
}
.game-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}
.game-icon {
  width: 48px;
  height: 48px;
  border-radius: 13px;
  background: var(--surface-alt);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.65rem;
  flex-shrink: 0;
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 700;
  background: var(--surface-alt);
  color: var(--ink-muted);
}
.tag-new { background: var(--cranberry); color: #FFF; }
.tag-kid { background: var(--sage-soft); color: var(--sage); }
.tag-gold { background: var(--gold-soft); color: #7C5006; }

/* Player Chips */
.roster-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.player-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 11px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  font-size: 0.88rem;
  font-weight: 600;
}
.player-chip .pts {
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--pumpkin);
}
.player-chip .rm {
  background: none;
  border: none;
  color: var(--ink-muted);
  cursor: pointer;
  padding: 0 2px;
  font-size: 1rem;
  line-height: 1;
}

/* Timers & Banners */
.timer-box {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: 999px;
  background: var(--surface-alt);
  border: 1px solid var(--border-strong);
  font-family: var(--font-mono);
  font-size: 1.35rem;
  font-weight: 800;
}
.timer-box.urgent {
  background: var(--cranberry);
  border-color: var(--cranberry);
  color: #FFF;
  animation: pulseFast 0.6s infinite alternate;
}

.twist-banner {
  background: var(--cranberry);
  color: #FFFDF8;
  border-radius: var(--radius-md);
  padding: 16px 18px;
  font-weight: 700;
  font-size: 1.08rem;
  animation: shakePop 0.45s ease;
}

/* Canvas & Image Frames */
.art-frame {
  position: relative;
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  border-radius: var(--radius-md);
  overflow: hidden;
  border: 2px solid var(--border-strong);
  background: #EFE4D2;
  aspect-ratio: 440 / 300;
}
.art-frame canvas, .art-frame img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  transition: filter 0.35s linear;
}

/* Split-Screen Multi-Player Buzzers */
.buzzer-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
  gap: 10px;
}
.buzzer-pad {
  min-height: 76px;
  border-radius: 14px;
  border: 2px solid var(--border-strong);
  background: var(--surface);
  font-weight: 800;
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 10px;
  transition: transform 0.08s, background 0.12s;
  box-shadow: 0 4px 0 var(--border-strong);
}
.buzzer-pad:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--border-strong);
}
.buzzer-pad.buzzed {
  background: var(--pumpkin);
  border-color: var(--pumpkin-dark);
  color: #FFF;
  box-shadow: 0 4px 0 var(--pumpkin-dark);
}
.buzzer-pad.bot-slam {
  background: var(--cranberry);
  border-color: var(--cranberry-dark);
  color: #FFF;
  box-shadow: 0 4px 0 var(--cranberry-dark);
}

/* Quick-tap prompt chips */
.chip-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip {
  padding: 6px 11px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  font-size: 0.83rem;
  font-weight: 600;
  cursor: pointer;
}
.chip:hover { background: var(--surface-alt); }

/* Gobble Bomb Stage */
.bomb-stage {
  text-align: center;
  padding: 24px 18px;
  border-radius: var(--radius-lg);
  background: var(--surface);
  border: 2px solid var(--border-strong);
  transition: background 0.3s, border-color 0.3s;
}
.bomb-stage.hot {
  background: #FFF1EE;
  border-color: var(--cranberry);
}
.bomb-emoji {
  font-size: 4.5rem;
  line-height: 1;
  display: inline-block;
  animation: bombBeat 0.75s infinite alternate;
}
.twist-word-big {
  font-family: var(--font-display);
  font-size: clamp(1.9rem, 6vw, 3rem);
  font-weight: 700;
  color: var(--pumpkin);
  margin: 8px 0;
  letter-spacing: -0.02em;
}

/* Prompt Clone Gallery & Match Meter */
.clone-gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 14px;
}
.clone-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.clone-card.winner {
  border: 2px solid var(--gold);
  box-shadow: var(--shadow-md);
}
.clone-card-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.meter-track {
  width: 100%;
  height: 10px;
  border-radius: 999px;
  background: var(--surface-alt);
  overflow: hidden;
}
.meter-fill {
  height: 100%;
  border-radius: 999px;
  background: var(--sage);
  transition: width 0.6s ease;
}

/* Spot the Bot Answer Card */
.bot-reveal-card {
  background: var(--surface);
  border: 2px solid var(--border-strong);
  border-radius: var(--radius-lg);
  padding: 26px 20px;
  text-align: center;
  font-family: var(--font-display);
  font-size: clamp(1.25rem, 3.6vw, 1.75rem);
  line-height: 1.35;
  box-shadow: var(--shadow-md);
}

/* Modal Overlay */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: rgba(28, 20, 16, 0.56);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 20px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
}

.qr-box {
  width: 220px;
  height: 220px;
  margin: 0 auto;
  padding: 12px;
  background: #FFFFFF;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
}
.qr-box svg { width: 100%; height: 100%; display: block; }

/* Phone Controller Mode */
.controller-shell {
  max-width: 460px;
  margin: 0 auto;
  padding: 16px 14px 40px;
}
.controller-buzzer {
  width: 100%;
  min-height: 170px;
  border-radius: 26px;
  border: none;
  background: var(--cranberry);
  color: #FFF;
  font-size: 1.7rem;
  font-weight: 900;
  letter-spacing: 0.02em;
  box-shadow: 0 10px 0 var(--cranberry-dark), 0 16px 30px rgba(166, 38, 41, 0.3);
  cursor: pointer;
  transition: transform 0.08s, box-shadow 0.08s;
}
.controller-buzzer:active {
  transform: translateY(7px);
  box-shadow: 0 3px 0 var(--cranberry-dark);
}

/* Animations */
@keyframes pulseFast {
  from { transform: scale(1); }
  to { transform: scale(1.04); }
}
@keyframes bombBeat {
  from { transform: scale(1) rotate(-3deg); }
  to { transform: scale(1.1) rotate(3deg); }
}
@keyframes shakePop {
  0% { transform: scale(0.94); }
  25% { transform: translateX(-6px) scale(1.02); }
  50% { transform: translateX(6px); }
  75% { transform: translateX(-3px); }
  100% { transform: translateX(0) scale(1); }
}
.fade-in { animation: fadeIn 0.22s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Divider */
.divider { height: 1px; background: var(--border); margin: 4px 0; }

<body>

  <script>
// Pure JS ISO/IEC 18004 QR Code Generator (Byte Mode, Versions 1-10, ECC Level M)
// Zero dependencies — renders crisp inline SVG scannable by any phone camera.

const QR = (() => {
  // GF(256) with primitive polynomial 0x11d
  const EXP = new Uint8Array(512);
  const LOG = new Uint8Array(256);
  {
    let x = 1;
    for (let i = 0; i < 255; i++) {
      EXP[i] = x;
      LOG[x] = i;
      x <<= 1;
      if (x & 0x100) x ^= 0x11d;
    }
    for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  }

  function gfMul(a, b) {
    if (a === 0 || b === 0) return 0;
    return EXP[LOG[a] + LOG[b]];
  }

  function rsGenerator(degree) {
    let poly = [1];
    for (let i = 0; i < degree; i++) {
      const next = new Array(poly.length + 1).fill(0);
      for (let j = 0; j < poly.length; j++) {
        next[j] ^= poly[j];
        next[j + 1] ^= gfMul(poly[j], EXP[i]);
      }
      poly = next;
    }
    return poly;
  }

  function rsRemainder(data, ecCount) {
    const gen = rsGenerator(ecCount);
    const res = new Uint8Array(ecCount);
    for (let i = 0; i < data.length; i++) {
      const factor = data[i] ^ res[0];
      for (let j = 0; j < ecCount - 1; j++) res[j] = res[j + 1];
      res[ecCount - 1] = 0;
      if (factor !== 0) {
        for (let j = 0; j < ecCount; j++) {
          res[j] ^= gfMul(gen[j + 1], factor);
        }
      }
    }
    return res;
  }

  // Version table for ECC Level M (Versions 1..10):
  // [totalCodewords, ecPerBlock, [[numBlocks, dataCwPerBlock], ...], alignmentCenters]
  const VERSIONS = [
    null,
    [26, 10, [[1, 16]], []],
    [44, 16, [[1, 28]], [6, 18]],
    [70, 26, [[1, 44]], [6, 22]],
    [100, 18, [[2, 32]], [6, 26]],
    [134, 24, [[2, 43]], [6, 30]],
    [172, 16, [[4, 27]], [6, 34]],
    [196, 18, [[4, 31]], [6, 22, 38]],
    [242, 22, [[2, 38], [2, 39]], [6, 24, 42]],
    [292, 22, [[3, 36], [2, 37]], [6, 26, 46]],
    [346, 26, [[4, 43], [1, 44]], [6, 28, 50]],
  ];

  // Precomputed 15-bit format info for ECC Level M (00) and mask 0..7
  function computeFormatBits(mask) {
    const data = (0b00 << 3) | mask; // ECC M = 00
    let rem = data << 10;
    const poly = 0x537;
    for (let i = 14; i >= 10; i--) {
      if ((rem >>> i) & 1) rem ^= poly << (i - 10);
    }
    return ((data << 10) | rem) ^ 0x5412;
  }

  // Precomputed 18-bit version info for versions 7..10
  function computeVersionBits(version) {
    let rem = version << 12;
    const poly = 0x1f25;
    for (let i = 17; i >= 12; i--) {
      if ((rem >>> i) & 1) rem ^= poly << (i - 12);
    }
    return (version << 12) | rem;
  }

  function encodeUTF8(str) {
    if (typeof TextEncoder !== 'undefined') {
      return Array.from(new TextEncoder().encode(str));
    }
    const bytes = [];
    for (let i = 0; i < str.length; i++) {
      const c = str.charCodeAt(i);
      if (c < 0x80) bytes.push(c);
      else if (c < 0x800) bytes.push(0xc0 | (c >> 6), 0x80 | (c & 0x3f));
      else bytes.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));
    }
    return bytes;
  }

  function buildCodewords(text) {
    const bytes = encodeUTF8(text);
    let version = -1;
    let totalDataCw = 0;

    for (let v = 1; v <= 10; v++) {
      const spec = VERSIONS[v];
      const dataCw = spec[2].reduce((s, [n, d]) => s + n * d, 0);
      const countBits = v <= 9 ? 8 : 16;
      const neededBits = 4 + countBits + bytes.length * 8;
      if (neededBits <= dataCw * 8) {
        version = v;
        totalDataCw = dataCw;
        break;
      }
    }
    if (version === -1) throw new Error('QR payload too long');

    const bits = [];
    const pushBits = (val, len) => {
      for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1);
    };

    // Byte mode indicator 0100
    pushBits(0b0100, 4);
    pushBits(bytes.length, version <= 9 ? 8 : 16);

// Sound Effects (Web Audio API) + AI Voice Host (Web Speech API) + Mic Helper
// 100% self-contained, zero external audio assets.

const SoundFX = (() => {
  let ctx = null;
  let muted = false;
  let voiceEnabled = true;

  function ensureCtx() {
    if (muted) return null;
    if (!ctx && typeof window !== 'undefined') {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ctx = new AC();
    }
    if (ctx && ctx.state === 'suspended') {
      ctx.resume().catch(() => {});
    }
    return ctx;
  }

  function tone(freq, duration, type = 'sine', gainVal = 0.18, delay = 0) {
    const c = ensureCtx();
    if (!c) return;
    const now = c.currentTime + delay;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(0.001, now);
    g.gain.exponentialRampToValueAtTime(gainVal, now + 0.015);
    g.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(g);
    g.connect(c.destination);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  }

  function noiseBurst(duration, gainVal = 0.25, delay = 0, filterFreq = 900) {
    const c = ensureCtx();
    if (!c) return;
    const now = c.currentTime + delay;
    const len = Math.floor(c.sampleRate * duration);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.35));
    const src = c.createBufferSource();
    src.buffer = buf;
    const filt = c.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(filterFreq, now);
    const g = c.createGain();
    g.gain.setValueAtTime(gainVal, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + duration);
    src.connect(filt);
    filt.connect(g);
    g.connect(c.destination);
    src.start(now);
  }

  return {
    isMuted: () => muted,
    isVoiceOn: () => voiceEnabled,
    toggleMute() { muted = !muted; if (muted) this.stopSpeech(); return muted; },
    toggleVoice() { voiceEnabled = !voiceEnabled; if (!voiceEnabled) this.stopSpeech(); return voiceEnabled; },

    pop() { tone(540, 0.08, 'triangle', 0.14); tone(760, 0.07, 'sine', 0.1, 0.04); },
    ding() { tone(784, 0.14, 'sine', 0.16); tone(1046.5, 0.28, 'sine', 0.18, 0.09); },
    wrong() { tone(240, 0.2, 'sawtooth', 0.12); tone(175, 0.32, 'sawtooth', 0.14, 0.14); },
    buzzer() {
      tone(310, 0.12, 'square', 0.14);
      tone(465, 0.22, 'sawtooth', 0.16, 0.06);
    },
    gavel() {
      tone(130, 0.11, 'triangle', 0.3);
      noiseBurst(0.09, 0.3, 0, 500);
      tone(125, 0.12, 'triangle', 0.3, 0.18);
      noiseBurst(0.1, 0.32, 0.18, 480);
    },
    tick(urgency = 0.2) {
      const pitch = 420 + urgency * 500;
      tone(pitch, 0.055, 'triangle', 0.1 + urgency * 0.1);
    },
    boom() {
      noiseBurst(0.75, 0.45, 0, 380);
      tone(95, 0.55, 'sawtooth', 0.28);
      tone(58, 0.65, 'sine', 0.3, 0.1);
    },
    fanfare() {
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((n, i) => tone(n, 0.26, 'triangle', 0.17, i * 0.09));
    },

    speak(text) {
      if (muted || !voiceEnabled || typeof window === 'undefined' || !window.speechSynthesis) return;
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 1.06;
        u.pitch = 1.04;
        u.volume = 0.95;
        window.speechSynthesis.speak(u);
      } catch (_) {}
    },
    stopSpeech() {
      try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (_) {}
    },

    supportsMic() {
      return typeof window !== 'undefined' && !!(window.SpeechRecognition || window.webkitSpeechRecognition);
    },
    listenOnce({ onResult, onEnd, onError }) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { onError && onError('Speech recognition not supported on this browser.'); return null; }
      const rec = new SR();
      rec.lang = 'en-US';
      rec.interimResults = true;
      rec.continuous = true;
      let finalText = '';
      rec.onresult = (e) => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) finalText += e.results[i][0].transcript + ' ';
          else interim += e.results[i][0].transcript;
        }
        onResult && onResult((finalText + interim).trim());
      };
      rec.onerror = (e) => onError && onError(e.error);
      rec.onend = () => onEnd && onEnd(finalText.trim());
      try { rec.start(); } catch (err) { onError && onError(err.message); }
      return rec;
    }
  };
})();

    { key: 'cape', words: ['cape', 'superhero', 'flying', 'hero', 'cloak', 'soaring'], label: 'Hero Cape' },
  ];

  function parsePrompt(rawPrompt) {
    const text = (rawPrompt || '').toLowerCase();
    const matchRule = (rules) => rules.filter(r => r.words.some(w => text.includes(w)));

    const scenes = matchRule(SCENE_RULES);
    const styles = matchRule(STYLE_RULES);
    const weathers = matchRule(WEATHER_RULES);
    const subjects = matchRule(SUBJECT_RULES);
    const props = matchRule(PROP_RULES);

    const colors = [];
    for (const [name, hex] of Object.entries(COLOR_MAP)) {
      const rx = new RegExp(`\\b${name}\\b`, 'i');
      if (rx.test(text)) colors.push({ name, hex });
    }

    let count = 1;
    if (/\b(three|3)\b/.test(text)) count = 3;
    else if (/\b(two|2|pair|twin|couple|double)\b/.test(text)) count = 2;
    else if (/\b(giant|huge|massive|mega|enormous)\b/.test(text)) count = 1.35;
    else if (/\b(tiny|mini|little|small|baby)\b/.test(text)) count = 0.72;

    return {
      raw: rawPrompt || '',
      scene: scenes[0]?.key || 'forest',
      sceneLabel: scenes[0]?.label || 'Autumn Scene',
      style: styles[0]?.key || 'storybook',
      styleLabel: styles[0]?.label || 'Storybook',
      weathers: weathers.map(w => w.key),
      weatherLabels: weathers.map(w => w.label),
      subjects: subjects.length ? subjects.slice(0, 3).map(s => s.key) : ['turkey'],
      subjectLabels: subjects.length ? subjects.slice(0, 3).map(s => s.label) : ['Turkey'],
      props: props.map(p => p.key),
      propLabels: props.map(p => p.label),
      colors,
      count,
    };
  }

  // ---- Drawing helpers ----
  function drawBackground(ctx, w, h, parsed, rng) {
    const tint = parsed.colors[0]?.hex;
    const grad = ctx.createLinearGradient(0, 0, 0, h);

    switch (parsed.scene) {
      case 'space':
        grad.addColorStop(0, '#0B1026');
        grad.addColorStop(0.65, '#1B234A');
        grad.addColorStop(1, '#3D2748');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        // Stars
        for (let i = 0; i < 65; i++) {
          ctx.fillStyle = `rgba(255,250,230,${0.35 + rng() * 0.65})`;
          ctx.beginPath();
          ctx.arc(rng() * w, rng() * h * 0.78, 0.8 + rng() * 2, 0, Math.PI * 2);
          ctx.fill();
        }
        // Ringed planet
        ctx.save();
        ctx.translate(w * 0.8, h * 0.22);
        ctx.fillStyle = tint && tint !== 'rainbow' ? tint : '#E58A4E';
        ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#F7D794'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.ellipse(0, 2, 44, 11, -0.22, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
        // Crater surface
        ctx.fillStyle = '#B85A3A';
        ctx.beginPath();
        ctx.moveTo(0, h * 0.74);
        ctx.quadraticCurveTo(w * 0.5, h * 0.66, w, h * 0.76);
        ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#8F3F26';
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.ellipse(w * (0.15 + i * 0.24), h * (0.83 + (i % 2) * 0.06), 24, 8, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        break;

      case 'beach':
        grad.addColorStop(0, '#58B4E8');
        grad.addColorStop(0.55, '#A9E4F7');
        grad.addColorStop(1, '#FFE6A7');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        // Sun
        ctx.fillStyle = '#FFD15C';
        ctx.beginPath(); ctx.arc(w * 0.82, h * 0.2, 28, 0, Math.PI * 2); ctx.fill();
        // Ocean
        ctx.fillStyle = '#2B8CBE';
        ctx.fillRect(0, h * 0.58, w, h * 0.22);
        ctx.fillStyle = '#7FD1E8';
        for (let i = 0; i < 6; i++) {
          ctx.fillRect(20 + i * 75, h * 0.64 + (i % 2) * 10, 40, 4);
        }
        // Sand
        ctx.fillStyle = '#F2CF8D';
        ctx.beginPath();
        ctx.moveTo(0, h * 0.74);
        ctx.quadraticCurveTo(w * 0.45, h * 0.68, w, h * 0.78);
        ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fill();
        // Palm tree silhouette
        ctx.strokeStyle = '#7D512D'; ctx.lineWidth = 10;
        ctx.beginPath(); ctx.moveTo(w * 0.12, h * 0.84); ctx.quadraticCurveTo(w * 0.17, h * 0.52, w * 0.2, h * 0.34); ctx.stroke();
        ctx.fillStyle = '#3A874D';
        for (let a = 0; a < 5; a++) {
          ctx.save(); ctx.translate(w * 0.2, h * 0.34); ctx.rotate(-2.4 + a * 1.15);
          ctx.beginPath(); ctx.ellipse(26, 0, 30, 8, 0.2, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }
        break;

      case 'snow':
        grad.addColorStop(0, '#4E7AA8');
        grad.addColorStop(0.6, '#A9CBE8');
        grad.addColorStop(1, '#EFF6FC');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        // Mountains
        const peaks = [[0.18, 0.32], [0.52, 0.26], [0.85, 0.36]];
        peaks.forEach(([px, py]) => {
          ctx.fillStyle = '#7395B8';
          ctx.beginPath(); ctx.moveTo(w * (px - 0.28), h * 0.78); ctx.lineTo(w * px, h * py); ctx.lineTo(w * (px + 0.28), h * 0.78); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath(); ctx.moveTo(w * (px - 0.09), h * (py + 0.16)); ctx.lineTo(w * px, h * py); ctx.lineTo(w * (px + 0.09), h * (py + 0.16)); ctx.closePath(); ctx.fill();
        });
        ctx.fillStyle = '#F7FBFF';
        ctx.fillRect(0, h * 0.72, w, h * 0.28);
        break;

      case 'volcano':
        grad.addColorStop(0, '#3D1518');
        grad.addColorStop(0.6, '#962E22');
        grad.addColorStop(1, '#E87424');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#4A2C2A';
        ctx.beginPath(); ctx.moveTo(w * 0.12, h * 0.8); ctx.lineTo(w * 0.44, h * 0.28); ctx.lineTo(w * 0.56, h * 0.28); ctx.lineTo(w * 0.88, h * 0.8); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#FF9F1C';
        ctx.beginPath(); ctx.moveTo(w * 0.45, h * 0.28); ctx.quadraticCurveTo(w * 0.5, h * 0.52, w * 0.43, h * 0.78); ctx.lineTo(w * 0.55, h * 0.78); ctx.quadraticCurveTo(w * 0.53, h * 0.48, w * 0.55, h * 0.28); ctx.fill();
        ctx.fillStyle = '#3B2320'; ctx.fillRect(0, h * 0.75, w, h * 0.25);
        break;

      case 'city':
        grad.addColorStop(0, '#1D2944');
        grad.addColorStop(0.6, '#485A82');
        grad.addColorStop(1, '#E08E6D');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        // Buildings
        for (let i = 0; i < 9; i++) {
          const bw = 42 + (i % 3) * 14;
          const bh = 80 + ((i * 37) % 110);
          const bx = i * 52;
          ctx.fillStyle = i % 2 ? '#23304A' : '#2E3D5C';
          ctx.fillRect(bx, h * 0.76 - bh, bw, bh);
          ctx.fillStyle = '#FCD36B';
          for (let wy = h * 0.76 - bh + 12; wy < h * 0.72; wy += 16) {
            for (let wx = bx + 8; wx < bx + bw - 10; wx += 12) {
              if ((wx + wy) % 3 !== 0) ctx.fillRect(wx, wy, 6, 8);
            }
          }
        }
        ctx.fillStyle = '#3C4048'; ctx.fillRect(0, h * 0.75, w, h * 0.25);
        ctx.fillStyle = '#F2C14E';
        for (let x = 15; x < w; x += 55) ctx.fillRect(x, h * 0.87, 30, 5);
        break;

      case 'kitchen':
        grad.addColorStop(0, '#F7E7CE');
        grad.addColorStop(1, '#E8CCA5');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        // Window
        ctx.fillStyle = '#9ED0E8'; ctx.fillRect(w * 0.68, h * 0.12, 95, 75);
        ctx.strokeStyle = '#8C5A32'; ctx.lineWidth = 5;
        ctx.strokeRect(w * 0.68, h * 0.12, 95, 75);
        ctx.beginPath(); ctx.moveTo(w * 0.68 + 47.5, h * 0.12); ctx.lineTo(w * 0.68 + 47.5, h * 0.12 + 75); ctx.stroke();
        // Tablecloth & wooden table
        ctx.fillStyle = '#9E2A2B';
        ctx.fillRect(0, h * 0.68, w, h * 0.32);
        ctx.fillStyle = '#FAF2E4';
        for (let x = 0; x < w; x += 40) ctx.fillRect(x, h * 0.68, 20, h * 0.32);
        ctx.fillStyle = 'rgba(158,42,43,0.45)';
        ctx.fillRect(0, h * 0.68, w, 14);
        break;

      case 'underwater':
        grad.addColorStop(0, '#167D9A');
        grad.addColorStop(0.7, '#0D4B68');
        grad.addColorStop(1, '#0A2D42');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        // Bubbles
        ctx.strokeStyle = 'rgba(200,245,255,0.55)'; ctx.lineWidth = 2;
        for (let i = 0; i < 18; i++) {
          ctx.beginPath(); ctx.arc(rng() * w, rng() * h * 0.8, 3 + rng() * 9, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.fillStyle = '#D9B982'; ctx.fillRect(0, h * 0.78, w, h * 0.22);
        break;

      case 'night':
        grad.addColorStop(0, '#0F172A');
        grad.addColorStop(0.7, '#1E294B');
        grad.addColorStop(1, '#312E59');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        // Crescent Moon
        ctx.fillStyle = '#FDE68A';
        ctx.beginPath(); ctx.arc(w * 0.8, h * 0.2, 26, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#141D35';
        ctx.beginPath(); ctx.arc(w * 0.83, h * 0.18, 22, 0, Math.PI * 2); ctx.fill();
        for (let i = 0; i < 45; i++) {
          ctx.fillStyle = '#FEF9C3';
          ctx.beginPath(); ctx.arc(rng() * w, rng() * h * 0.68, 1 + rng() * 1.8, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = '#1D332B'; ctx.fillRect(0, h * 0.74, w, h * 0.26);
        break;

      case 'sunset':
        grad.addColorStop(0, '#4E3168');
        grad.addColorStop(0.45, '#D95D39');
        grad.addColorStop(0.85, '#F4B942');
        grad.addColorStop(1, '#FFE19C');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#FFF3B0';
        ctx.beginPath(); ctx.arc(w * 0.5, h * 0.62, 44, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#5E3828';
        ctx.beginPath(); ctx.moveTo(0, h * 0.72); ctx.quadraticCurveTo(w * 0.35, h * 0.64, w, h * 0.74); ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fill();
        break;

      default: // Autumn woods
        grad.addColorStop(0, '#8EC5E8');
        grad.addColorStop(0.55, '#F5DFC0');
        grad.addColorStop(1, '#EBB678');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        // Warm sun
        ctx.fillStyle = 'rgba(255,232,163,0.9)';
        ctx.beginPath(); ctx.arc(w * 0.82, h * 0.2, 26, 0, Math.PI * 2); ctx.fill();
        // Rolling autumn hills
        ctx.fillStyle = '#C97B36';
        ctx.beginPath(); ctx.moveTo(0, h * 0.66); ctx.quadraticCurveTo(w * 0.3, h * 0.54, w * 0.65, h * 0.68); ctx.quadraticCurveTo(w * 0.88, h * 0.74, w, h * 0.62); ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fill();
        // Autumn trees
        const treeCols = ['#B83B28', '#D97224', '#DF9F28', '#8F3524'];
        for (let i = 0; i < 4; i++) {
          const tx = w * (0.12 + i * 0.25);
          const ty = h * 0.64;
          ctx.fillStyle = '#5C3A21'; ctx.fillRect(tx - 5, ty - 25, 10, 34);
          ctx.fillStyle = treeCols[i % treeCols.length];
          ctx.beginPath(); ctx.arc(tx, ty - 38, 24, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = '#6E8542';
        ctx.beginPath(); ctx.moveTo(0, h * 0.74); ctx.quadraticCurveTo(w * 0.5, h * 0.68, w, h * 0.76); ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fill();
        break;
    }

    // Subtle color tint wash if user explicitly mentioned a standout color
    if (tint && tint !== 'rainbow') {
      ctx.fillStyle = tint + '1C';
      ctx.fillRect(0, 0, w, h);
    }
  }

  function drawWeather(ctx, w, h, parsed, rng) {
    if (parsed.weathers.includes('rainbow') || parsed.colors.some(c => c.name === 'rainbow')) {
      const cols = ['#E63946', '#F48C06', '#F9C74F', '#43AA8B', '#3A86FF', '#8338EC'];
      cols.forEach((col, i) => {
        ctx.strokeStyle = col; ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.arc(w * 0.5, h * 0.72, 175 - i * 7, Math.PI, 0);
        ctx.stroke();
      });
    }
    if (parsed.weathers.includes('snowflakes') || parsed.scene === 'snow') {
      ctx.fillStyle = 'rgba(255,255,255,0.88)';
      for (let i = 0; i < 36; i++) {
        ctx.beginPath(); ctx.arc(rng() * w, rng() * h, 1.8 + rng() * 3, 0, Math.PI * 2); ctx.fill();
      }
    }
    if (parsed.weathers.includes('leaves')) {
      const leafCols = ['#D64528', '#E08E24', '#C4382B', '#EBB134'];
      for (let i = 0; i < 22; i++) {
        ctx.save();
        ctx.translate(rng() * w, rng() * h * 0.85);
        ctx.rotate(rng() * Math.PI * 2);
        ctx.fillStyle = leafCols[i % leafCols.length];
        ctx.beginPath(); ctx.ellipse(0, 0, 8, 4, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    }
    if (parsed.weathers.includes('fireworks')) {
      const bursts = [[w * 0.25, h * 0.24, '#FF595E'], [w * 0.75, h * 0.22, '#FFCA3A'], [w * 0.5, h * 0.16, '#8AC926']];
      bursts.forEach(([bx, by, col]) => {
        ctx.strokeStyle = col; ctx.lineWidth = 2.5;
        for (let a = 0; a < 12; a++) {
          const ang = (a / 12) * Math.PI * 2;
          ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + Math.cos(ang) * 26, by + Math.sin(ang) * 26); ctx.stroke();
        }
      });
    }
    if (parsed.weathers.includes('rain')) {
      ctx.strokeStyle = 'rgba(180,220,255,0.6)'; ctx.lineWidth = 1.6;
      for (let i = 0; i < 45; i++) {
        const rx = rng() * w, ry = rng() * h;
        ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx - 5, ry + 16); ctx.stroke();
      }
    }
  }

  function drawHat(ctx, propKey, x, y, scale = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    if (propKey === 'crown') {
      ctx.fillStyle = '#F2C14E'; ctx.strokeStyle = '#9E6D10'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-22, 6); ctx.lineTo(-26, -16); ctx.lineTo(-10, -4); ctx.lineTo(0, -22); ctx.lineTo(10, -4); ctx.lineTo(26, -16); ctx.lineTo(22, 6);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#D63838'; ctx.beginPath(); ctx.arc(0, -4, 3.5, 0, Math.PI * 2); ctx.fill();
    } else if (propKey === 'wizardhat') {
      ctx.fillStyle = '#3B358C';
      ctx.beginPath(); ctx.ellipse(0, 6, 30, 7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-19, 4); ctx.lineTo(4, -38); ctx.lineTo(20, 4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#F9D649'; ctx.beginPath(); ctx.arc(0, -14, 4, 0, Math.PI * 2); ctx.fill();
    } else if (propKey === 'chefhat') {
      ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = '#D6CFC7'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(-14, -12, 13, 0, Math.PI * 2); ctx.arc(0, -18, 15, 0, Math.PI * 2); ctx.arc(14, -12, 13, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(-18, -6, 36, 15); ctx.strokeRect(-18, -6, 36, 15);
    } else if (propKey === 'pilgrimhat') {
      ctx.fillStyle = '#241E1C';
      ctx.beginPath(); ctx.ellipse(0, 6, 32, 7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-18, 4); ctx.lineTo(-22, -26); ctx.lineTo(22, -26); ctx.lineTo(18, 4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#F2C14E'; ctx.fillRect(-19, -5, 38, 7);
      ctx.strokeStyle = '#241E1C'; ctx.lineWidth = 2.5; ctx.strokeRect(-6, -6, 12, 9);
    }
    ctx.restore();
  }

  function drawSubject(ctx, key, cx, cy, scale, accentColor, props) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);

    // Optional Hero Cape behind subject
    if (props.includes('cape')) {
      ctx.fillStyle = '#C92A2A';
      ctx.beginPath();
      ctx.moveTo(-16, -24); ctx.quadraticCurveTo(-55, 8, -46, 48); ctx.lineTo(14, 34); ctx.closePath();
      ctx.fill();
    }

    // Optional Skateboard underneath
    if (props.includes('skateboard')) {
      ctx.save(); ctx.translate(0, 56);
      ctx.fillStyle = accentColor || '#E06D22';
      ctx.beginPath(); ctx.roundRect(-52, -6, 104, 12, 6); ctx.fill();
      ctx.fillStyle = '#231F20';
      ctx.beginPath(); ctx.arc(-32, 10, 8, 0, Math.PI * 2); ctx.arc(32, 10, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#F2C14E';
      ctx.beginPath(); ctx.arc(-32, 10, 3, 0, Math.PI * 2); ctx.arc(32, 10, 3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    const col = accentColor && accentColor !== 'rainbow' ? accentColor : null;
    let headTopY = -52;

    switch (key) {
      case 'turkey': {
        // Fan tail feathers
        const feathers = ['#9E2A2B', '#D96B27', '#E8A838', '#8C3B24', '#C85A17', '#E09F3E', '#9E2A2B'];
        feathers.forEach((fc, idx) => {
          const ang = -1.2 + idx * 0.4;
          ctx.save(); ctx.rotate(ang);
          ctx.fillStyle = col && idx % 2 === 0 ? col : fc;
          ctx.beginPath(); ctx.ellipse(0, -48, 14, 38, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#F7E3AF';
          ctx.beginPath(); ctx.ellipse(0, -72, 7, 10, 0, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        });
        // Body
        ctx.fillStyle = '#6E3F24';
        ctx.beginPath(); ctx.ellipse(0, 12, 38, 34, 0, 0, Math.PI * 2); ctx.fill();
        // Wings
        ctx.fillStyle = '#542D18';
        ctx.beginPath(); ctx.ellipse(-34, 14, 14, 24, 0.3, 0, Math.PI * 2); ctx.ellipse(34, 14, 14, 24, -0.3, 0, Math.PI * 2); ctx.fill();
        // Legs
        ctx.strokeStyle = '#E08E24'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(-14, 42); ctx.lineTo(-14, 54); ctx.moveTo(14, 42); ctx.lineTo(14, 54); ctx.stroke();
        // Head
        ctx.fillStyle = '#7C492B';
        ctx.beginPath(); ctx.arc(0, -24, 21, 0, Math.PI * 2); ctx.fill();
        // Eyes
        ctx.fillStyle = '#FFF'; ctx.beginPath(); ctx.arc(-8, -28, 6, 0, Math.PI * 2); ctx.arc(8, -28, 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#1C1410'; ctx.beginPath(); ctx.arc(-7, -28, 3, 0, Math.PI * 2); ctx.arc(7, -28, 3, 0, Math.PI * 2); ctx.fill();
        // Wattle & Beak
        ctx.fillStyle = '#D63838'; ctx.beginPath(); ctx.ellipse(7, -14, 5, 11, 0.2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#F2B830'; ctx.beginPath(); ctx.moveTo(-7, -20); ctx.lineTo(7, -20); ctx.lineTo(0, -9); ctx.closePath(); ctx.fill();
        headTopY = -48;
        break;
      }

      case 'pilgrim': {
        // Coat
        ctx.fillStyle = '#2B2625';
        ctx.beginPath(); ctx.roundRect(-28, -4, 56, 56, 12); ctx.fill();
        // White collar
        ctx.fillStyle = '#FFFDF9';
        ctx.beginPath(); ctx.moveTo(-22, -4); ctx.lineTo(22, -4); ctx.lineTo(14, 16); ctx.lineTo(0, 6); ctx.lineTo(-14, 16); ctx.closePath(); ctx.fill();
        // Head
        ctx.fillStyle = '#F2C9A5';
        ctx.beginPath(); ctx.arc(0, -26, 22, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#231F20'; ctx.beginPath(); ctx.arc(-7, -28, 3, 0, Math.PI * 2); ctx.arc(7, -28, 3, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#9E4B3A'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(0, -20, 7, 0.15, Math.PI - 0.15); ctx.stroke();
        drawHat(ctx, 'pilgrimhat', 0, -45, 1);
        headTopY = -72;
        break;
      }

      case 'pie': {
        // Pie tin
        ctx.fillStyle = '#B8C2CC';
        ctx.beginPath(); ctx.moveTo(-48, 12); ctx.lineTo(48, 12); ctx.lineTo(38, 42); ctx.lineTo(-38, 42); ctx.closePath(); ctx.fill();
        // Crust edge
        ctx.fillStyle = '#D9984A';
        ctx.beginPath(); ctx.ellipse(0, 12, 50, 16, 0, 0, Math.PI * 2); ctx.fill();
        // Pumpkin filling
        ctx.fillStyle = col || '#C85A17';
        ctx.beginPath(); ctx.ellipse(0, 11, 41, 12, 0, 0, Math.PI * 2); ctx.fill();
        // Whipped cream dollop
        ctx.fillStyle = '#FFFDF9';

  function applyStyleFilter(canvas, ctx, style) {
    const w = canvas.width, h = canvas.height;
    if (style === 'pixel') {
      const small = document.createElement('canvas');
      small.width = 56; small.height = 38;
      const sctx = small.getContext('2d');
      sctx.drawImage(canvas, 0, 0, 56, 38);
      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(small, 0, 0, 56, 38, 0, 0, w, h);
      ctx.imageSmoothingEnabled = true;
    } else if (style === 'vintage') {
      const img = ctx.getImageData(0, 0, w, h);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i + 1], b = d[i + 2];
        d[i] = Math.min(255, r * 0.393 + g * 0.769 + b * 0.189 + 14);
        d[i + 1] = Math.min(255, r * 0.349 + g * 0.686 + b * 0.168 + 6);
        d[i + 2] = Math.min(255, r * 0.272 + g * 0.534 + b * 0.131);
      }
      ctx.putImageData(img, 0, 0);
      const vig = ctx.createRadialGradient(w / 2, h / 2, w * 0.25, w / 2, h / 2, w * 0.65);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(43,26,12,0.45)');
      ctx.fillStyle = vig; ctx.fillRect(0, 0, w, h);
    } else if (style === 'neon') {
      ctx.globalCompositeOperation = 'multiply';
      ctx.fillStyle = '#3A1C71';
      ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'screen';
      const g = ctx.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, 'rgba(255,0,160,0.28)');
      g.addColorStop(1, 'rgba(0,245,255,0.28)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'source-over';
    } else if (style === 'sketch') {
      const img = ctx.getImageData(0, 0, w, h);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        const v = lum > 155 ? 248 : lum > 95 ? 165 : 42;
        d[i] = v; d[i + 1] = v - 3; d[i + 2] = v - 8;
      }
      ctx.putImageData(img, 0, 0);
    } else if (style === 'watercolor') {
      ctx.fillStyle = 'rgba(255,248,238,0.18)';
      ctx.fillRect(0, 0, w, h);
    }
  }

  function renderToCanvas(canvas, prompt) {
    const w = canvas.width || 440;
    const h = canvas.height || 300;
    const ctx = canvas.getContext('2d');
    const parsed = parsePrompt(prompt);
    const rng = makeRng(prompt);

    ctx.clearRect(0, 0, w, h);
    drawBackground(ctx, w, h, parsed, rng);
    drawWeather(ctx, w, h, parsed, rng);

    const accent = parsed.colors[0]?.hex || null;
    const subs = parsed.subjects;
    const baseScale = typeof parsed.count === 'number' && parsed.count < 2 ? parsed.count : 1;

    if (subs.length === 1 && (parsed.count === 2 || parsed.count === 3)) {
      const n = parsed.count;
      for (let i = 0; i < n; i++) {
        const px = w * ((i + 1) / (n + 1));
        const py = h * 0.62 + (i % 2 === 0 ? 0 : -10);
        drawSubject(ctx, subs[0], px, py, n === 3 ? 0.78 : 0.9, accent, parsed.props);
      }
    } else {
      subs.forEach((sub, idx) => {
        const total = subs.length;
        const px = total === 1 ? w * 0.5 : w * (0.24 + (idx / (total - 1)) * 0.52);
        const py = h * (idx === 0 ? 0.62 : 0.65);
        const sc = (total === 1 ? 1.05 : total === 2 ? 0.88 : 0.74) * baseScale;
        drawSubject(ctx, sub, px, py, sc, idx === 0 ? accent : null, idx === 0 ? parsed.props : []);
      });
    }

    applyStyleFilter(canvas, ctx, parsed.style);
    return parsed;
  }

  function renderDataURL(prompt, w = 440, h = 300) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const parsed = renderToCanvas(c, prompt);
    return { dataUrl: c.toDataURL('image/png'), parsed, canvas: c };
  }

  // Compute perceptual visual similarity between two canvases (0..100)
  function compareCanvases(c1, c2) {
    const gw = 24, gh = 16;
    const sample = (src) => {
      const t = document.createElement('canvas');
      t.width = gw; t.height = gh;
      const g = t.getContext('2d');
      g.drawImage(src, 0, 0, gw, gh);
      return g.getImageData(0, 0, gw, gh).data;
    };
    const d1 = sample(c1);
    const d2 = sample(c2);
    let diffSum = 0;
    const n = gw * gh;
    for (let i = 0; i < d1.length; i += 4) {
      const dr = d1[i] - d2[i];
      const dg = d1[i + 1] - d2[i + 1];
      const db = d1[i + 2] - d2[i + 2];
      diffSum += Math.sqrt(dr * dr + dg * dg + db * db) / 441.67;
    }
    const sim = Math.max(0, 1 - (diffSum / n) * 1.45);
    return Math.round(sim * 100);
  }

  // Grade a Prompt Clone submission against a target challenge
  function gradeCloneSubmission(targetPrompt, userPrompt, targetCanvas, userCanvas) {
    const t = parsePrompt(targetPrompt);
    const u = parsePrompt(userPrompt);
    const breakdown = [];
    let featurePoints = 0;
    let featureMax = 0;

    // 1. Subjects (weight 35)
    featureMax += 35;
    const subHits = t.subjects.filter(s => u.subjects.includes(s));
    const subScore = Math.round((subHits.length / Math.max(1, t.subjects.length)) * 35);
    featurePoints += subScore;
    breakdown.push({
      label: `Subject (${t.subjectLabels.join(' + ')})`,
      hit: subHits.length === t.subjects.length,
      partial: subHits.length > 0 && subHits.length < t.subjects.length,
    });

    // 2. Scene / Setting (weight 25)
    featureMax += 25;
    const sceneHit = t.scene === u.scene;
    if (sceneHit) featurePoints += 25;
    breakdown.push({ label: `Setting (${t.sceneLabel})`, hit: sceneHit });

    // 3. Props / Details (weight 20)
    if (t.props.length > 0) {
      featureMax += 20;
      const propHits = t.props.filter(p => u.props.includes(p));
      featurePoints += Math.round((propHits.length / t.props.length) * 20);
      breakdown.push({
        label: `Details (${t.propLabels.join(', ')})`,
        hit: propHits.length === t.props.length,
        partial: propHits.length > 0 && propHits.length < t.props.length,
      });
    }

    // 4. Weather / Color (weight 10)
    if (t.weathers.length > 0 || t.colors.length > 0) {
      featureMax += 10;
      const wHit = t.weathers.some(w => u.weathers.includes(w));
      const cHit = t.colors.some(c => u.colors.some(uc => uc.name === c.name));
      const hit = (t.weathers.length ? wHit : true) && (t.colors.length ? cHit : true);
      const partial = wHit || cHit;
      if (hit) featurePoints += 10;
      else if (partial) featurePoints += 5;
      const lbl = [...t.weatherLabels, ...t.colors.map(c => c.name)].join(', ');
      breakdown.push({ label: `Mood/Color (${lbl})`, hit, partial: !hit && partial });
    }

    // 5. Art Style (weight 10)
    if (t.style !== 'storybook') {
      featureMax += 10;
      const styleHit = t.style === u.style;
      if (styleHit) featurePoints += 10;
      breakdown.push({ label: `Style (${t.styleLabel})`, hit: styleHit });
    }

    const semanticPct = Math.round((featurePoints / Math.max(1, featureMax)) * 100);
    const visualPct = targetCanvas && userCanvas ? compareCanvases(targetCanvas, userCanvas) : semanticPct;
    // Penalize empty/super-short prompts
    const wordCount = (userPrompt || '').trim().split(/\s+/).filter(Boolean).length;
    let total = Math.round(semanticPct * 0.65 + visualPct * 0.35);
    if (wordCount < 2) total = Math.min(total, 15);
    total = Math.max(5, Math.min(99, total));

    let comment = '';
    if (total >= 88) comment = 'Uncanny clone! Are you secretly the AI that drew this?!';
    else if (total >= 72) comment = 'Spot-on instincts — nailed the big picture and almost every secret detail!';
    else if (total >= 55) comment = 'Solid resemblance! Got the vibe right, with a couple fun plot twists.';
    else if (total >= 35) comment = 'Same universe, totally different movie — hilarious creative remix!';
    else comment = 'Bold abstract interpretation! The AI went on a wild detour with this one.';

    return { score: total, semanticPct, visualPct, breakdown, comment, parsed: u };
  }

    seenIds.add(msg.id);
    if (seenIds.size > 800) {
      const first = seenIds.values().next().value;
      seenIds.delete(first);
    }

    // Automatically reassemble chunked images into IMG_READY events
    if (msg.type === 'IMG_CHUNK' && msg.imgKey && typeof msg.idx === 'number' && msg.total) {
      let buf = chunkBuffers.get(msg.imgKey);
      if (!buf || buf.total !== msg.total) {
        buf = { total: msg.total, parts: new Array(msg.total).fill(null), got: 0 };
        chunkBuffers.set(msg.imgKey, buf);
      }
      if (buf.parts[msg.idx] === null) {
        buf.parts[msg.idx] = msg.data;
        buf.got++;
      }
      if (buf.got === buf.total) {
        const dataUrl = buf.parts.join('');
        chunkBuffers.delete(msg.imgKey);
        const readyMsg = { id: 'img_' + msg.imgKey + '_' + Date.now(), type: 'IMG_READY', imgKey: msg.imgKey, dataUrl };
        listeners.forEach(fn => { try { fn(readyMsg); } catch (e) { console.error(e); } });
      }
      return;
    }

    listeners.forEach(fn => {
      try { fn(msg); } catch (e) { console.error(e); }
    });
  }

  async function detectTransport() {
    if (typeof window === 'undefined') return 'local';
    const proto = window.location.protocol;
    if (proto === 'http:' || proto === 'https:') {
      try {
        const res = await fetch('/api/info', { cache: 'no-store' });
        if (res.ok) {
          const info = await res.json();
          if (info && info.lanUrl) {
            lanBaseUrl = info.lanUrl;
            mode = 'lan';
            return mode;
          }
        }
      } catch (_) {}

      if (proto === 'https:' || proto === 'http:') {
        mode = 'cloud';
        return mode;
      }
    }
    mode = 'local';
    return mode;
  }

  function topicName(code) {
    return 'tgfeast26_' + (code || 'DEMO').toUpperCase().replace(/[^A-Z0-9]/g, '');
  }

  async function pollNow() {
    if (mode !== 'cloud' || !roomCode) return;
    try {
      const topic = topicName(roomCode);
      const res = await fetch(`https://ntfy.sh/${topic}/json?poll=1&since=5m`, { cache: 'no-store' });
      if (!res.ok) return;
      const text = await res.text();
      const lines = text.trim().split('\n').filter(Boolean);
      for (const line of lines) {
        try {
          const outer = JSON.parse(line);
          if (outer && outer.message) {
            emit(JSON.parse(outer.message));
          }
        } catch (_) {}
      }
    } catch (_) {}
  }

  function connect(code) {
    disconnect();
    roomCode = (code || genCode(4)).toUpperCase();

    if (typeof BroadcastChannel !== 'undefined') {
      try {
        bc = new BroadcastChannel('tg_room_' + roomCode);
        bc.onmessage = (ev) => emit(ev.data);
      } catch (_) {}
    }

    if (mode === 'lan') {
      try {
        es = new EventSource(`/api/room/${encodeURIComponent(roomCode)}/events`);
        es.onmessage = (ev) => {
          try { emit(JSON.parse(ev.data)); } catch (_) {}
        };
      } catch (_) {}
    } else if (mode === 'cloud') {
      try {
        const topic = topicName(roomCode);
        es = new EventSource(`https://ntfy.sh/${topic}/sse?since=5m`);
        es.onmessage = (ev) => {
          try {
            const outer = JSON.parse(ev.data);
            if (outer && outer.message) {
              emit(JSON.parse(outer.message));
            }
          } catch (_) {}
        };
        es.onerror = () => {};
      } catch (_) {}

      // Gentle safety poll + instant wake poll for mobile Safari/Chrome sleeping tabs
      pollNow();
      pollTimer = setInterval(() => {
        if (typeof document === 'undefined' || !document.hidden) pollNow();
      }, 4000);
      if (typeof document !== 'undefined') {
        wakeHandler = () => { if (!document.hidden) pollNow(); };
        document.addEventListener('visibilitychange', wakeHandler);
        window.addEventListener('focus', wakeHandler);
      }
    }

    return roomCode;
  }

  function disconnect() {
    if (es) { try { es.close(); } catch (_) {} es = null; }
    if (bc) { try { bc.close(); } catch (_) {} bc = null; }
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    if (wakeHandler && typeof document !== 'undefined') {
      document.removeEventListener('visibilitychange', wakeHandler);
      window.removeEventListener('focus', wakeHandler);
      wakeHandler = null;
    }
  }

  async function send(payload) {
    const msg = {
      ...payload,
      id: clientId + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      sender: clientId,
      ts: Date.now(),
    };
    seenIds.add(msg.id);

    if (bc) {
      try { bc.postMessage(msg); } catch (_) {}
    }

    if (mode === 'lan' && roomCode) {
      try {
        await fetch(`/api/room/${encodeURIComponent(roomCode)}/send`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(msg),
        });
      } catch (_) {}
    } else if (mode === 'cloud' && roomCode) {
      const topic = topicName(roomCode);
      const bodyStr = JSON.stringify(msg);
      for (let attempt = 0; attempt < 3; attempt++) {
        try {
          const res = await fetch(`https://ntfy.sh/${topic}`, {
            method: 'POST',
            body: bodyStr,
          });
          if (res.ok) break;
          if (res.status === 429) await new Promise(r => setTimeout(r, 900 * (attempt + 1)));
          else break;
        } catch (_) { break; }
      }
    }
    return msg;
  }

  function dataUrlToBlob(dataUrl) {
    const parts = String(dataUrl).split(',');
    const mimeMatch = parts[0].match(/:(.*?);/);
    const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
    const bstr = atob(parts[1] || '');
    const u8 = new Uint8Array(bstr.length);
    for (let i = 0; i < bstr.length; i++) u8[i] = bstr.charCodeAt(i);
    return new Blob([u8], { type: mime });
  }

  // Upload a high-res JPEG in ONE single HTTP request and return a direct HTTPS/LAN URL shareable with all 10+ phones!
  async function uploadImage(dataUrl) {
    if (!dataUrl || !roomCode) return null;
    try {
      const blob = dataUrlToBlob(dataUrl);
      if (mode === 'lan') {
        const res = await fetch('/api/upload', {
          method: 'POST',
          headers: { 'Content-Type': blob.type },
          body: blob,
        });
        if (res.ok) {
          const j = await res.json();
          if (j && j.url) return j.url;
        }
      } else if (mode === 'cloud') {
        const mediaTopic = topicName(roomCode) + '_media';
        for (let attempt = 0; attempt < 3; attempt++) {
          const res = await fetch(`https://ntfy.sh/${mediaTopic}?filename=art.jpg`, {
            method: 'POST',
            headers: { 'Content-Type': blob.type },
            body: blob,
          });
          if (res.ok) {
            const j = await res.json();
            if (j?.attachment?.url) return j.attachment.url;
            break;
          }
          if (res.status === 429) await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));
          else break;
        }
      }
    } catch (_) {}
    return null;
  }

  // Upload an atomic JSON payload (e.g., all 10+ ranked Prompt Clone results + Nano Banana image URLs) in ONE request!
  async function uploadJSON(obj, filename = 'results.json') {
    if (!obj || !roomCode) return null;
    try {
      const bodyStr = JSON.stringify(obj);
      if (mode === 'lan') {
        const res = await fetch('/api/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: bodyStr,
        });
        if (res.ok) {
          const j = await res.json();
          if (j && j.url) return j.url;
        }
      } else if (mode === 'cloud') {
        const mediaTopic = topicName(roomCode) + '_media';
        for (let attempt = 0; attempt < 3; attempt++) {
          const res = await fetch(`https://ntfy.sh/${mediaTopic}?filename=${encodeURIComponent(filename)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: bodyStr,
          });
          if (res.ok) {
            const j = await res.json();
            if (j?.attachment?.url) return j.attachment.url;
            break;
          }
          if (res.status === 429) await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));
          else break;
        }
      }
    } catch (_) {}
    return null;
  }

  // Fallback chunked transfer if direct upload unavailable
  async function sendImage(imgKey, dataUrl) {
    if (!imgKey || !dataUrl) return;
    const CHUNK_SIZE = 2200;
    const total = Math.ceil(dataUrl.length / CHUNK_SIZE);
    for (let i = 0; i < total; i++) {
      await send({
        type: 'IMG_CHUNK',
        imgKey,
        idx: i,
        total,
        data: dataUrl.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE),
      });
      if (mode === 'cloud' && total > 1) {
        await new Promise(r => setTimeout(r, 220));
      }
    }
  }

  function onMessage(fn) {
    listeners.push(fn);
    return () => { listeners = listeners.filter(x => x !== fn); };
  }

  function getJoinUrl(customBase) {
    if (customBase && customBase.trim()) {
      const clean = customBase.trim().replace(/\/+$/, '');
      return `${clean}/?room=${roomCode}&join=1`;
    }
    if (lanBaseUrl) {
      return `${lanBaseUrl}/?room=${roomCode}&join=1`;
    }
    if (typeof window !== 'undefined' && /^https?:/.test(window.location.protocol)) {
      const u = new URL(window.location.href);
      u.search = `?room=${roomCode}&join=1`;
      u.hash = '';
      return u.toString();
    }
    return `https://thanksgiving-game-night.local/?room=${roomCode}&join=1`;
  }

  return {
    genCode,
    detectTransport,
    connect,
    disconnect,
    pollNow,
    send,
    uploadImage,
    uploadJSON,
    sendImage,
    onMessage,
    getJoinUrl,
    getMode: () => mode,
    getRoomCode: () => roomCode,
    getClientId: () => clientId,
    setLanBaseUrl: (u) => { lanBaseUrl = u; },
  };
})();

    function buildTarget() {
      if (customTargetImg) {
        targetArt = { dataUrl: customTargetImg, canvas: null, parsed: AIArt.parsePrompt(customTargetDesc || target.secretPrompt) };
      } else {
        targetArt = AIArt.renderDataURL(target.secretPrompt, 440, 300);
      }
    }

    function makeThumb(dataUrl, maxW = 640, quality = 0.78) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas');
          const scale = Math.min(1, maxW / (img.width || maxW));
          c.width = Math.max(1, Math.round((img.width || maxW) * scale));
          c.height = Math.max(1, Math.round((img.height || Math.round(maxW * 0.72)) * scale));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => resolve(null);
        img.src = dataUrl;
      });
    }

    function getTargetImageHtml() {
      if (customTargetImg) {
        return `<img src="${customTargetImg}" alt="Target AI Image" />`;
      }
      if (target.asset) {
        return `<img src="${target.asset}" alt="Target AI Image" onerror="this.src='${targetArt.dataUrl}'" />`;
      }
      return `<img src="${targetArt.dataUrl}" alt="Target AI Image" />`;
    }

    function toCompactResult(r, i) {
      const item = {
        rk: i,
        id: r.player.id,
        n: String(r.player.name || 'Player').slice(0, 18),
        av: r.player.avatar || '🦃',
        p: String(r.prompt || '').slice(0, 140),
        s: r.score,
        pts: r.pointsAwarded,
        c: String(r.comment || '').slice(0, 80),
        src: r.imgSource || 'builtin',
      };
      const directUrl = r.sharedUrl || r.aiUrl || null;
      if (directUrl) item.url = directUrl;
      else if (r.aiDataUrl) item.k = `res_${roundId}_${r.player.id}`;
      if (r.autoCollected) item.auto = 1;
      return item;
    }

    let resultsUrl = null; // Atomic hosted JSON containing ALL ranked participants + direct image URLs

    function broadcastPhoneState() {
      // Embed results directly in HOST_STATE only if <= 3 players (keeps packet safely < 1.6KB for ntfy.sh!)
      const inlineResults = (phase === 'results' && gradedResults.length <= 3)
        ? gradedResults.map((r, i) => toCompactResult(r, i))
        : null;

      App.broadcastHostState('promptClone', phase, {
        roundId,
        challengeId: customTargetImg ? null : target.id,
        asset: customTargetImg ? (customTargetUrl || null) : (target.asset || null),
        hasCustomTarget: !!customTargetImg,
        title: customTargetImg ? 'Custom Target Image' : target.title,
        tips: customTargetImg ? 'Study every object, color, setting, and style in this image!' : target.tips,
        difficulty: customTargetImg ? 'Custom' : target.difficulty,
        timeLeft,
        submittedIds: Object.keys(submissions),
        gradingStatus,
        originalPrompt: phase === 'results' ? (customTargetImg ? (customTargetDesc || 'Custom Image') : target.secretPrompt) : null,
        totalResults: phase === 'results' ? gradedResults.length : 0,
        resultsUrl: phase === 'results' ? resultsUrl : null,
        results: inlineResults,
      });
    }

    async function broadcastResultsToPhones() {
      // If atomic resultsUrl upload succeeded, phones fetch ALL ranked results in 1 GET request from HOST_STATE!
      // Only fall back to CLONE_RESULTS_BATCH streaming if resultsUrl wasn't available (e.g. BroadcastChannel).
      if (!resultsUrl) {
        const BATCH = 3;
        const compactAll = gradedResults.map((r, i) => toCompactResult(r, i));
        for (let i = 0; i < compactAll.length; i += BATCH) {
          await RoomSync.send({
            type: 'CLONE_RESULTS_BATCH',
            roundId,
            items: compactAll.slice(i, i + BATCH),
          });
          if (RoomSync.getMode() === 'cloud' && i + BATCH < compactAll.length) {
            await new Promise(r => setTimeout(r, 320));
          }
        }
      }
      // Only chunk fallback images that didn't get a direct sharedUrl
      for (let i = 0; i < gradedResults.length; i++) {
        const r = gradedResults[i];
        if (r.aiDataUrl && !r.sharedUrl && !r.aiUrl) {
          const imgKey = `res_${roundId}_${r.player.id}`;
          const thumb = await makeThumb(r.aiDataUrl, 340, 0.62);
          if (thumb) await RoomSync.sendImage(imgKey, thumb);
        }
      }
    }

    function ensureGuestPlayer(msg) {
      let p = App.getPlayers().find(x => x.id === msg.playerId);
      if (!p) {
        p = App.addPlayer({
          id: msg.playerId,
          name: msg.playerName || 'Guest',
          ageGroup: msg.ageGroup || 'adult',
          avatar: msg.avatar || '🦃',
          remote: true,
        });
      }
      return p;
    }

    function onPhoneAction(msg) {
      if (phase !== 'writing' && phase !== 'collecting') return;
      if (msg.action === 'CLONE_DRAFT' && msg.playerId && typeof msg.value === 'string') {
        const clean = msg.value.trim();
        if (!clean) { delete drafts[msg.playerId]; return; }
        const p = ensureGuestPlayer(msg);
        drafts[msg.playerId] = {
          text: clean,
          playerName: p ? p.name : (msg.playerName || 'Guest'),
          avatar: p ? p.avatar : (msg.avatar || '🦃'),
          ts: Date.now(),
        };
        if (phase === 'writing') render();
        return;
      }
      if (msg.action === 'SUBMIT_CLONE_PROMPT' && msg.playerId && msg.value) {
        const clean = String(msg.value).trim();
        if (!clean) return;
        const p = ensureGuestPlayer(msg);
        submissions[msg.playerId] = {
          text: clean,
          playerName: p ? p.name : (msg.playerName || 'Guest'),
          avatar: p ? p.avatar : (msg.avatar || '🦃'),
          autoCollected: !!msg.autoCollected,
          ts: Date.now(),
        };
        delete drafts[msg.playerId];
        if (phase === 'writing') {
          SoundFX.pop();
          broadcastPhoneState();
          render();
        }
      }
    }

    async function startWriting() {
      buildTarget();
      roundId = Date.now();
      submissions = {};
      drafts = {};
      gradedResults = [];
      resultsUrl = null;
      timeLeft = durationSec;
      phase = 'writing';
      if (customTargetImg && customTargetThumb && !customTargetUrl) {
        customTargetUrl = await RoomSync.uploadImage(customTargetThumb);
      }
      SoundFX.ding();
      SoundFX.speak(`Prompt Clone! Study the image carefully. You have ${Math.round(durationSec / 60)} minutes to write an AI prompt that recreates it as closely as possible!`);
      broadcastPhoneState();
      if (customTargetImg && customTargetThumb && !customTargetUrl) {
        RoomSync.sendImage(`target_${roundId}`, customTargetThumb);
      }
      if (timer) clearInterval(timer);
      timer = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 10 && timeLeft > 0) SoundFX.tick(0.7);
        if (timeLeft <= 0) {
          clearInterval(timer); timer = null;
          beginCollectAndGrade();
          return;
        }
        const el = document.getElementById('clone-timer');
        if (el) {
          el.textContent = fmtTime(timeLeft);
          if (timeLeft <= 15) el.classList.add('urgent');
        }
      }, 1000);
      render();
    }

    // Auto-collect every participant's typed draft (even if they didn't press Lock In!) before grading
    function beginCollectAndGrade() {
      if (timer) { clearInterval(timer); timer = null; }
      if (collectTimer) { clearTimeout(collectTimer); collectTimer = null; }
      phase = 'collecting';
      gradingStatus = '⏱️ Time\'s up! Auto-collecting everyone\'s typed prompts (even if they didn\'t tap Lock In)...';
      SoundFX.buzzer();
      broadcastPhoneState();
      render();

      collectTimer = setTimeout(() => {
        collectTimer = null;
        // Merge any auto-saved drafts that weren't explicitly locked in!
        for (const [pid, d] of Object.entries(drafts)) {
          if (!submissions[pid] && d && d.text) {
            submissions[pid] = { ...d, autoCollected: true };
          }
        }
        const total = Object.values(submissions).filter(s => s && s.text).length;
        if (total === 0) {
          phase = 'writing';
          gradingStatus = 'No prompts typed yet — type at least one prompt to generate images!';
          broadcastPhoneState();
          render();
          return;
        }
        gradeAll();
      }, 2000);
    }

    async function assetToThumbDataUrl(assetPath) {
      if (!assetPath) return null;
      try {
        const res = await fetch(assetPath);
        if (!res.ok) return null;
        const blob = await res.blob();
        const raw = await new Promise((resolve) => {
          const fr = new FileReader();
          fr.onload = () => resolve(fr.result);
          fr.onerror = () => resolve(null);
          fr.readAsDataURL(blob);
        });
        return raw ? await makeThumb(raw, 420, 0.72) : null;
      } catch (_) {
        return null;
      }
    }

    async function gradeAll() {
      if (timer) { clearInterval(timer); timer = null; }
      phase = 'grading';
      gradingStatus = 'Preparing Google Nano Banana AI generation & visual grading...';
      broadcastPhoneState();
      render();

      const liveCfg = LiveAI.loadSettings();
      const refPrompt = customTargetImg ? (customTargetDesc || target.secretPrompt) : target.secretPrompt;
      const players = App.getPlayers();
      const entries = Object.entries(submissions).filter(([, sub]) => sub && sub.text);

      // Prepare target thumbnail for Gemini Vision side-by-side grading when Gemini key is set
      let targetVisionDataUrl = null;
      if (liveCfg.provider === 'gemini' && liveCfg.apiKey) {
        targetVisionDataUrl = customTargetImg
          ? await makeThumb(customTargetImg, 420, 0.72)
          : await assetToThumbDataUrl(target.asset);
      }

      const results = new Array(entries.length);
      let completedCount = 0;
      let aiWarning = '';

      async function processOne(i) {
        const [pid, sub] = entries[i];
        const p = players.find(x => x.id === pid) || {
          id: pid,
          name: sub.playerName || 'Player',
          avatar: sub.avatar || '🦃',
        };
        const gen = AIArt.renderDataURL(sub.text, 440, 300);

        // 1. Generate real AI image (Google Nano Banana / OpenAI DALL-E 3 / Pollinations)
        const aiImg = await LiveAI.generateImage(sub.text, idx * 31 + p.name.length + i);
        if (aiImg.error && !aiWarning) aiWarning = aiImg.error;

        // 2. Upload crisp JPEG of any generated AI image in 1 single HTTP request so ALL 10+ phones see EVERY player's real Nano Banana image!
        let sharedUrl = aiImg.url || null;
        if (!sharedUrl && aiImg.dataUrl) {
          const hiRes = await makeThumb(aiImg.dataUrl, 640, 0.78);
          if (hiRes) {
            sharedUrl = await RoomSync.uploadImage(hiRes);
          }
        }

        // 3. Grade resemblance (Gemini Vision side-by-side comparison if Nano Banana succeeded, else LLM/built-in)
        let grade = AIArt.gradeCloneSubmission(refPrompt, sub.text, targetArt?.canvas, gen.canvas);
        if (liveCfg.provider === 'gemini' && liveCfg.apiKey && targetVisionDataUrl && aiImg.dataUrl) {
          const playerThumb = await makeThumb(aiImg.dataUrl, 420, 0.72);
          const vis = await LiveAI.gradeImagesWithVision(targetVisionDataUrl, playerThumb, refPrompt, sub.text, p.name);
          if (vis && typeof vis.score === 'number') {
            grade.score = Math.max(5, Math.min(100, Math.round(vis.score)));
            if (vis.comment) grade.comment = vis.comment;
          }
        } else if (liveCfg.apiKey && liveCfg.provider !== 'builtin') {
          const llm = await LiveAI.askJSON(
            'You are a witty AI art judge for a family Thanksgiving Prompt Clone game. Compare the target image description to the player\'s prompt and grade resemblance 0-100.',
            `Original target image prompt: "${refPrompt}"\nPlayer "${p.name}" wrote: "${sub.text}"\nReturn JSON: {"score": number 0-100, "comment": "1 funny sentence of praise/roast"}`
          );
          if (llm && typeof llm.score === 'number') {
            grade.score = Math.max(5, Math.min(100, Math.round(llm.score)));
            if (llm.comment) grade.comment = llm.comment;
          }
        }

        results[i] = {
          player: p,
          prompt: sub.text,
          dataUrl: gen.dataUrl,
          aiUrl: aiImg.url,
          aiDataUrl: aiImg.dataUrl,
          sharedUrl,
          imgSource: aiImg.source,
          autoCollected: !!sub.autoCollected,
          ...grade,
        };

        completedCount++;
        gradingStatus = `🍌 Generated ${completedCount}/${entries.length} AI images (${p.name} done!)...`;
        broadcastPhoneState();
        const stEl = document.getElementById('clone-grading-status');
        if (stEl) stEl.textContent = gradingStatus;
      }

      // Run 3 in parallel so 10 Nano Banana images complete ~3x faster!
      const CONCURRENCY = 3;
      for (let start = 0; start < entries.length; start += CONCURRENCY) {
        const slice = [];
        for (let j = start; j < Math.min(entries.length, start + CONCURRENCY); j++) {
          slice.push(processOne(j));
        }
        await Promise.all(slice);
      }

      results.sort((a, b) => b.score - a.score);
      gradedResults = results;
      gradedResults._warning = aiWarning;

      results.forEach((r, rank) => {
        const bonus = rank === 0 ? 100 : rank === 1 ? 50 : 0;
        const pts = Math.round(r.score * 2) + bonus;
        r.pointsAwarded = pts;
        App.addScore(r.player.id, pts);
      });

      // Upload ONE atomic JSON containing ALL ranked participants + full prompts + direct Nano Banana image URLs!
      const fullPayload = {
        roundId,
        items: results.map((r, i) => ({
          ...toCompactResult(r, i),
          p: r.prompt || '',
          c: r.comment || '',
          bd: (r.breakdown || []).slice(0, 6),
        })),
      };
      resultsUrl = await RoomSync.uploadJSON(fullPayload, `results_${roundId}.json`);

      phase = 'results';
      gradingStatus = '';
      SoundFX.fanfare();
      if (results.length > 0) {
        SoundFX.speak(`Grading complete! ${results[0].player.name} wins with a ${results[0].score} percent match!`);
      }
      broadcastPhoneState();
      render();
      broadcastResultsToPhones();
    }

      if (phase === 'grading') {
        root.innerHTML = `
          <div class="card center stack" style="padding:48px 20px;">
            <div style="font-size:3.2rem;">🤖🎨</div>
            <h2>AI is Regenerating Everyone's Images &amp; Grading...</h2>
            <p class="muted" id="clone-grading-status">${esc(gradingStatus || 'Comparing subjects, composition, palette, props, and art style!')}</p>

      if (phase === 'results') {

            <div class="clone-gallery">

                return `
